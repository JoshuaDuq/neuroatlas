<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A precise, source-faithful atlas of the human brain built on a full-resolution FreeSurfer reconstruction."
    />
    <title>Planum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Every view here is a shareable link, so a share that renders as a bare
      URL is a view nobody opens. The absolute URL is the published site: a
      relative one resolves against the sharing service, not against this page.
    -->
    <link rel="canonical" href="https://planumatlas.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Planum" />
    <meta property="og:title" content="Planum — a real human brain, explored in your browser" />
    <meta
      property="og:description"
      content="Explore, cut and measure one person's MRI-reconstructed brain: four cortical atlases, 514 NextBrain labels, 30 diffusion tracts, 70 function maps, 70 deficit profiles and 35 guided tours. Nothing to install."
    />
    <meta property="og:url" content="https://planumatlas.com/" />
    <meta property="og:image" content="https://planumatlas.com/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="One person's MRI-reconstructed brain on a dark field: a translucent cortex, each Destrieux region in its own colour, over diffusion tract bundles coloured by local direction, with the cerebellar lobules below."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      The reader's theme and language, applied before the first paint so neither flashes the
      other's value (decision 2 on #4). Each rule is the app's own, restated here because the
      app has not loaded: theme is `resolveTheme` (src/lib/state/theme.svelte.ts), language is
      `startLanguage` with the link's `lang` (src/lib/state/language.svelte.ts), keys are PREF_KEYS
      (src/lib/state/prefs.ts) and the two theme-color values are --surface-base in tokens.css.
      src/app/head-script.test.ts holds them equal. Site data can be blocked, which makes reading
      localStorage throw.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        var saved = null;
        try {
          theme = localStorage.getItem('planum.theme');
          saved = localStorage.getItem('planum-lang');
        } catch (blocked) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        // A repeated `lang` is rejected by decodeState, so it decides nothing here either.
        var values = new URLSearchParams(location.hash.replace(/^#/, '')).getAll('lang');
        var linked = values.length === 1 ? values[0] : null;
        root.dataset.theme = theme;
        root.lang = linked === 'en' || linked === 'fr' ? linked : saved === 'fr' ? 'fr' : 'en';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#1b1e21' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <!--
      Only ever painted when scripts are off. It is plain HTML, so it is English; the app's own
      strings are bilingual because the app can read the reader's language.
    -->
    <noscript>
      <div class="noscript-notice">
        <h1>Planum</h1>
        <p>
          An interactive atlas of one person's brain, built on a full-resolution FreeSurfer
          reconstruction: 148 Destrieux regions, 360 HCP-MMP areas, 483 histological labels, gyral
          white matter, and solid anatomical cuts with exact source labels.
        </p>
        <p>
          It renders the anatomy in your browser with WebGL 2, so it needs JavaScript enabled. The
          published model assets and their provenance are available without it:
          <a href="models/anatomies.json">the anatomy index</a>, and the source and method are
          documented in the project's README.
        </p>
      </div>
    </noscript>
    <div id="app" data-status="loading"></div>
    <!-- In the initial HTML, so it exists before the first message (decision 18 on #4); announcer.svelte.ts takes it over. -->
    <p id="announcer" role="status" aria-live="polite" class="visually-hidden"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
