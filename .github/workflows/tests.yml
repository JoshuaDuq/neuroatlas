name: Tests

on:
  pull_request:
    branches: [main, svelte-rebuild]
  # Called by the deploy workflow, which publishes nothing unless this passes.
  workflow_call:
  # Runs everything, including the end-to-end tests that pull requests skip.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Python suite and the anatomy validation take minutes, so they run only
  # when something they read has changed. A job skipped by its `if` reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      python: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.python == 'true' }}
      validate: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.validate == 'true' }}
      web: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.web == 'true' }}
    steps:
      # Commits and trees only: enough to list changed paths without the 400 MB of assets.
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      # On main, compare against the last commit that deployed, so a push after a
      # failed run is still checked for everything that has not passed since.
      # A manual run, or one with no deployed commit to compare against, runs everything.
      - name: Find the last deployed commit
        id: base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$sha" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests are compared with their base branch through the API.
      - name: Detect changed paths
        id: filter
        if: steps.base.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            validate: &validate
              - brain_model/**
              - config/**
              - data/**
              - public/**
              - pyproject.toml
              - uv.lock
              - .github/workflows/tests.yml
            python:
              - *validate
              - tests/**
              - scripts/**/*.py
            # The Svelte app and what it reads.
            web:
              - web/**
              - config/**
              - data/**
              - public/**
              - scripts/published-version.mjs
              - .github/scripts/**
              - .github/workflows/tests.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # One worker per runner core; every test writes only under its own tmp_path.
      # Work stealing keeps the few 10-25 s NextBrain tests from piling onto one worker.
      - name: Run Python tests
        run: uv run pytest -n auto --dist worksteal

  validate:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        anatomy: [cdmd]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Re-checks every published asset of this anatomy against its sources.
      - name: Validate the published anatomy
        run: uv run python -m brain_model.validate --anatomy ${{ matrix.anatomy }}

  web-check:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Lint
        run: npm run lint --prefix web

      - name: Check formatting
        run: npm run format --prefix web -- --check

      - name: Type-check (TypeScript 6 and svelte-check)
        run: npm run check --prefix web

      - name: Type-check (TypeScript 7)
        run: npm run check:ts7 --prefix web

      - name: Run unit tests
        run: npm test --prefix web

      # What deploy ships, checked once for the chunks, the page's head and the service worker's
      # version map; it also hashes the real public/ tree.
      - name: Build the site and check it
        run: |
          npm run build --prefix web
          node .github/scripts/check-dist.mjs

      # Bits UI plus the Svelte runtime, as web/docs/decisions/0001-ui-kit.md defines the budget.
      - name: Check the UI bundle budget
        shell: bash
        run: |
          node .github/scripts/ui-bundle-budget.mjs | tee ui-budget.log
          cat ui-budget.log >> "$GITHUB_STEP_SUMMARY"

  # In Playwright's image (Playwright's CI guide): Chromium, its system libraries and Xvfb are
  # already there, so nothing is installed per run. Installing them took 25 s, or 6 to 11 min when
  # an apt mirror was slow (12 runs in 67). The tag must equal the Playwright version in
  # web/package-lock.json; the first step fails if a dependency update moves one without the other.
  # Four shards: the browser suite is about 11 min on one runner (Vitest's sharding guide).
  web-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Check the image matches Playwright
        run: |
          version=$(node -p "require('./web/node_modules/playwright-core/package.json').version")
          test "$version" = 1.64.1 || { echo "::error::Playwright is $version; set the container image tag in tests.yml to v$version-noble"; exit 1; }

      # Headed under Xvfb, so the browser has a mouse: headless Linux has no pointing device and
      # matches (hover: none) and (pointer: none), where a desktop matches hover and a fine pointer.
      # A launch flag cannot stand in for it, as switching touch emulation off restores the device's.
      # Includes the WebGL probe (src/boot/webgl-probe.svelte.test.ts); its renderer line goes to
      # the job summary of the shard that runs it.
      - name: Run browser tests, shard ${{ matrix.shard }}/4
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm run test:browser --prefix web -- --browser.headless=false --shard=${{ matrix.shard }}/4 2>&1 | tee browser-tests.log
          if grep -qh 'WebGL renderer' browser-tests.log; then
            { echo '### WebGL probe'; grep -h 'WebGL renderer' browser-tests.log; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-failures-${{ matrix.shard }}
          path: |
            web/src/**/__screenshots__/
            web/.vitest/attachments/
          if-no-files-found: ignore

  # A few journeys on the built Svelte preview (web/e2e/journeys), on one runner. It runs only when
  # started by hand (Actions → Tests → Run workflow), not on pull requests or pushes.
  web-e2e:
    needs: changes
    # By hand only (Actions → Tests → Run workflow): e2e is not a gate for pull requests or the deploy.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      # The server (web/e2e/serve-site.mjs) serves web/dist at /neuroatlas/, as Pages does.
      - name: Build the site
        run: npm run build --prefix web

      # Playwright's CI guide: one worker per job. One retry, and a test that needed it fails the job.
      - name: Run end-to-end tests
        run: npm run test:e2e --prefix web -- --workers=1 --retries=1 --fail-on-flaky-tests --global-timeout=2400000

      - name: Upload failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-failures
          path: |
            web/test-results/
          if-no-files-found: ignore
