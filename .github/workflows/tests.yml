name: Tests

on:
  pull_request:
    branches: [main, svelte-rebuild]
  # Called by the deploy workflow, which publishes nothing unless this passes.
  workflow_call:
  # Runs everything, including the end-to-end tests that pull requests skip.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Python suite and the anatomy validation take minutes, so they run only
  # when something they read has changed. A job skipped by its `if` reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      python: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.python == 'true' }}
      validate: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.validate == 'true' }}
      web: ${{ steps.base.outputs.full == 'true' || steps.filter.outputs.web == 'true' }}
    steps:
      # Commits and trees only: enough to list changed paths without the 400 MB of assets.
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      # On main, compare against the last commit that deployed, so a push after a
      # failed run is still checked for everything that has not passed since.
      # A manual run, or one with no deployed commit to compare against, runs everything.
      - name: Find the last deployed commit
        id: base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$sha" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests are compared with their base branch through the API.
      - name: Detect changed paths
        id: filter
        if: steps.base.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            validate: &validate
              - brain_model/**
              - config/**
              - data/**
              - public/**
              - pyproject.toml
              - uv.lock
              - .github/workflows/tests.yml
            python:
              - *validate
              - tests/**
              - scripts/**/*.py
            # The Svelte app, what it reads, and the legacy app it is compared with.
            web:
              - web/**
              - config/**
              - data/**
              - public/**
              - scripts/published-version.mjs
              - viewer/**
              - index.html
              - vite.config.js
              - package*.json
              - .github/scripts/**
              - .github/workflows/tests.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # One worker per runner core; every test writes only under its own tmp_path.
      # Work stealing keeps the few 10-25 s NextBrain tests from piling onto one worker.
      - name: Run Python tests
        run: uv run pytest -n auto --dist worksteal

  validate:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        anatomy: [cdmd]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Re-checks every published asset of this anatomy against its sources.
      - name: Validate the published anatomy
        run: uv run python -m brain_model.validate --anatomy ${{ matrix.anatomy }}

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run viewer tests
        run: npm test

  # The parity tests import the legacy modules, so the root dependencies are installed too.
  web-check:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Lint
        run: npm run lint --prefix web

      - name: Check formatting
        run: npm run format --prefix web -- --check

      - name: Type-check (TypeScript 6 and svelte-check)
        run: npm run check --prefix web

      - name: Type-check (TypeScript 7)
        run: npm run check:ts7 --prefix web

      - name: Run unit and parity tests
        run: npm test --prefix web

  web-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      # No browser cache: the download is small next to the cache's restore time.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # Includes the WebGL probe (src/boot/webgl-probe.svelte.test.ts); its renderer
      # line goes to the job summary. If it fails on the runner, apply the fallback in that file.
      # Headed under Xvfb, so the browser has a mouse: headless Linux has no pointing device and
      # matches (hover: none) and (pointer: none), where a desktop matches hover and a fine pointer.
      # A launch flag cannot stand in for it, as switching touch emulation off restores the device's.
      - name: Run browser tests
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm run test:browser --prefix web -- --browser.headless=false 2>&1 | tee browser-tests.log
          {
            echo '### WebGL probe'
            grep -h 'WebGL renderer' browser-tests.log || echo 'No renderer line in the log.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Bits UI plus the Svelte runtime, as web/docs/decisions/0001-ui-kit.md defines the budget.
      - name: Check the UI bundle budget
        shell: bash
        run: |
          node .github/scripts/ui-bundle-budget.mjs | tee ui-budget.log
          cat ui-budget.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-browser-failures
          path: |
            web/src/**/__screenshots__/
            web/.vitest/attachments/
          if-no-files-found: ignore

  # About 25 minutes a shard and flaky on the runners' software WebGL, so pull requests skip it:
  # it runs when started by hand (Actions → Tests → Run workflow) and before a deploy.
  web-e2e:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      # No browser cache: the download is small next to the cache's restore time.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # The legacy build empties dist/, so it comes first; the preview goes beside it.
      - name: Build the legacy app
        run: npm run build

      - name: Build the preview
        run: |
          npm run build:preview --prefix web
          cp -r web/dist dist/next

      # Playwright's CI guide: one worker per job, scaled out by sharding. One retry, and a test
      # that needed it fails the job. The global timeout (25 min) ends the run inside Playwright,
      # so the artifacts below are still uploaded before the job's 40 min limit (setup can take 10 min on a slow runner).
      # Specs of regions not yet integrated are left out of the next project (playwright.config.ts),
      # so the shards split only tests that run: about 21 legacy tests, 12 to 13 min, each.
      - name: Run end-to-end tests (legacy and next), shard ${{ matrix.shard }}/8
        run: npm run test:e2e --prefix web -- --workers=1 --retries=1 --fail-on-flaky-tests --global-timeout=1500000 --shard=${{ matrix.shard }}/8

      - name: Upload failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-failures-${{ matrix.shard }}
          path: |
            web/test-results/
          if-no-files-found: ignore
