name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Agent, design and repository notes are not part of the site or its checks.
    paths-ignore:
      - .agents/**
      - .claude/**
      - .impeccable/**
      - deliverables/**
      - AGENTS.md
      - CLAUDE.md
      - DESIGN.md
      - PRODUCT.md
      - README.md
      - skills-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A newer push cancels the tests and build of the one before it, so a superseded
  # commit can never reach the deploy job after, and over, a newer one.
  tests:
    uses: ./.github/workflows/tests.yml
    concurrency:
      group: ${{ github.workflow }}-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: read

  # Builds while the tests run; nothing is published unless they pass.
  build:
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Build static site
        run: npm run build

      # The preview build leaves the published assets out: /neuroatlas/ already serves them.
      # It is not indexed; the live site stays canonical.
      - name: Build the Svelte preview into dist/next
        run: |
          npm run build:preview --prefix web
          cp -r web/dist dist/next
          grep -q 'name="robots" content="noindex"' dist/next/index.html

      # After the viewer build: vite build empties dist/, so the docs are added to it here.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --locked --group docs --no-install-project

      - name: Build documentation into dist/docs
        run: uv run sphinx-build -W -b html -d docs/_build/doctrees docs dist/docs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: [tests, build]
    # Deploys only what passed: tests and build cancelled by a newer push are neither.
    if: ${{ always() && needs.tests.result == 'success' && needs.build.result == 'success' }}
    # Only the deployment waits for the one before it, so a new push starts its
    # tests at once. An in-progress deployment is left to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
