name: Docs check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --locked --group docs --no-install-project

      # Strict: any Sphinx warning fails the check. Nothing is deployed from a pull request.
      - name: Build documentation
        run: uv run sphinx-build -W -b html -d docs/_build/doctrees docs docs/_build/html
