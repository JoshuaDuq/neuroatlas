version: 2
updates:
  # Keeps the pinned workflow actions current; one grouped pull request a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Svelte app in web/.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
