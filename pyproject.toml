[project]
name = "brain-model"
version = "0.1.0"
description = "Source-faithful selectable single-subject brain assets"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<2.5",
  "nibabel>=5.3,<6",
  "trimesh>=4.11,<6",
  "scipy>=1.15,<2",
  "scikit-image>=0.25,<1",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-xdist>=3.8,<4", "ruff>=0.12"]
docs = [
  "sphinx>=8.1,<10",
  "furo>=2024.8.6",
  "myst-parser>=4.0,<6",
  "sphinx-design>=0.6",
  "sphinx-copybutton>=0.5.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
