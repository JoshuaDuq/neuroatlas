[project]
name = "brain-model"
version = "0.1.0"
description = "Source-faithful selectable fsaverage brain assets"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<2.5",
  "nibabel>=5.3,<6",
  "trimesh>=4.11,<6",
  "scipy>=1.15,<2",
  "scikit-image>=0.25,<1",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
