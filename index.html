<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A precise, source-faithful atlas of the human brain built on the FreeSurfer fsaverage reference template." />
    <title>NeuroAtlas</title>
  </head>
  <body>
    <div id="app" data-status="loading">
      <header id="masthead">
        <h1 class="brand">NeuroAtlas</h1>
        <div id="atlas-switch" class="segmented" role="group" aria-label="Cortical atlas"></div>
        <div class="masthead-end">
          <span id="region-count" class="measure"></span>
          <button id="theme-toggle" type="button" aria-pressed="false">
            <span id="theme-label">Dark</span>
          </button>
          <button id="shortcuts-open" type="button" aria-label="Keyboard shortcuts">?</button>
        </div>
      </header>

      <aside id="navigator" aria-label="Find a region">
        <div class="rail-head">
          <label class="visually-hidden" for="search">Search regions</label>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Search regions" role="combobox" aria-expanded="false"
                 aria-controls="results" aria-autocomplete="list" />
        </div>
        <div class="rail-body">
          <div id="results" role="listbox" aria-label="Search results" hidden></div>
          <div id="tree" role="tree" aria-label="Browse anatomy"></div>
        </div>
        <p id="rail-notice" class="rail-notice" hidden></p>
      </aside>

      <main id="viewport">
        <div id="orientation" class="orientation" aria-hidden="true">
          <span data-edge="top"></span><span data-edge="right"></span>
          <span data-edge="bottom"></span><span data-edge="left"></span>
        </div>
        <div id="views" class="views" role="group" aria-label="Anatomical view"></div>
        <div id="scale-bar" class="chip scale-bar" aria-hidden="true">
          <span class="scale-bar-rule"></span>
          <span class="measure"></span>
        </div>
        <div id="hover-label" class="chip hover-label" aria-hidden="true" hidden></div>
        <div id="stage" class="stage" role="status">
          <p id="stage-message">Loading anatomy…</p>
          <div id="stage-progress" class="progress" hidden>
            <span id="stage-bar"></span>
          </div>
          <button id="stage-retry" type="button" hidden>Retry</button>
        </div>
      </main>

      <aside id="inspector" aria-label="Selection and display">
        <div class="rail-body">
          <p class="section-label">Selected</p>
          <div class="panel-body">
            <h2 id="selected-name">No region selected</h2>
            <p id="selected-hint">Click the model, or search on the left.</p>
            <dl id="selected-facts" hidden>
              <dt>Hemisphere</dt><dd id="fact-hemisphere"></dd>
              <dt>Atlas</dt><dd id="fact-atlas"></dd>
              <dt id="fact-metric-label">Surface area</dt>
              <dd id="fact-metric" class="measure"></dd>
              <dt>Source label</dt><dd id="fact-source" class="measure"></dd>
            </dl>
            <div class="actions">
              <button id="focus" type="button" disabled>Focus</button>
              <button id="isolate" type="button" aria-pressed="false" disabled>Isolate</button>
            </div>
          </div>

          <p class="section-label">Display</p>
          <div class="panel-body">
            <label for="hemisphere">Hemisphere</label>
            <select id="hemisphere">
              <option value="both">Both</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>

            <label class="check">
              <input id="cortex" type="checkbox" checked /> Show cortex
            </label>

            <label for="opacity">
              Cortex opacity <output id="opacity-value" class="measure">100%</output>
            </label>
            <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" />

            <label class="check">
              <input id="atlas-colors" type="checkbox" checked /> Atlas colours
            </label>

            <button id="reset" type="button">Reset view</button>
          </div>
        </div>
      </aside>

      <footer id="colophon">
        <span>FreeSurfer fsaverage reference template · not individual or clinical anatomy</span>
        <a id="provenance" href="models/manifest.json" target="_blank" rel="noreferrer">Provenance</a>
      </footer>
    </div>

    <dialog id="shortcuts" aria-labelledby="shortcuts-title">
      <h2 id="shortcuts-title">Keyboard shortcuts</h2>
      <dl id="shortcuts-list"></dl>
      <button id="shortcuts-close" type="button">Close</button>
    </dialog>

    <p id="announcer" role="status" aria-live="polite" class="visually-hidden"></p>
    <script type="module" src="/viewer/main.js"></script>
  </body>
</html>
