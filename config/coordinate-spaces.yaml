        mask: [tpl-MNI152NLin6Asym_res-01_desc-brain_mask.nii.gz, 6d540075dac093fa5070a929dc5ea52795d54cc9ab57fe1272086dc70314b428]
  - id: mni152lin
    label: MNI152Lin
    description: ICBM 152 linear average (avg152T1), the template of SPM96 to SPM8's normalisation
