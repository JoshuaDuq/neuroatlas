    - object: Anterior corticospinal tract
      id: anterior-corticospinal-tract
      hemisphere: split
      tissue: white
      family: anterior-funiculus
      color: [176, 73, 65]
      names: {en: Anterior corticospinal tract, fr: Tractus cortico-spinal antérieur}
      aliases: {en: [Direct pyramidal tract, Pyramidal tract], fr: [Faisceau pyramidal direct, Tractus pyramidal]}
    - object: Lateral vestibulospinal tract
      id: lateral-vestibulospinal-tract
