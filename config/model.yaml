appearance:
  tissue:
    cortex: '#c4a897'
    gray: '#a68d80'
    white: '#e5dbc5'
    fluid: '#67777c'
    unlabelled: '#c4a897'
    roughness: 0.62
    clearcoat: 0.08
    clearcoat_roughness: 0.45
    ior: 1.38
    specular_intensity: 0.55
  # Opacity, as a fraction of the cortex's, of the cortex outside the functional
  # divisions on show: the glass of the glass brain.
  glass_opacity: 0.1
  # Cortex opacity the notice's "See through the cortex" sets when an opened
  # function's strongest region is a structure the cortex hides. At 0.3 the
  # painted amygdala of Fear was still veiled; at 0.15 it reads, near the 0.16
  # the Tracts overlay uses.
  see_through_opacity: 0.15
  intensity:
    low: 85
    high: 180
    surface_strength: 0.28
    cut_strength: 0.5
    solid_relief_mm: 1.2
  folds:
    low: -0.5
    high: 1.8
    concavity_low: -0.08
    concavity_high: 0.04
    direct_strength: 0.48
    indirect_strength: 0.78
  lighting:
    environment: 0.3
    hemisphere: 0.28
    key: 1.8
    fill: 0.5
    rim: 0.7
  occlusion:
    radius: 0.012
    thickness: 0.025
    samples: 32
    intensity: 0.9
atlas_comparison:
  enabled_anatomies: [cdmd]
  atlases: [destrieux, hcp-mmp]
atlases:
  - id: destrieux
    label: Destrieux anatomical atlas
    annotation: aparc.a2009s
    citation: https://doi.org/10.1016/j.neuroimage.2010.06.010
  - id: hcp-mmp
    label: HCP-MMP1.0 multimodal atlas
    annotation: HCPMMP1
    citation: https://doi.org/10.1038/nature18933
    # Redistributed only under these terms; relative to the manifest, like CAB-NP's.
    license_file: ../licenses/HCP-Data-Use-Terms.txt
# A cut-label atlas with no cortical surface counterpart, published by the
# anatomies that declare the `nextbrain` layer. The volume is produced once per
# brain by scripts/segment_nextbrain.py, which needs FreeSurfer 8.2.
# `directory`, `volume` and `procedure` come from the selected anatomy;
# everything else here describes the published atlas itself. fsaverage keeps
# the 1 mm MNI152 warp it was built with, by scripts/warp_nextbrain.py (removed
# in 967fed9); it is not published.
nextbrain:
  label: NextBrain histological atlas
  citation: https://doi.org/10.1038/s41586-025-09708-2
  lut: nextbrain-lut.txt
  # Below this, an ROI stays a cut label: a marching-cubes surface over a few
  # voxels claims a shape the grid cannot support. In mm³ so that it means the
  # same whatever the grid.
  minimum_mesh_volume_mm3: 10
  # Cut faces sample blocks of source voxels at about this spacing, so the GPU
  # label texture stays near its 1 mm size. Surfaces use the source grid.
  cut_label_spacing_mm: 0.8
  # scripts/segment_nextbrain.py: FreeSurfer's NextBrain grid, and the step the
  # joined grid's origin snaps to. A whole number of cut blocks per step puts
  # every cut block on one fixed lattice whatever the labelled extent.
  segmentation_spacing_mm: 0.4
  segmentation_lattice_mm: 0.8
  # Placement check: the share of a fixed random sample of labelled voxels
  # that falls inside aseg's labelled volume. Measured 0.98 for a subject
  # segmentation and 0.93 for the MNI warps; a volume placed by its own
  # header's tkregister matrix scores 0.58.
  registration_samples: 20000
  minimum_share_inside_aseg: 0.9
structures:
  # Display smoothing for the aseg and NextBrain solids, as for learning units.
  # Validation holds each surface to this bound and to its source voxels.
  smoothing:
    iterations: 16
    maximum_displacement_mm: 0.6
  labels: [4, 5, 7, 8, 10, 11, 12, 13, 14, 15, 16, 17, 18, 26, 28, 31,
           43, 44, 46, 47, 49, 50, 51, 52, 53, 54, 58, 60, 63,
           85, 251, 252, 253, 254, 255]
validation:
  coordinate_tolerance_mm: 0.00002
  relative_area_tolerance: 0.000001
  # NextBrain against the same brain's aseg: Dice of each named NextBrain
  # learning unit (config/learning-anatomy.yaml) with the aseg label of the same
  # structure on that side, aseg resampled onto the NextBrain grid by nearest
  # neighbour. A score below the floor fails validation.
  segmentation_agreement:
    minimum_dice: 0.8
    aseg_labels:
      caudate: {left: 11, right: 50}
      putamen: {left: 12, right: 51}
      thalamus: {left: 10, right: 49}
      hippocampus: {left: 17, right: 53}
      amygdala: {left: 18, right: 54}
  # CerebNet's lobules together against aseg's cerebellar cortex, same grid.
  # CDMD measured 0.918. The since-removed SNAIL's cut-off, resampled T1
  # measured 0.697, with the inferior third of its cerebellum unlabelled.
  cerebellar_agreement:
    minimum_dice: 0.85
    aseg_labels: [8, 47]
sections:
  field_of_view_mm: 256
  texture_size: 512
  # No window here on purpose: it is measured per subject from the segmented
  # voxels at build time, because orig.mgz carries no common intensity scale.
  # The viewer's own contrast sliders start from whatever the build published.
