# Which brain this build publishes. They differ in kind, not in quality: an
# individual has real folds and a real scan but is nobody else's brain, while an
# averaged template is the space published parcellations and group results are
# reported in. Two individuals differ again in who published them and under what
# terms. Switching is this one line plus a rebuild; no conversion step reads
# anything subject-specific of its own.
anatomy: cdmd

# The one FreeSurfer install every locally generated source was made with: the
# CDMD reconstruction and each subject's NextBrain segmentation.
freesurfer_build: freesurfer-macOS-darwin_arm64-8.2.0-20260314-d932c45

# Every anatomy lists the optional layers it publishes, out of networks,
# nextbrain, cerebellar_lobules, white_matter, spinal_cord, neurosynth_terms,
# arterial_territories, cerebellar_functions and coordinate_spaces. Build and
# validate fail when a declared layer's input is missing and publish no layer
# that is undeclared.
anatomies:
  fsaverage:
    subject: fsaverage
    display_name: FreeSurfer fsaverage
    label: FreeSurfer fsaverage averaged template
    individual: false
    directory: data/fsaverage
    source_url: https://osf.io/download/3bxqt?version=2
    # No wmparc.mgz is published for this template.
    layers: [networks, nextbrain]
    # No `archive`: these files are committed. No `project_hcp_from`: HCP-MMP1.0
    # is already published in this space, so nothing is resampled onto it.
    # The NextBrain volume is the exception: its source published no licence,
    # so it is kept locally and not committed.
    nextbrain:
      directory: data/nextbrain
      volume: nextbrain-fsaverage.mgz
      procedure: mni152-warp
  cdmd:
    subject: sub_013
    display_name: MGH CDMD “sub_013”
    label: MGH CDMD single-subject reconstruction
    individual: true
    directory: data/cdmd
    # CC0. Chosen from the 33 published FreeSurfer 6 reconstructions for the
    # fewest surface defect holes (14); its own diffusion scan gives the tracts
    # their frame.
    source_url: https://doi.org/10.6084/m9.figshare.c.5315474.v1
    layers: [networks, nextbrain, cerebellar_lobules, white_matter, spinal_cord, neurosynth_terms, arterial_territories, cerebellar_functions, coordinate_spaces]
    # Reconstructed here with FreeSurfer 8.2 from the T1 the
    # published FreeSurfer 6 run imported (voxel for voxel). With that run's
    # aseg, NextBrain's left amygdala met it at Dice 0.793, below the floor.
    # scripts/reconstruct_subject.py reads the T1 out of the subject's 2 GB zip.
    reconstruction:
      input: data/cdmd/input/sub_013_t1w.nii.gz
      input_sha256: 16e9137160f20c3dfb39fbd04ce1299415c5252ba96e8b0266f5f9402c60730b
      input_download:
        url: https://ndownloader.figshare.com/files/30790102
        member: sub_013/anat/sub_013_t1w.nii.gz
      threads: 4
      provenance: reconstruction.json
      completion_marker: scripts/recon-all.done
      limitations:
        - "The source T1 was defaced before release: facial features were obscured; the brain was not altered."
    statistics: stats/aseg.stats
    project_hcp_from: fsaverage
    structures:
      # This FreeSurfer 8.2 aseg has no choroid-plexus (31/63) or optic-chiasm
      # (85) labels.
      labels: [4, 5, 7, 8, 10, 11, 12, 13, 14, 15, 16, 17, 18, 26, 28,
               43, 44, 46, 47, 49, 50, 51, 52, 53, 54, 58, 60,
               251, 252, 253, 254, 255]
    nextbrain:
      directory: data/nextbrain-cdmd
      volume: nextbrain-cdmd.mgz
      near_ties: nextbrain-cdmd-near-ties.mgz
      procedure: subject-segmentation
    # Accepted 2026-10-24. NextBrain's left amygdala is the smaller estimate on
    # both reconstructions of this scan (1,246 mm³ on FreeSurfer 6.0, Dice 0.793;
    # 1,266 mm³ on 8.2), and smaller than its own right (1,393 mm³); the right
    # agrees at 0.83. The disagreement is the anterior-medial boundary, not a
    # misplaced structure: of the voxels only aseg calls left amygdala, NextBrain
    # leaves some unlabelled and gives the rest to entorhinal cortex, forebrain
    # white matter and temporal pole.
    segmentation_agreement_exceptions:
      amygdala:
        left:
          minimum_dice: 0.77
          measured:
            dice: 0.772
            aseg_mm3: 1497
            nextbrain_mm3: 1266
            aseg_only_mm3: 470
            nextbrain_only_mm3: 175
            aseg_only_in_nextbrain_mm3:
              unlabelled: 146
              entorhinal cortex: 110
              forebrain white matter: 97
              temporal pole: 69
              temporal claustrum: 18
              optic tract: 10

output_directory: public/models
# Each anatomy with tracts of its own names them in one catalog; the viewer's
# web/src/lib/core/diffusion/catalogs.ts imports the same files.
tract_catalogs: [data/diffusion-cdmd.yaml]
# scripts/prepare_subject.py checks this many evenly spaced vertices of every
# annotation it projects against a brute-force nearest source vertex.
annotation_projection:
  verify_samples: 512
networks:
  # Schaefer jitters each Yeo colour per parcel; the widest observed jitter is
  # 8 per channel. A parcel further than this from its network's published
  # colour fails the build instead of shipping.
  maximum_color_jitter: 12
spinal_cord:
  # scripts/segment_spinal_cord.py runs SCT on the anatomy's source T1
  # (reconstruction.input): its cord segmentation and vertebral levels, then the
  # PAM50 template registered to the cord. PAM50's atlas is warped onto a grid of
  # the template's own spacing, where each voxel keeps its most probable region.
  atlas_spacing_mm: 0.5
  # 1 mm scan voxels kept around the segmented cord's bounding box (x, y, z).
  crop_margin_voxels: [8, 8, 2]
  # A point is cord where PAM50's region probabilities sum to at least this.
  minimum_cord_probability: 0.5
  # Validation: the registered atlas's cord against SCT's segmentation, on the
  # slices the atlas covers. Measured 0.967 on CDMD (65 slices).
  minimum_cord_dice: 0.95
  citations:
    - https://doi.org/10.1016/j.neuroimage.2017.10.041
    - https://doi.org/10.1016/j.neuroimage.2015.06.040
    - https://doi.org/10.1016/j.media.2025.103473
    - https://doi.org/10.1016/j.neuroimage.2016.10.009
  # PAM50's licence, as its host, the Spinal Cord Toolbox's OSF project, declares it.
  license: MIT
  license_file: PAM50.txt
  attribution: PAM50 template (De Leener et al. 2018) and white-matter atlas (Lévy et al. 2015), registered with the Spinal Cord Toolbox
  # PAM50's lateral reticulospinal tract never exceeds 0.43 probability anywhere in
  # the template (16 voxels won there), and is no voxel's most probable region on
  # CDMD's grid (0 left, 6 right). It still counts toward the cord, but takes no
  # voxels: they go to the next most probable region, and it is not published.
  unresolved:
    atlas: [10, 11]
    names: {en: Lateral reticulospinal tract, fr: Tractus réticulo-spinal latéral}
  # Catalog sub-headers, in this order: PAM50's own combined labels.
  families:
    dorsal-columns: {en: Dorsal columns, fr: Cordons postérieurs}
    lateral-funiculi: {en: Lateral funiculus, fr: Cordon latéral}
    ventral-funiculi: {en: Ventral funiculus, fr: Cordon antérieur}
    grey-matter: {en: Grey matter, fr: Substance grise}
  # Each structure is a pair of PAM50 atlas regions, [left, right] by its index
  # in atlas/info_label.txt. Ascending tracts blue, descending red, grey matter
  # brown; steps separate neighbours that touch.
  structures:
    - {atlas: [0, 1], id: gracile-fasciculus, family: dorsal-columns, tissue: white, color: [104, 170, 225],
       source_name: fasciculus gracilis,
       names: {en: Gracile fasciculus, fr: Faisceau gracile},
       aliases: {en: [Fasciculus gracilis, "Goll's tract", Dorsal column], fr: [Faisceau de Goll]}}
    - {atlas: [2, 3], id: cuneate-fasciculus, family: dorsal-columns, tissue: white, color: [37, 88, 148],
       source_name: fasciculus cuneatus,
       names: {en: Cuneate fasciculus, fr: Faisceau cunéiforme},
       aliases: {en: [Fasciculus cuneatus, "Burdach's tract", Dorsal column], fr: [Faisceau de Burdach]}}
    - {atlas: [4, 5], id: lateral-corticospinal-tract, family: lateral-funiculi, tissue: white, color: [176, 73, 65],
       source_name: lateral corticospinal tract,
       names: {en: Lateral corticospinal tract, fr: Tractus cortico-spinal latéral},
       aliases: {en: [Crossed pyramidal tract, Pyramidal tract], fr: [Faisceau pyramidal croisé, Tractus pyramidal]}}
    - {atlas: [6, 7], id: ventral-spinocerebellar-tract, family: lateral-funiculi, tissue: white, color: [54, 114, 171],
       source_name: ventral spinocerebellar tract,
       names: {en: Ventral spinocerebellar tract, fr: Tractus spino-cérébelleux ventral},
       aliases: {en: ["Gowers' tract", Anterior spinocerebellar tract], fr: [Faisceau de Gowers, Tractus spino-cérébelleux antérieur]}}
    - {atlas: [8, 9], id: rubrospinal-tract, family: lateral-funiculi, tissue: white, color: [214, 116, 96],
       source_name: rubrospinal tract,
       names: {en: Rubrospinal tract, fr: Tractus rubro-spinal},
       aliases: {en: ["Monakow's tract"], fr: [Faisceau de Monakow]}}
    - {atlas: [12, 13], id: spinal-lemniscus, family: lateral-funiculi, tissue: white, color: [86, 150, 206],
       source_name: spinal lemniscus (spinothalamic and spinoreticular tracts),
       names: {en: Spinal lemniscus, fr: Lemnisque spinal},
       aliases: {en: [Spinothalamic tract, Spinoreticular tract, Anterolateral system], fr: [Tractus spino-thalamique, Tractus spino-réticulaire, Système antérolatéral]}}
    - {atlas: [14, 15], id: spino-olivary-tract, family: ventral-funiculi, tissue: white, color: [128, 186, 222],
       source_name: spino-olivary tract,
       names: {en: Spino-olivary tract, fr: Tractus spino-olivaire}}
    - {atlas: [16, 17], id: ventrolateral-reticulospinal-tract, family: ventral-funiculi, tissue: white, color: [196, 92, 78],
       source_name: ventrolateral reticulospinal tract,
       names: {en: Ventrolateral reticulospinal tract, fr: Tractus réticulo-spinal ventrolatéral}}
    - {atlas: [18, 19], id: lateral-vestibulospinal-tract, family: ventral-funiculi, tissue: white, color: [150, 62, 82],
       source_name: lateral vestibulospinal tract,
       names: {en: Lateral vestibulospinal tract, fr: Tractus vestibulo-spinal latéral}}
    - {atlas: [20, 21], id: ventral-reticulospinal-tract, family: ventral-funiculi, tissue: white, color: [222, 140, 122],
       source_name: ventral reticulospinal tract,
       names: {en: Ventral reticulospinal tract, fr: Tractus réticulo-spinal ventral}}
    - {atlas: [22, 23], id: ventral-corticospinal-tract, family: ventral-funiculi, tissue: white, color: [176, 73, 65],
       source_name: ventral corticospinal tract,
       names: {en: Ventral corticospinal tract, fr: Tractus cortico-spinal ventral},
       aliases: {en: [Anterior corticospinal tract, Direct pyramidal tract], fr: [Tractus cortico-spinal antérieur, Faisceau pyramidal direct]}}
    - {atlas: [24, 25], id: tectospinal-tract, family: ventral-funiculi, tissue: white, color: [190, 98, 120],
       source_name: tectospinal tract,
       names: {en: Tectospinal tract, fr: Tractus tecto-spinal}}
    - {atlas: [26, 27], id: medial-reticulospinal-tract, family: ventral-funiculi, tissue: white, color: [130, 60, 92],
       source_name: medial reticulospinal tract,
       names: {en: Medial reticulospinal tract, fr: Tractus réticulo-spinal médial}}
    - {atlas: [28, 29], id: medial-longitudinal-fasciculus, family: ventral-funiculi, tissue: white, color: [214, 150, 170],
       source_name: medial longitudinal fasciculus,
       names: {en: Medial longitudinal fasciculus, fr: Faisceau longitudinal médial}}
    - {atlas: [30, 31], id: ventral-horn, family: grey-matter, tissue: gray, color: [142, 109, 79],
       source_name: ventral horn,
       names: {en: Ventral horn, fr: Corne ventrale},
       aliases: {en: [Anterior horn], fr: [Corne antérieure]}}
    - {atlas: [32, 33], id: intermediate-zone, family: grey-matter, tissue: gray, color: [181, 161, 139],
       source_name: intermediate zone,
       names: {en: Intermediate zone, fr: Zone intermédiaire},
       aliases: {en: [Lamina VII], fr: [Lame VII]}}
    - {atlas: [34, 35], id: dorsal-horn, family: grey-matter, tissue: gray, color: [199, 164, 91],
       source_name: dorsal horn,
       names: {en: Dorsal horn, fr: Corne dorsale},
       aliases: {en: [Posterior horn], fr: [Corne postérieure]}}
appearance:
  tissue:
    cortex: '#c4a897'
    gray: '#a68d80'
    white: '#e5dbc5'
    fluid: '#67777c'
    unlabelled: '#c4a897'
    roughness: 0.62
    clearcoat: 0.08
    clearcoat_roughness: 0.45
    ior: 1.38
    specular_intensity: 0.55
  # Cortex opacity the notice's "See through the cortex" sets when an opened
  # function's strongest region is a structure the cortex hides. At 0.3 the
  # painted amygdala of Fear was still veiled; at 0.15 it reads, near the 0.16
  # the Tracts overlay uses.
  see_through_opacity: 0.15
  intensity:
    low: 85
    high: 180
    surface_strength: 0.28
    cut_strength: 0.5
    solid_relief_mm: 1.2
  folds:
    low: -0.5
    high: 1.8
    openness_low: 0.5
    openness_high: 0.95
    direct_strength: 0.48
    indirect_strength: 0.78
  lighting:
    environment: 0.3
    hemisphere: 0.28
    key: 1.8
    fill: 0.5
    rim: 0.7
  # Baked per pial vertex at build time (_OPENNESS), so it costs the viewer
  # nothing per frame. Folds closer than radius_mm occlude in proportion.
  occlusion:
    radius_mm: 10
    direction_count: 256
atlas_comparison:
  enabled_anatomies: [cdmd]
  atlases: [destrieux, hcp-mmp, julich, schaefer]
atlases:
  - id: destrieux
    label: Destrieux anatomical atlas
    annotation: aparc.a2009s
    citation: https://doi.org/10.1016/j.neuroimage.2010.06.010
  - id: hcp-mmp
    label: HCP-MMP1.0 multimodal atlas
    annotation: HCPMMP1
    citation: https://doi.org/10.1038/nature18933
    # Redistributed only under these terms; relative to the manifest, like CAB-NP's.
    license_file: ../licenses/HCP-Data-Use-Terms.txt
  # Julich-Brain 3.1's maximum-probability map on fsaverage (scripts/fetch_julich_brain.py),
  # projected like HCP-MMP1.0. Its gap maps, cortex not yet mapped, and its medial
  # masks are not areas. CC BY-NC-SA 4.0: non-commercial, shared alike.
  - id: julich
    label: Julich-Brain cytoarchitectonic atlas
    annotation: JulichBrain3.1
    citation: https://doi.org/10.1126/science.abb4588
    license_file: ../licenses/Julich-Brain-CC-BY-NC-SA-4.0.pdf
  # Schaefer 2018's 400 parcels in their published 7-network colours, projected like
  # HCP-MMP1.0. The 17-network order divides the same parcels and names where most of
  # them lie, which the 7-network names leave out for every visual and somatomotor
  # parcel; the build pairs the two on fsaverage and fails unless one to one. MIT.
  - id: schaefer
    label: Schaefer 2018 functional parcellation
    annotation: Schaefer2018_400Parcels_7Networks_order
    names_from: Schaefer2018_400Parcels_17Networks_order
    citation: https://doi.org/10.1093/cercor/bhx179
# A cut-label atlas with no cortical surface counterpart, published by the
# anatomies that declare the `nextbrain` layer. The volume is produced once per
# brain by scripts/segment_nextbrain.py, which needs FreeSurfer 8.2.
# `directory`, `volume` and `procedure` come from the selected anatomy;
# everything else here describes the published atlas itself. fsaverage keeps
# the 1 mm MNI152 warp it was built with, by scripts/warp_nextbrain.py (removed
# in 967fed9); it is not published.
nextbrain:
  label: NextBrain histological atlas
  citation: https://doi.org/10.1038/s41586-025-09708-2
  lut: nextbrain-lut.txt
  # Below this, an ROI stays a cut label: a marching-cubes surface over a few
  # voxels claims a shape the grid cannot support. In mm³ so that it means the
  # same whatever the grid.
  minimum_mesh_volume_mm3: 10
  # Cut faces sample blocks of source voxels at about this spacing, so the GPU
  # label texture stays near its 1 mm size. Surfaces use the source grid.
  cut_label_spacing_mm: 0.8
  # scripts/segment_nextbrain.py: FreeSurfer's NextBrain grid, and the step the
  # joined grid's origin snaps to. A whole number of cut blocks per step puts
  # every cut block on one fixed lattice whatever the labelled extent.
  segmentation_spacing_mm: 0.4
  segmentation_lattice_mm: 0.8
  # Placement check: the share of a fixed random sample of labelled voxels
  # that falls inside aseg's labelled volume. Measured 0.98 for a subject
  # segmentation and 0.93 for the MNI warps; a volume placed by its own
  # header's tkregister matrix scores 0.58.
  registration_samples: 20000
  minimum_share_inside_aseg: 0.9
  # Boundary certainty, for a subject segmentation: a voxel is a near tie where
  # NextBrain's winning posterior leads the runner-up by less than this.
  near_tie_margin: 0.2
  # A pair of touching labels is rated only with this many interface voxels
  # (3.2 mm³ at 0.4 mm); rated pairs cover 98.9% of CDMD's interface voxels.
  minimum_interface_voxels: 50
structures:
  # Display smoothing for the aseg and NextBrain solids, as for learning units.
  # Validation holds each surface to this bound and to its source voxels.
  smoothing:
    iterations: 16
    maximum_displacement_mm: 0.6
  labels: [4, 5, 7, 8, 10, 11, 12, 13, 14, 15, 16, 17, 18, 26, 28, 31,
           43, 44, 46, 47, 49, 50, 51, 52, 53, 54, 58, 60, 63,
           85, 251, 252, 253, 254, 255]
validation:
  coordinate_tolerance_mm: 0.00002
  relative_area_tolerance: 0.000001
  # Re-cast cortical openness against the published field. Float-level jitter
  # (3e-5 mm) moved 0.16% of CDMD vertices past the tolerance; a 5% radius
  # error moves 78%, one direction fewer 23%.
  openness:
    tolerance: 0.001
    maximum_outlier_share: 0.005
  # NextBrain against the same brain's aseg: Dice of each named NextBrain
  # learning unit (config/learning-anatomy.yaml) with the aseg label of the same
  # structure on that side, aseg resampled onto the NextBrain grid by nearest
  # neighbour. A score below the floor fails validation.
  segmentation_agreement:
    minimum_dice: 0.8
    aseg_labels:
      caudate: {left: 11, right: 50}
      putamen: {left: 12, right: 51}
      thalamus: {left: 10, right: 49}
      hippocampus: {left: 17, right: 53}
      amygdala: {left: 18, right: 54}
  # CerebNet's lobules together against aseg's cerebellar cortex, same grid.
  # CDMD measured 0.918. The since-removed SNAIL's cut-off, resampled T1
  # measured 0.697, with the inferior third of its cerebellum unlabelled.
  cerebellar_agreement:
    minimum_dice: 0.85
    aseg_labels: [8, 47]
sections:
  field_of_view_mm: 256
  texture_size: 512
  # No window here on purpose: it is measured per subject from the segmented
  # voxels at build time, because orig.mgz carries no common intensity scale.
  # The viewer's own contrast sliders start from whatever the build published.
