      color: [176, 73, 65]
      names: {en: Medial vestibulospinal tract, fr: Tractus vestibulo-spinal médial}
      note:
        en: Z-Anatomy files this tract under the anterior funiculus, but its surface lies inside the intermediate zone.
        fr: Z-Anatomy range ce tractus dans le cordon antérieur, mais sa surface se trouve dans la zone intermédiaire.
    - object: Medial reticulospinal tract
