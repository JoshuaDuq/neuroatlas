# Which brain this build publishes. The two differ in kind, not in quality: one
# individual has real folds and a real scan but is nobody else's brain, while an
# averaged template is the space published parcellations and group results are
# reported in. Switching is this one line plus a rebuild; no conversion step
# reads anything subject-specific of its own.
anatomy: bert

anatomies:
  bert:
    subject: bert
    # `display_name` is what the viewer shows. It is a proper noun, so it is not
    # translated, and it is not derivable from `subject`: this one is
    # FreeSurfer's brain, the next is MNI's with a FreeSurfer reconstruction.
    display_name: FreeSurfer “bert”
    label: FreeSurfer bert single-subject reconstruction
    individual: true
    directory: data/bert
    source_url: https://surfer.nmr.mgh.harvard.edu/pub/data/archive/bert.recon.tgz
    # Not redistributed here. `archive` is what tells scripts/prepare_subject.py
    # there is something to unpack, and pins which bytes it may unpack.
    archive:
      sha256: a68ef88b0ddc794ebe57060ede9ed625a881a90b6f8cb65d8664b59036a62908
      member_prefix: bert/
    # HCP-MMP1.0 is published on fsaverage only, so it is resampled onto this
    # subject through the registered spheres both reconstructions carry.
    project_hcp_from: fsaverage
    nextbrain:
      directory: data/nextbrain-bert
      volume: nextbrain-bert.mgz
  fsaverage:
    subject: fsaverage
    display_name: FreeSurfer fsaverage
    label: FreeSurfer fsaverage averaged template
    individual: false
    directory: data/fsaverage
    source_url: https://osf.io/download/3bxqt?version=2
    # No `archive`: these files are committed. No `project_hcp_from`: HCP-MMP1.0
    # is already published in this space, so nothing is resampled onto it.
    nextbrain:
      directory: data/nextbrain
      volume: nextbrain-fsaverage.mgz

output_directory: public/models
appearance:
  tissue:
    cortex: '#c4a897'
    gray: '#a68d80'
    white: '#e5dbc5'
    fluid: '#67777c'
    unlabelled: '#c4a897'
    roughness: 0.62
    clearcoat: 0.08
    clearcoat_roughness: 0.45
    ior: 1.38
    specular_intensity: 0.55
  intensity:
    low: 85
    high: 180
    surface_strength: 0.28
    cut_strength: 0.5
  folds:
    low: -0.5
    high: 1.8
    concavity_low: -0.08
    concavity_high: 0.04
    direct_strength: 0.48
    indirect_strength: 0.78
  lighting:
    environment: 0.3
    hemisphere: 0.28
    key: 1.8
    fill: 0.5
    rim: 0.7
  occlusion:
    radius: 0.012
    thickness: 0.025
    samples: 32
    intensity: 0.9
atlases:
  - id: destrieux
    label: Destrieux anatomical atlas
    annotation: aparc.a2009s
    citation: https://doi.org/10.1016/j.neuroimage.2010.06.010
  - id: hcp-mmp
    label: HCP-MMP1.0 multimodal atlas
    annotation: HCPMMP1
    citation: https://doi.org/10.1038/nature18933
# A cut-label atlas with no cortical surface counterpart. Optional: the volume
# is produced once by scripts/warp_nextbrain.py, which needs ANTs.
# `directory` and `volume` come from the selected anatomy: the warp targets one
# brain, everything else here describes the published atlas itself.
nextbrain:
  label: NextBrain histological atlas
  citation: https://doi.org/10.1038/s41586-025-09708-2
  lut: nextbrain-lut.txt
  # Below this, an ROI stays a cut label: a marching-cubes surface over a few
  # voxels claims a shape the warped 1 mm grid cannot support.
  minimum_mesh_voxels: 10
structures:
  shading_sigma_voxels: 0.8
  labels: [4, 5, 7, 8, 10, 11, 12, 13, 14, 15, 16, 17, 18, 26, 28, 31,
           43, 44, 46, 47, 49, 50, 51, 52, 53, 54, 58, 60, 63,
           85, 251, 252, 253, 254, 255]
validation:
  coordinate_tolerance_mm: 0.00002
  relative_area_tolerance: 0.000001
sections:
  field_of_view_mm: 256
  texture_size: 512
  window_center: 90
  window_width: 180
