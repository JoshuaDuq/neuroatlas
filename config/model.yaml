# Which brain this build publishes. The two differ in kind, not in quality: one
# individual has real folds and a real scan but is nobody else's brain, while an
# averaged template is the space published parcellations and group results are
# reported in. Switching is this one line plus a rebuild; no conversion step
# reads anything subject-specific of its own.
anatomy: bert

anatomies:
  bert:
    subject: bert
    # `display_name` is what the viewer shows. It is a proper noun, so it is not
    # translated, and it is not derivable from `subject`: this one is
    # FreeSurfer's brain, the next is MNI's with a FreeSurfer reconstruction.
    display_name: FreeSurfer “bert”
    label: FreeSurfer bert single-subject reconstruction
    individual: true
    directory: data/bert
    source_url: https://surfer.nmr.mgh.harvard.edu/pub/data/archive/bert.recon.tgz
    # Not redistributed here. `archive` is what tells scripts/prepare_subject.py
    # there is something to unpack, and pins which bytes it may unpack.
    archive:
      sha256: a68ef88b0ddc794ebe57060ede9ed625a881a90b6f8cb65d8664b59036a62908
      member_prefix: bert/
    # HCP-MMP1.0 is published on fsaverage only, so it is resampled onto this
    # subject through the registered spheres both reconstructions carry.
    project_hcp_from: fsaverage
    nextbrain:
      directory: data/nextbrain-bert
      volume: nextbrain-bert.mgz
  fsaverage:
    subject: fsaverage
    display_name: FreeSurfer fsaverage
    label: FreeSurfer fsaverage averaged template
    individual: false
    directory: data/fsaverage
    source_url: https://osf.io/download/3bxqt?version=2
    # No `archive`: these files are committed. No `project_hcp_from`: HCP-MMP1.0
    # is already published in this space, so nothing is resampled onto it.
    nextbrain:
      directory: data/nextbrain
      volume: nextbrain-fsaverage.mgz

output_directory: public/models
spinal_cord:
  # Z-Anatomy's cord is generated by Blender modifiers, so it is read once by
  # scripts/extract_spinal_cord.py into this checksummed array.
  source: data/z-anatomy/spinal-cord.npz
  citation: https://www.z-anatomy.com/
  license: CC BY-SA 4.0
  attribution: Z-Anatomy, after BodyParts3D (CC BY-SA 2.1 JP)
  # Translation only: match the cord's upper end to the inferior brainstem.
  # This is a reference assembly, not a registration to the subject's MRI.
  brainstem_anchor_depth_mm: 3
  # The detailed medullary territories stop above the native aseg brainstem.
  superior_overlap_mm: 18
  # The cord's upper end is a filled ring, so the anchor is that ring's centre
  # rather than whichever single vertex happens to sit highest.
  anchor_band_mm: 1.0
  # Catalog sub-headers, in this order; each is the Z-Anatomy group its
  # structures are filed under. The whole cord heads the system and has none.
  families:
    white-matter: {en: White matter, fr: Substance blanche}
    posterior-funiculus: {en: Posterior funiculus, fr: Cordon postérieur}
    lateral-funiculus: {en: Lateral funiculus, fr: Cordon latéral}
    anterolateral-fasciculus: {en: Anterolateral fasciculus, fr: Faisceau antérolatéral}
    anterior-funiculus: {en: Anterior funiculus, fr: Cordon antérieur}
    posterior-horn: {en: Posterior horn, fr: Corne postérieure}
    intermediate-zone: {en: Intermediate zone, fr: Zone intermédiaire}
    anterior-horn: {en: Anterior horn, fr: Corne antérieure}
    central-canal: {en: Central canal, fr: Canal central}
    roots-and-ganglia: {en: Roots and ganglia, fr: Racines et ganglions}
  # `split`: one Z-Anatomy object holding both mirrored halves, published as a
  # left and a right region. Atlas colours: ascending tracts blue, descending
  # red, fasciculi proprii violet; steps separate neighbours that touch.
  structures:
    - object: White matter of spinal cord
      id: cord
      hemisphere: midline
      tissue: white
      color: [222, 219, 214]
      names: {en: Spinal cord, fr: Moelle épinière}
    - object: Posterolateral tract
      id: posterolateral-tract
      hemisphere: split
      tissue: white
      family: white-matter
      color: [88, 169, 211]
      names: {en: Posterolateral tract, fr: Tractus postérolatéral}
      aliases: {en: ["Lissauer's tract", Dorsolateral fasciculus], fr: [Faisceau de Lissauer, Tractus de Lissauer]}
    - object: Gracile fasciculus
      id: gracile-fasciculus
      hemisphere: split
      tissue: white
      family: posterior-funiculus
      color: [104, 170, 225]
      names: {en: Gracile fasciculus, fr: Faisceau gracile}
      aliases: {en: [Fasciculus gracilis, "Goll's tract", Dorsal column], fr: [Faisceau de Goll]}
    - object: Cuneate fasciculus
      id: cuneate-fasciculus
      hemisphere: split
      tissue: white
      family: posterior-funiculus
      color: [37, 88, 148]
      names: {en: Cuneate fasciculus, fr: Faisceau cunéiforme}
      aliases: {en: [Fasciculus cuneatus, "Burdach's tract", Dorsal column], fr: [Faisceau de Burdach]}
    - object: Posterior fasciculus proprius
      id: posterior-fasciculus-proprius
      hemisphere: midline
      tissue: white
      family: posterior-funiculus
      color: [155, 109, 184]
      names: {en: Posterior fasciculus proprius, fr: Faisceau propre postérieur}
      aliases: {en: [Posterior propriospinal tract], fr: []}
    - object: Lateral corticospinal tract
      id: lateral-corticospinal-tract
      hemisphere: split
      tissue: white
      family: lateral-funiculus
      color: [176, 73, 65]
      names: {en: Lateral corticospinal tract, fr: Tractus cortico-spinal latéral}
      aliases: {en: [Crossed pyramidal tract, Pyramidal tract], fr: [Faisceau pyramidal croisé, Tractus pyramidal]}
    - object: Rubrospinal tract
      id: rubrospinal-tract
      hemisphere: split
      tissue: white
      family: lateral-funiculus
      color: [176, 73, 65]
      names: {en: Rubrospinal tract, fr: Tractus rubro-spinal}
      aliases: {en: ["Monakow's tract"], fr: [Faisceau de Monakow]}
    - object: Lateral reticulospinal tract
      id: lateral-reticulospinal-tract
      hemisphere: split
      tissue: white
      family: lateral-funiculus
      color: [176, 73, 65]
      names: {en: Lateral reticulospinal tract, fr: Tractus réticulo-spinal latéral}
    - object: Posterior spinocerebellar tract
      id: posterior-spinocerebellar-tract
      hemisphere: split
      tissue: white
      family: lateral-funiculus
      color: [54, 114, 171]
      names: {en: Posterior spinocerebellar tract, fr: Tractus spino-cérébelleux postérieur}
      aliases: {en: ["Flechsig's tract", Dorsal spinocerebellar tract], fr: [Faisceau de Flechsig, Faisceau cérébelleux dorsal]}
    - object: Anterior spinocerebellar tract
      id: anterior-spinocerebellar-tract
