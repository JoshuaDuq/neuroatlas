      names: {en: Lateral corticospinal tract, fr: Tractus cortico-spinal latéral}
      aliases: {en: [Crossed pyramidal tract, Pyramidal tract], fr: [Faisceau pyramidal croisé, Tractus pyramidal]}
    - object: Rubrospinal tract
      id: rubrospinal-tract
      hemisphere: split
      tissue: white
      family: lateral-funiculus
      color: [176, 73, 65]
      names: {en: Rubrospinal tract, fr: Tractus rubro-spinal}
