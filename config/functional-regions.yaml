# Published groupings of HCP-MMP1.0 areas. Nothing here draws a border: every
# region is a list of Glasser et al. (2016) area names transcribed from its
# source, and reaches a brain through that brain's HCP-MMP projection.
# `short` is what the colour key prints: a published abbreviation, or the name
# without "cortex" as HCPex shortens Glasser's section names.
# Colours distinguish display units; they are not a published palette. They were
# chosen so regions that share a surface edge differ by an OKLab ΔE of at least
# 15 under normal vision and simulated protanopia and deuteranopia.
label: Functional divisions (Glasser 2016 sections; Glasser 2016 and Rolls 2023 named regions)
sources:
  glasser-2016:
    short: Glasser et al. (2016)
    citation: Glasser MF, Coalson TS, Robinson EC, et al. (2016) A multi-modal parcellation of human cerebral cortex. Nature 536:171–178
    doi: https://doi.org/10.1038/nature18933
    pmid: 27437579
  rolls-2023-ofc:
    short: Rolls et al. (2023), Cereb Cortex
    citation: "Rolls ET, Deco G, Huang CC, Feng J (2023) The human orbitofrontal cortex, vmPFC, and anterior cingulate cortex effective connectome: emotion, memory, and action. Cereb Cortex 33:330–356"
    doi: https://doi.org/10.1093/cercor/bhac070
    pmid: 35233615
  rolls-2023-pcc:
    short: Rolls et al. (2023), Hum Brain Mapp
    citation: Rolls ET, Wirth S, Deco G, Huang CC, Feng J (2023) The human posterior cingulate, retrosplenial, and medial parietal cortex effective connectome, and implications for memory and navigation. Hum Brain Mapp 44:629–655
    doi: https://doi.org/10.1002/hbm.26089
    pmid: 36178249
# Glasser's supplement places six areas in two ways: Table 1's bold (primary)
# column, followed here as HCPex v1.1 follows it, and the opening text of each
# section, which MNE's fetch_hcp_mmp_parcellation(combine=True) follows.
contested:
  23c: {section: 7, text_section: 18}
  '52': {section: 10, text_section: 12}
  PFcm: {section: 10, text_section: 9}
  TF: {section: 13, text_section: 14}
  a47r: {section: 21, text_section: 20}
  pOFC: {section: 19, text_section: 20}
levels:
  # Glasser 2016, Neuroanatomical Supplementary Results, Table 1: the 22 section
  # headings as printed, in sentence case, and each area in its bold (primary) section.
  sections:
