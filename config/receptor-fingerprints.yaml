# Neurotransmitter receptor densities measured by quantitative in vitro
# autoradiography in post-mortem brains (Zilles and Palomero-Gallagher), as
# published on EBRAINS: one fingerprint per dataset, the mean and SD over the
# sampled hemispheres. Nothing here is measured in the anatomy shown. A
# fingerprint reaches a region only through the name of the area or structure
# it was measured in, so it is carried per region, never per vertex or voxel.
# scripts/fetch_receptor_fingerprints.py reads the files below, pinned by
# checksum, into data/receptor-fingerprints.json; the build reads that file.
# Areas 9, 46 and 47 are also published but name no Julich-Brain area, so they
# are left out rather than placed in one.
label: Receptor fingerprints (Zilles and Palomero-Gallagher, EBRAINS)
unit: fmol/mg
bucket: https://data-proxy.ebrains.eu/api/v1/buckets/p22717-hbp-d000045_receptors-human-{key}_pub
license: CC BY-NC-SA 4.0
sources:
  zilles-2015:
    short: Zilles et al. (2015)
    citation: Zilles K, Bacha-Trams M, Palomero-Gallagher N, Amunts K, Friederici AD (2015) Common molecular basis of the sentence comprehension network revealed by neurotransmitter receptor fingerprints. Cortex 63:79–89
    doi: https://doi.org/10.1016/j.cortex.2014.07.007
    pmid: 25243991
  palomero-gallagher-2018:
    short: Palomero-Gallagher & Zilles (2018)
    citation: Palomero-Gallagher N, Zilles K (2018) Cyto- and receptor architectonic mapping of the human brain. Handb Clin Neurol 150:355–387
    doi: https://doi.org/10.1016/B978-0-444-63639-3.00024-4
    pmid: 29496153
# Display order. A receptor's `display` is its symbol, with `{sub: …}` parts set
# as subscripts. `aliases` are the other spellings the published files use.
transmitters:
  - id: glutamate
    name: Glutamate
    name_fr: Glutamate
    receptors:
      - {id: AMPA, display: [AMPA]}
      - {id: kainate, display: [kainate]}
      - {id: NMDA, display: [NMDA]}
      - {id: mGluR2/3, display: [mGluR2/3], aliases: [mGluR2_3, mGlu2/3]}
  - id: gaba
    name: GABA
    name_fr: GABA
    receptors:
      - {id: GABAA, display: [GABA, {sub: A}]}
      - {id: GABAB, display: [GABA, {sub: B}]}
      - {id: BZ, display: [GABA, {sub: A}, /BZ]}
  - id: acetylcholine
    name: Acetylcholine
    name_fr: Acétylcholine
    receptors:
      - {id: M1, display: [M, {sub: "1"}]}
      - {id: M2, display: [M, {sub: "2"}]}
      - {id: M3, display: [M, {sub: "3"}]}
      - {id: alpha4beta2, display: [α, {sub: "4"}, β, {sub: "2"}]}
  - id: noradrenaline
    name: Noradrenaline
    name_fr: Noradrénaline
    receptors:
      - {id: alpha1, display: [α, {sub: "1"}]}
      - {id: alpha2, display: [α, {sub: "2"}]}
  - id: serotonin
    name: Serotonin
    name_fr: Sérotonine
    receptors:
      - {id: 5-HT1A, display: [5-HT, {sub: 1A}]}
      - {id: 5-HT2, display: [5-HT, {sub: "2"}]}
  - id: dopamine
    name: Dopamine
    name_fr: Dopamine
    receptors:
      - {id: D1, display: [D, {sub: "1"}]}
  - id: adenosine
    name: Adenosine
    name_fr: Adénosine
    receptors:
      - {id: A1, display: [A, {sub: "1"}]}
# A published value known to be wrong is withheld, with the evidence; the fetch
# fails if the file no longer holds it, so the exception cannot outlive the error.
withheld:
  - dataset: ifs1
    receptor: D1
    field: sd
    published: 863
    reason: The published SD equals the same file's A1 mean, while D1's SD is 27–44 fmol/mg in the five neighbouring IFS and IFJ areas measured in the same brains.
    reason_fr: L’écart-type publié est égal à la moyenne A1 du même fichier, alors que celui de D1 est de 27 à 44 fmol/mg dans les cinq aires voisines IFS et IFJ mesurées dans les mêmes cerveaux.
# `key` is the EBRAINS bucket's name; `measured_in` is the dataset's own name
# for what was sampled. `targets` name regions by their atlas and source name;
# an aseg name is matched with its hemisphere prefix (Left-, Right-). Where an
# area was sampled in two parts, each part's dataset names it in `part`.
