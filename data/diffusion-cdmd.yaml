id: cdmd-sub-013
name:
  en: MGH CDMD · sub_013
  fr: MGH CDMD · sub_013
source: https://doi.org/10.6084/m9.figshare.c.5315474.v1
license: CC0-1.0
# Tracked here from the subject's own diffusion scan: RecoBundles tracts by
# scripts/cdmd_pilot.py; SLF I–III, the callosal segments and FA by
# scripts/tractseg_cdmd.py; all packaged by scripts/prepare_diffusion_cdmd.py.
provenance: cdmd-sub-013/provenance.json
anatomy: cdmd
reference_space: cdmd-sub-013/surface-space.json
overlay_cortex_opacity: 0.16
# The step the pilot's 0.2 mm tracking is resampled to, the step of the DIPY
# SNAIL tracts Planum first published; provenance records how far that moves the geometry.
resample_step_mm: 0.5
text:
  en:
    dataset: MGH CDMD · sub_013
    otherAnatomy: The selected anatomical atlas uses a different subject from these MGH CDMD tracts.
    files: "Files: each tract is one TRK streamline file, its ends trimmed where they left the brain and resampled to 0.5 mm steps; the MRI is sub_013_t1w.nii.gz and FA is fa.nii.gz."
    mriTitle: MRI with tracts · MGH CDMD sub_013
    mriCanvas: Linked MGH CDMD MRI slices and tracts. Click to position the crosshair; arrows move one voxel.
    mriScope: Scanner RAS millimetres · R/L marked. Tracts were tracked in this scan’s own diffusion data and are drawn at 0.5 mm steps with the current length filter; SLF I–III and the callosal segments are TractSeg’s, the others RecoBundles’. Cortical atlas parcels remain surface labels.
  fr:
    dataset: MGH CDMD · sub_013
    otherAnatomy: L’atlas anatomique sélectionné utilise un autre sujet que ces faisceaux MGH CDMD.
    files: "Fichiers : chaque faisceau est un fichier de trajectoires TRK, ses extrémités coupées là où elles sortaient du cerveau puis rééchantillonné à des pas de 0,5 mm ; l’IRM est sub_013_t1w.nii.gz et la FA est fa.nii.gz."
    mriTitle: IRM avec faisceaux · MGH CDMD sub_013
    mriCanvas: Coupes IRM MGH CDMD liées et faisceaux. Cliquer pour placer le réticule ; les flèches déplacent d’un voxel.
    mriScope: Millimètres RAS du scanner · L/R (gauche/droite) indiquées. Les faisceaux ont été suivis dans les données de diffusion de cette même image et sont tracés à des pas de 0,5 mm avec le filtre de longueur courant ; le FLS I–III et les segments calleux viennent de TractSeg, les autres de RecoBundles. Les régions corticales restent des étiquettes de surface.
brain_outline:
  file: cdmd-sub-013/brain-outline.glb
  provenance: cdmd-sub-013/brain-outline.json
  # The T1 keeps the skull, so the outline is the reconstruction's own
  # skull-stripped brain, in the same scanner frame.
  source: data/cdmd/mri/brain.mgz
  intensity_threshold: 1
  step_size: 2
  opacity: 0.16
maps:
  - id: t1
    file: cdmd-sub-013/sub_013_t1w.nii.gz
    name: { en: T1 reference, fr: Référence T1 }
    colormap: gray
    # 0 to just above the scan's maximum (523.8).
    range: [0, 525]
    opacity: 1
  # Tensor FA (b = 0, 800, 1500) of the subject's own diffusion scan, resampled onto the T1 grid.
  - id: fa
    file: cdmd-sub-013/fa.nii.gz
    name: { en: Fractional anisotropy (FA), fr: Anisotropie fractionnelle (FA) }
    colormap: viridis
    range: [0, 1]
    opacity: 0
bundles:
  - id: af-left
    file: cdmd-sub-013/af.left.trk.gz
    name: { en: Arcuate fasciculus · left, fr: Faisceau arqué · gauche }
    class: association
    initial: true
  - id: af-right
    file: cdmd-sub-013/af.right.trk.gz
    name: { en: Arcuate fasciculus · right, fr: Faisceau arqué · droit }
    class: association
  - id: cst-left
    file: cdmd-sub-013/cst.left.trk.gz
    name: { en: Corticospinal tract · left, fr: Faisceau corticospinal · gauche }
    class: projection
  - id: cst-right
    file: cdmd-sub-013/cst.right.trk.gz
    name: { en: Corticospinal tract · right, fr: Faisceau corticospinal · droit }
    class: projection
    initial: true
  - id: cg-left
    file: cdmd-sub-013/cg.left.trk.gz
    name: { en: Cingulum · left, fr: Cingulum · gauche }
    class: association
  - id: cg-right
    file: cdmd-sub-013/cg.right.trk.gz
    name: { en: Cingulum · right, fr: Cingulum · droit }
