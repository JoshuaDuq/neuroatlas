id: cdmd-sub-013
name:
  en: MGH CDMD · sub_013
  fr: MGH CDMD · sub_013
source: https://doi.org/10.6084/m9.figshare.c.5315474.v1
license: CC0-1.0
# Tracked here from the subject's own diffusion scan by scripts/cdmd_pilot.py,
# packaged by scripts/prepare_diffusion_cdmd.py.
provenance: cdmd-sub-013/provenance.json
anatomy: cdmd
reference_space: cdmd-sub-013/surface-space.json
overlay_cortex_opacity: 0.16
# The step the pilot's 0.2 mm tracking is resampled to, the published SNAIL
# tracts' own; provenance records how far that moves the geometry.
resample_step_mm: 0.5
text:
  en:
    dataset: MGH CDMD · sub_013
    otherAnatomy: The selected anatomical atlas uses a different subject from these MGH CDMD tracts.
    files: "Files: each tract is one TRK streamline file, resampled to 0.5 mm steps; the MRI is sub_013_t1w.nii.gz."
    mriTitle: MRI with tracts · MGH CDMD sub_013
    mriCanvas: Linked MGH CDMD MRI slices and tracts. Click to position the crosshair; arrows move one voxel.
    mriScope: Scanner RAS millimetres · R/L marked. Tracts were tracked in this scan’s own diffusion data and are drawn at 0.5 mm steps with the current length filter. Cortical atlas parcels remain surface labels.
  fr:
    dataset: MGH CDMD · sub_013
    otherAnatomy: L’atlas anatomique sélectionné utilise un autre sujet que ces faisceaux MGH CDMD.
    files: "Fichiers : chaque faisceau est un fichier de trajectoires TRK, rééchantillonné à des pas de 0,5 mm ; l’IRM est sub_013_t1w.nii.gz."
    mriTitle: IRM avec faisceaux · MGH CDMD sub_013
    mriCanvas: Coupes IRM MGH CDMD liées et faisceaux. Cliquer pour placer le réticule ; les flèches déplacent d’un voxel.
    mriScope: Millimètres RAS du scanner · L/R (gauche/droite) indiquées. Les faisceaux ont été suivis dans les données de diffusion de cette même image et sont tracés à des pas de 0,5 mm avec le filtre de longueur courant. Les régions corticales restent des étiquettes de surface.
brain_outline:
  file: cdmd-sub-013/brain-outline.glb
  provenance: cdmd-sub-013/brain-outline.json
  # The T1 keeps the skull, so the outline is the reconstruction's own
  # skull-stripped brain, in the same scanner frame.
  source: data/cdmd/mri/brain.mgz
  intensity_threshold: 1
  step_size: 2
  opacity: 0.16
maps:
  - id: t1
    file: cdmd-sub-013/sub_013_t1w.nii.gz
    name: { en: T1 reference, fr: Référence T1 }
    colormap: gray
    # 0 to just above the scan's maximum (523.8), as SNAIL's map runs to its own.
    range: [0, 525]
    opacity: 1
