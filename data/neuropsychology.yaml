    laterality: bilateral
    finding:
      en: Abulia was the most significant behavioural disturbance with caudate lesions (28%), sometimes alternating with disinhibition (11%). Caudate lesions rarely caused motor disorders, unlike lentiform lesions.
      fr: L’aboulie était le trouble comportemental le plus marqué avec les lésions du noyau caudé (28 %), alternant parfois avec une désinhibition (11 %). Les lésions caudées causaient rarement des troubles moteurs, contrairement aux lésions lenticulaires.
    limitation:
      en: A review of published cases, some with lesions extending into the internal capsule or periventricular white matter. Confusion was usually associated with intracerebral haemorrhage, and depression was a relatively non-specific finding.
      fr: Revue de cas publiés, dont certains avec des lésions étendues à la capsule interne ou à la substance blanche périventriculaire. La confusion était généralement associée à une hémorragie intracérébrale, et la dépression était une observation relativement non spécifique.
    mapping_note:
      en: Whole caudate nuclei are shown. The review did not separate head, body and tail.
      fr: Les noyaux caudés entiers sont affichés. La revue ne distinguait pas la tête, le corps et la queue.
