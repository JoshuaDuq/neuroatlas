      fr: Sur 19 cas rapportés de dystonie, 16 avaient une lésion thalamique unilatérale avec dystonie controlatérale. Lorsqu’elle était précisée, la localisation était postérieure ou postérolatérale dans six cas et paramédiane dans quatre, et la dystonie apparaissait généralement un à neuf mois après une hémiplégie initiale.
    limitation:
      en: Published cases with lesion location stated in only ten. The implicated sites lie outside the ventrolateral and ventroanterior nuclei that receive pallidal and nigral input.
      fr: Cas publiés avec localisation lésionnelle précisée dans dix seulement. Les sites impliqués sont hors des noyaux ventrolatéral et ventroantérieur qui reçoivent les afférences pallidales et nigriques.
    mapping_note:
      en: The whole thalamus is shown on both sides. Posterior and paramedian portions are not separated at this level.
      fr: Le thalamus entier est affiché des deux côtés. Les portions postérieure et paramédiane ne sont pas séparées à ce niveau.
