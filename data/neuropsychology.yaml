      - {reference: ogden-1985, role: supporting}

  - id: finger-agnosia-parietal-disconnection
    deficit: finger-agnosia
    title: {en: Finger identification and parietal disconnection, fr: Identification digitale et déconnexion pariétale}
    network: {en: Left intraparietal body-representation connections, fr: Connexions intrapariétales gauches de représentation corporelle}
    laterality: left
    finding:
      en: A patient with Gerstmann’s four signs, including finger agnosia, had predominantly superior parietal damage and disruption of intraparietal connections. Angular-to-superior-parietal tracts crossed the implicated subcortical area.
      fr: Un patient avec les quatre signes de Gerstmann, dont l’agnosie digitale, avait une atteinte surtout pariétale supérieure et une déconnexion intrapariétale. Des faisceaux reliant les gyri angulaire et pariétal supérieur traversaient la zone sous-corticale impliquée.
    limitation:
      en: This mixed syndrome does not isolate finger identification. Anema’s three angular-lesion cases had selective identification problems despite intact touch localization on their own hand, so one site or mechanism cannot cover every presentation.
      fr: Ce syndrome mixte n’isole pas l’identification digitale. Les trois cas de lésions angulaires d’Anema avaient un trouble sélectif d’identification malgré une localisation tactile préservée sur leur propre main; un seul site ou mécanisme ne couvre donc pas toutes les présentations.
    mapping_note:
      en: The left superior parietal parcel marks the main cortical lesion in the Gerstmann case. It does not reproduce white-matter disconnection or map the angular-lesion cases, whose side is unspecified in the abstract.
      fr: La parcelle pariétale supérieure gauche repère la lésion corticale principale du cas de Gerstmann. Elle ne reproduit pas la déconnexion de substance blanche et ne cartographie pas les cas angulaires, dont le côté n’est pas précisé dans le résumé.
