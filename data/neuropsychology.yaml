  - id: anosognosia-disconnection
    deficit: anosognosia
    title: {en: Direct injury and disconnection in motor unawareness, fr: Lésion directe et déconnexion dans la méconnaissance motrice}
    network: {en: 'Right motor, limbic and ventral attention systems', fr: 'Systèmes moteurs, limbiques et attentionnels ventraux droits'}
    laterality: right
    finding:
      en: In 174 stroke patients, anosognosia was associated with a combination of insular, striatal and temporal-pole injury and disconnection of cingulum, frontostriatal, frontal aslant and superior longitudinal III pathways. A combined model fit the study data better than isolated grey-matter lesions.
      fr: Chez 174 patients avec AVC, l’anosognosie était associée à une combinaison de lésions insulaires, striatales et du pôle temporal et de déconnexions des voies du cingulum, frontostriatales, frontales obliques et longitudinales supérieures III. Un modèle combiné s’ajustait mieux aux données étudiées que les lésions isolées de substance grise.
    limitation:
      en: The cohort was restricted to right stroke with severe arm paralysis, and tract damage was estimated from healthy brains. Monai’s 28-case comparison found disconnection differences but no additional direct-lesion cluster; reconstruction from published images and incompletely matched clinical features limit that comparison.
      fr: La cohorte était limitée aux AVC droits avec paralysie sévère du bras, et l’atteinte des faisceaux était estimée à partir de cerveaux sains. La comparaison de 28 cas de Monai trouvait des différences de déconnexion sans amas supplémentaire de lésion directe; la reconstruction d’images publiées et l’appariement clinique incomplet limitent cette comparaison.
    mapping_note:
      en: Long-insular and putaminal parcels mark selected directly injured regions in Pacella’s analysis. They do not isolate the anterior long insular gyrus, map the temporal-pole finding or reconstruct the disconnected pathways. Connected sites are not displayed as if directly injured.
      fr: Les parcelles insulaire longue et putaminale repèrent des régions directement atteintes sélectionnées dans l’analyse de Pacella. Elles n’isolent pas le gyrus insulaire long antérieur, ne cartographient pas le constat du pôle temporal et ne reconstruisent pas les voies déconnectées. Les sites connectés ne sont pas affichés comme directement lésés.
    mappings:
