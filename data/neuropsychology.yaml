      fr: Les parcelles thalamiques, linguales et fusiforme droite entières sont des repères approximatifs entre patients; une atteinte bilatérale n’est pas requise. Les données linguales droites dépendent du modèle. Les cartes propres aux composantes ne sont pas affichées.
