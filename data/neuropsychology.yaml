  - id: dystonia-putamen
    deficit: dystonia
    title: {en: Dystonia after lentiform lesions, fr: Dystonie après lésion lenticulaire}
    network: {en: Putamen and globus pallidus, fr: Putamen et globus pallidus}
    laterality: bilateral
    finding:
      en: Among 240 published cases with basal ganglia lesions, dystonia was the most frequent movement disorder (36%). Lentiform lesions caused dystonia in 49% of cases, rising to 63% when the putamen was involved.
      fr: Parmi 240 cas publiés avec lésions des noyaux gris centraux, la dystonie était le mouvement anormal le plus fréquent (36 %). Les lésions lenticulaires causaient une dystonie dans 49 % des cas, jusqu’à 63 % lorsque le putamen était atteint.
    limitation:
      en: These percentages describe selected published cases, not population risks; larger lesions often involved nearby white matter. Corp’s 25 cervical-dystonia cases included cerebellar and brainstem lesions, linked by normative connectivity to a cerebellar–somatosensory network. Basal ganglia damage is not a universal explanation for acquired cervical dystonia.
      fr: Ces pourcentages décrivent des cas publiés sélectionnés, pas des risques populationnels; les grandes lésions impliquaient souvent la substance blanche voisine. Les 25 cas de dystonie cervicale de Corp comprenaient des lésions cérébelleuses et du tronc cérébral, reliées par connectivité normative à un réseau cérébello-somatosensoriel. L’atteinte des noyaux gris n’explique pas universellement la dystonie cervicale acquise.
    mapping_note:
      en: Whole putamen and pallidum are shown on both sides. The published lesions varied in size and often exceeded these structures.
      fr: Le putamen et le pallidum entiers sont affichés des deux côtés. Les lésions publiées variaient en taille et dépassaient souvent ces structures.
    mappings:
