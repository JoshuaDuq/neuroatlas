  - id: parkinsonism-lentiform
    deficit: parkinsonism
    title: {en: Parkinsonism after bilateral lentiform lesions, fr: Syndrome parkinsonien après lésions lenticulaires bilatérales}
    network: {en: Globus pallidus and putamen, fr: Globus pallidus et putamen}
