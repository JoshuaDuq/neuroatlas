    laterality: bilateral
    finding:
      en: Five patients with thalamic stroke misjudged the date, time of day or elapsed time. All had left mediodorsal involvement, three with bilateral lesions. A later case had a right medial thalamic infarct and right frontal hypoperfusion.
      fr: Cinq patients avec AVC thalamique jugeaient mal la date, l’heure ou le temps écoulé. Tous avaient une atteinte médiodorsale gauche, dont trois bilatérale. Un cas ultérieur avait un infarctus thalamique médial droit et une hypoperfusion frontale droite.
    limitation:
      en: A five-case series and one later case do not establish diagnostic accuracy or a unique timing centre. The proposed contribution of remote frontal dysfunction in the right-sided case is an interpretation, not proof of a causal pathway.
      fr: Une série de cinq cas et un cas ultérieur n’établissent ni la précision diagnostique ni un centre temporel unique. La contribution proposée d’un dysfonctionnement frontal à distance dans le cas droit est une interprétation, pas la preuve d’une voie causale.
    mapping_note:
      en: Whole thalami are landmarks for the medial thalamic findings; the mediodorsal nuclei and remote frontal dysfunction are not delineated. Cases occurred with unilateral as well as bilateral lesions.
      fr: Les thalamus entiers sont des repères des constats thalamiques médiaux; les noyaux médiodorsaux et le dysfonctionnement frontal à distance ne sont pas délimités. Les cas comportaient des lésions unilatérales ou bilatérales.
    mappings:
      - {region: 'aseg:left:10', source_name: Left-Thalamus-Proper}
      - {region: 'aseg:right:49', source_name: Right-Thalamus-Proper}
    evidence:
      - {reference: kumral-2007, role: supporting}
      - {reference: hayashi-2018, role: supporting}

  - id: oculomotor-apraxia-posterior
    deficit: oculomotor-apraxia
    title: {en: Voluntary gaze after posterior cerebral injury, fr: Regard volontaire après atteinte cérébrale postérieure}
    network: {en: Posterior parietal gaze-control system, fr: Système pariétal postérieur de contrôle du regard}
    laterality: bilateral
    finding:
      en: A prospective parietal-stroke series reported oculomotor apraxia with bilateral posterior lesions. A later case developed horizontal oculomotor apraxia and optic ataxia after right occipitoparietal tumour resection, without simultanagnosia.
      fr: Une série prospective d’AVC pariétaux rapportait une apraxie oculomotrice avec lésions postérieures bilatérales. Un cas ultérieur développait une apraxie oculomotrice horizontale et une ataxie optique après résection tumorale occipitopariétale droite, sans simultanagnosie.
    limitation:
      en: The 32-patient series described many parietal motor signs and did not isolate a gaze-specific lesion cluster. The later unilateral case was left-handed and had additional deficits; it does not establish a universal right-sided localization.
      fr: La série de 32 patients décrivait plusieurs signes moteurs pariétaux et n’isolait pas d’amas lésionnel propre au regard. Le cas unilatéral ultérieur était gaucher et avait d’autres déficits; il n’établit pas de localisation droite universelle.
    mapping_note:
      en: The consulted abstracts identify broad posterior regions without parcel-level gaze-field boundaries, so no specific atlas parcel is selected. The bilateral label reflects the series, not a requirement that every case has bilateral injury.
      fr: Les résumés consultés identifient des régions postérieures larges sans limites des champs du regard à l’échelle des parcelles; aucune parcelle précise n’est donc sélectionnée. L’étiquette bilatérale reflète la série, pas une exigence d’atteinte bilatérale dans chaque cas.
    mappings: []
    evidence:
      - {reference: ghika-1998, role: supporting}
      - {reference: aboulhosn-2022, role: qualifying}

  - id: buccofacial-apraxia-insular
    deficit: buccofacial-apraxia
    title: {en: Co-occurring speech and nonspeech oral apraxia, fr: Apraxies associées de la parole et buccofaciale}
    network: {en: Left insular oral-praxis network, fr: Réseau insulaire gauche des praxies orales}
    laterality: left
    finding:
      en: In 137 acute left-stroke patients, co-occurring speech and oral apraxia was predominantly associated with insular damage. The five patients with only one of these apraxias had spared insulae and different lesion patterns.
      fr: Chez 137 patients avec AVC gauche aigu, les apraxies associées de la parole et orale étaient surtout liées à une atteinte insulaire. Les cinq patients avec une seule de ces apraxies avaient des insulas préservées et des profils lésionnels différents.
    limitation:
      en: All 33 patients with either oral or speech apraxia also had aphasia, and the tests overlap with language and praxis demands. This association does not isolate a necessary insular site for nonspeech oral movements; Kwon reported pure buccofacial apraxia after premotor injury.
      fr: Les 33 patients avec apraxie orale ou de la parole avaient aussi une aphasie et les tests sollicitent également le langage et les praxies. Cette association n’isole pas un site insulaire nécessaire aux mouvements oraux non verbaux; Kwon rapportait une apraxie buccofaciale pure après atteinte prémotrice.
    mapping_note:
      en: Short and long left insular parcels are broad landmarks for the co-occurring syndrome. They exceed the lesion clusters and do not map every isolated oral-apraxia case.
      fr: Les parcelles insulaires courtes et longues gauches sont des repères larges du syndrome associé. Elles dépassent les amas lésionnels et ne cartographient pas tous les cas d’apraxie orale isolée.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:left:17', source_name: 'G_Ins_lg&S_cent_ins'}
    evidence:
      - {reference: conterno-2022, role: supporting}
      - {reference: kwon-2013, role: qualifying}

  - id: buccofacial-apraxia-premotor
    deficit: buccofacial-apraxia
    title: {en: Isolated oral apraxia after premotor infarction, fr: Apraxie orale isolée après infarctus prémoteur}
    network: {en: Left ventral premotor orofacial control, fr: Contrôle orofacial prémoteur ventral gauche}
    laterality: left
    finding:
      en: Kwon described pure buccofacial apraxia after a left ventral premotor infarct, demonstrating that nonspeech oral impairment can occur independently of the usual accompanying speech or language disorders.
      fr: Kwon décrivait une apraxie buccofaciale pure après infarctus prémoteur ventral gauche, montrant qu’un trouble oral non verbal peut survenir indépendamment des troubles habituels associés de la parole ou du langage.
    limitation:
      en: One rare case establishes a possible dissociation, not a universal lesion site. Conterno’s isolated oral-apraxia cases instead had temporoparietal or striatocapsular lesions.
      fr: Un cas rare établit une dissociation possible, pas un site lésionnel universel. Les cas d’apraxie orale isolée de Conterno avaient plutôt des lésions temporopariétales ou striatocapsulaires.
    mapping_note:
      en: The whole precentral parcel provides a broad landmark for the ventral premotor finding. It does not separate the ventral premotor territory from primary motor cortex or reproduce the infarct boundaries.
      fr: La parcelle précentrale entière fournit un repère large du constat prémoteur ventral. Elle ne sépare pas le territoire prémoteur ventral du cortex moteur primaire et ne reproduit pas les limites de l’infarctus.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: kwon-2013, role: supporting}
      - {reference: conterno-2022, role: qualifying}

  - id: foreign-accent-precentral
    deficit: foreign-accent
    title: {en: Heterogeneous lesions and a connected speech network, fr: Lésions hétérogènes et réseau de parole connecté}
    network: {en: Distributed motor-speech and phonation network, fr: Réseau distribué de motricité de la parole et de phonation}
    laterality: left
    finding:
      en: Among 25 selected cases without aphasia, direct lesion overlap peaked in the lower left precentral gyrus but included only five cases. A larger overlap of functional connections involved bilateral precentral and medial frontal regions.
      fr: Parmi 25 cas sélectionnés sans aphasie, le chevauchement lésionnel direct culminait dans le gyrus précentral inférieur gauche mais ne concernait que cinq cas. Un chevauchement plus étendu des connexions fonctionnelles impliquait les régions précentrales bilatérales et frontales médiales.
    limitation:
      en: Lesions were reconstructed from published two-dimensional images, and connectivity came from healthy participants. Connected network sites were not necessarily damaged. This selected sample does not cover every cause of acquired accent change.
      fr: Les lésions étaient reconstruites à partir d’images bidimensionnelles publiées et la connectivité provenait de participants sains. Les sites connectés n’étaient pas nécessairement lésés. Cet échantillon sélectionné ne couvre pas toutes les causes de changement acquis de l’accent.
    mapping_note:
      en: The left precentral parcel marks the limited direct-overlap finding, not the entire connected network. It does not isolate the lower or laryngeal motor representations, and most lesions lay elsewhere.
      fr: La parcelle précentrale gauche repère le chevauchement lésionnel direct limité, pas l’ensemble du réseau connecté. Elle n’isole pas les représentations motrices inférieures ou laryngées et la plupart des lésions étaient ailleurs.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: higashiyama-2021, role: supporting}
      - {reference: abel-2009, role: qualifying}

  - id: foreign-accent-somatosensory
    deficit: foreign-accent
    title: {en: Accent change with a somatosensory cortical lesion, fr: Changement d’accent avec lésion corticale somatosensorielle}
    network: {en: Left anterior parietal speech-feedback territory, fr: Territoire pariétal antérieur gauche du retour sensoriel de la parole}
    laterality: left
    finding:
      en: A woman with a left anterior parietal metastasis had dysarthric, newly accented speech. Intraoperative stimulation mapping placed the lesion within somatosensory cortex.
      fr: Une femme avec métastase pariétale antérieure gauche avait une parole dysarthrique avec accent nouvellement modifié. La cartographie par stimulation peropératoire situait la lésion dans le cortex somatosensoriel.
    limitation:
      en: One tumour case with accompanying weakness and dysarthria cannot isolate the mechanism of accent change or establish that somatosensory damage is necessary.
      fr: Un cas tumoral avec faiblesse et dysarthrie associées n’isole pas le mécanisme du changement d’accent et n’établit pas qu’une atteinte somatosensorielle soit nécessaire.
    mapping_note:
      en: The whole postcentral parcel provides a somatosensory landmark. It is not a reproduction of the tumour or a claim that the entire gyrus controls accent.
      fr: La parcelle postcentrale entière fournit un repère somatosensoriel. Elle ne reproduit pas la tumeur et n’affirme pas que le gyrus entier contrôle l’accent.
    mappings:
      - {region: 'destrieux:left:28', source_name: G_postcentral}
    evidence:
      - {reference: abel-2009, role: supporting}

  - id: phonagnosia-posterior-temporal
    deficit: phonagnosia
    title: {en: Learning and identifying voices, fr: Apprentissage et identification des voix}
    network: {en: Right posterior temporal voice-identity processing, fr: Traitement de l’identité vocale temporal postérieur droit}
    laterality: right
    finding:
      en: In 58 patients, right posterior and mid-temporal lesions were associated with poorer voice-identity performance after accounting for face recognition. Right inferior parietal involvement depended on associating voices with faces rather than names.
      fr: Chez 58 patients, les lésions temporales postérieures et moyennes droites étaient associées à une identification vocale moins bonne après prise en compte de la reconnaissance faciale. L’implication pariétale inférieure droite dépendait de l’association des voix aux visages plutôt qu’aux noms.
    limitation:
      en: Corrected results were strongest for newly learned or combined voice-identity scores. The familiar-voice-only association did not survive adjustment for hearing and lesion volume; one localization cannot cover all forms of phonagnosia.
      fr: Les résultats corrigés étaient les plus solides pour les scores de voix nouvellement apprises ou combinés. L’association limitée aux voix familières ne résistait pas à l’ajustement pour l’audition et le volume lésionnel; une localisation unique ne couvre pas toutes les formes de phonagnosie.
    mapping_note:
      en: Lateral superior temporal and planum temporale parcels mark the selected posterior temporal findings. Whole parcels exceed the clusters; task-dependent parietal involvement is not drawn.
      fr: Les parcelles temporale supérieure latérale et du planum temporale repèrent les constats temporaux postérieurs sélectionnés. Les parcelles entières dépassent les amas; l’implication pariétale dépendante de la tâche n’est pas représentée.
    mappings:
      - {region: 'destrieux:right:34', source_name: G_temp_sup-Lateral}
      - {region: 'destrieux:right:36', source_name: G_temp_sup-Plan_tempo}
    evidence:
      - {reference: roswandowitz-2018, role: supporting}
      - {reference: luzzi-2018, role: qualifying}

  - id: phonagnosia-familiar-voices
    deficit: phonagnosia
    title: {en: Selective loss of familiar-voice recognition, fr: Perte sélective de reconnaissance des voix familières}
    network: {en: Right anterior temporal person-identity processing, fr: Traitement de l’identité des personnes temporal antérieur droit}
    laterality: right
    finding:
      en: A patient failed to recognize famous voices after right temporal-pole and subcortical infarcts, despite preserved voice perception, face recognition and other tested cognitive functions.
      fr: Un patient ne reconnaissait plus les voix célèbres après des infarctus du pôle temporal et des structures sous-corticales droits, malgré une perception vocale, une reconnaissance faciale et d’autres fonctions cognitives testées préservées.
    limitation:
      en: One case with temporal and subcortical lesions cannot isolate the temporal pole’s contribution. The larger cohort implicated posterior temporal sites, especially for newly learned voices, so this is not a universal voice-recognition centre.
      fr: Un cas avec lésions temporales et sous-corticales n’isole pas la contribution du pôle temporal. La cohorte plus large impliquait des sites temporaux postérieurs, surtout pour les voix nouvellement apprises; il ne s’agit donc pas d’un centre universel de reconnaissance vocale.
    mapping_note:
      en: The right temporal-pole parcel marks the reported cortical site only. It does not reproduce the lenticular and caudate injury or separate familiarity from other person-knowledge processes.
      fr: La parcelle du pôle temporal droit repère seulement le site cortical rapporté. Elle ne reproduit pas l’atteinte lenticulaire et caudée et ne sépare pas la familiarité des autres processus de connaissance des personnes.
    mappings:
      - {region: 'destrieux:right:44', source_name: Pole_temporal}
    evidence:
      - {reference: luzzi-2018, role: supporting}
      - {reference: roswandowitz-2018, role: qualifying}

  - id: emotional-empathy-inferior-frontal
    deficit: emotional-empathy
    title: {en: Emotional empathy and cognitive perspective-taking, fr: Empathie émotionnelle et prise de perspective cognitive}
    network: {en: Inferior frontal affective-sharing system, fr: Système frontal inférieur de partage affectif}
    laterality: bilateral
    finding:
      en: Inferior frontal lesions were associated with reduced emotional empathy, while ventromedial prefrontal lesions affected cognitive empathy. Lesion mapping particularly implicated area 44 in the emotional component.
      fr: Les lésions frontales inférieures étaient associées à une empathie émotionnelle réduite, tandis que les lésions préfrontales ventromédianes affectaient l’empathie cognitive. La cartographie impliquait particulièrement l’aire 44 dans la composante émotionnelle.
    limitation:
      en: Small groups, mostly head injuries, and predominantly CT-based localization limit anatomical specificity. Possible diffuse injury and uncertain correspondence to cytoarchitectonic areas remain.
      fr: Les petits groupes, les traumatismes crâniens majoritaires et la localisation surtout en TDM limitent la spécificité anatomique. Une atteinte diffuse possible et une correspondance incertaine aux aires cytoarchitectoniques persistent.
    mapping_note:
      en: Opercular parcels approximate area 44. The inferior frontal group comprised five right and three left lesions; both landmarks are shown without implying bilateral injury.
      fr: Les parcelles operculaires représentent approximativement l’aire 44. Le groupe frontal inférieur comprenait cinq lésions droites et trois gauches; les deux repères sont montrés sans impliquer une atteinte bilatérale.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
      - {region: 'destrieux:right:12', source_name: G_front_inf-Opercular}
    evidence:
      - {reference: shamay-tsoory-2009, role: supporting}

  - id: emotional-empathy-pain-insula
    deficit: emotional-empathy
    title: {en: Processing another person’s pain, fr: Traitement de la douleur d’autrui}
    network: {en: Anterior insular empathetic pain processing, fr: Traitement insulaire antérieur de la douleur empathique}
    laterality: bilateral
    finding:
      en: Patients with anterior insular lesions were less accurate and slower when judging others’ pain and lacked the usual implicit interference from pain images. These effects were not found in the anterior cingulate lesion comparison group.
      fr: Les patients avec lésions insulaires antérieures étaient moins précis et plus lents pour juger la douleur d’autrui et ne présentaient pas l’interférence implicite habituelle des images douloureuses. Ces effets n’étaient pas observés dans le groupe comparatif avec lésions cingulaires antérieures.
    limitation:
      en: Three insular cases and a task-specific comparison do not establish every mechanism of emotional empathy. Performance on pain judgments cannot by itself measure everyday empathic concern or the full range of emotional sharing.
      fr: Trois cas insulaires et une comparaison ciblée n’établissent pas tous les mécanismes de l’empathie émotionnelle. Les jugements de douleur ne mesurent pas à eux seuls la sollicitude empathique quotidienne ou toute l’étendue du partage émotionnel.
    mapping_note:
      en: Short insular parcels mark the anterior region broadly. Two insular lesions were left-sided and one right-sided; displaying both landmarks does not imply that bilateral damage is required.
      fr: Les parcelles insulaires courtes repèrent largement la région antérieure. Deux lésions insulaires étaient gauches et une droite; l’affichage des deux repères n’implique pas qu’une atteinte bilatérale soit nécessaire.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:right:18', source_name: G_insular_short}
    evidence:
      - {reference: gu-2012, role: supporting}

  - id: disinhibition-orbitofrontal
    deficit: disinhibition
    title: {en: Caregiver-reported disinhibition after traumatic injury, fr: Désinhibition rapportée par les proches après traumatisme}
    network: {en: Orbitofrontal and distributed social-control regions, fr: Régions orbitofrontales et réseau distribué de contrôle social}
    laterality: bilateral
    finding:
      en: Greater reported disinhibition was associated with damage mainly in right orbitofrontal cortex, with additional bilateral rectus and insular, right temporal and left frontal regions. The voxelwise results survived false-discovery-rate correction.
      fr: Une désinhibition rapportée plus importante était associée surtout à une atteinte orbitofrontale droite, avec d’autres régions rectus et insulaires bilatérales, temporales droites et frontales gauches. Les résultats voxel par voxel résistaient à la correction du taux de fausses découvertes.
    limitation:
      en: The study measured caregiver reports decades after injury in male veterans. Lesion groups differed in total volume loss, and a single assessment cannot reconstruct the time course or establish that one region alone causes disinhibition.
      fr: L’étude mesurait les observations des proches des décennies après la lésion chez des vétérans masculins. Les groupes différaient par la perte de volume totale et une évaluation unique ne reconstitue pas l’évolution ni n’établit qu’une seule région cause la désinhibition.
    mapping_note:
      en: The right orbital and both rectus parcels provide selected frontal landmarks. They exceed the significant clusters and omit the additional temporal, insular and lateral frontal findings.
      fr: Les parcelles orbitale droite et rectus bilatérales fournissent des repères frontaux sélectionnés. Elles dépassent les amas significatifs et omettent les autres constats temporaux, insulaires et frontaux latéraux.
    mappings:
      - {region: 'destrieux:right:24', source_name: G_orbital}
      - {region: 'destrieux:left:31', source_name: G_rectus}
      - {region: 'destrieux:right:31', source_name: G_rectus}
    evidence:
      - {reference: knutson-2015, role: supporting}

  - id: left-right-parietal-disconnection
    deficit: left-right-disorientation
    title: {en: Left–right confusion within a parietal syndrome, fr: Confusion droite-gauche dans un syndrome pariétal}
    network: {en: Parietal spatial and body-representation connections, fr: Connexions pariétales des représentations spatiales et corporelles}
    laterality: left
    finding:
      en: A patient with left superior parietal damage had left–right orientation problems together with finger agnosia, agraphia and acalculia. Tract analyses indicated disruption of intraparietal and frontoparietal connections.
      fr: Un patient avec atteinte pariétale supérieure gauche avait des difficultés d’orientation droite-gauche associées à une agnosie digitale, une agraphie et une acalculie. Les analyses de faisceaux indiquaient une déconnexion intrapariétale et frontopariétale.
    limitation:
      en: The combined syndrome does not isolate left–right discrimination. Moore reported the same tetrad after right parietal stroke with evidence of reversed cerebral dominance, so fixed left-sided localization is not universal.
      fr: Le syndrome associé n’isole pas la discrimination droite-gauche. Moore rapportait la même tétrade après AVC pariétal droit avec arguments de dominance cérébrale inversée; une localisation gauche fixe n’est donc pas universelle.
    mapping_note:
      en: The left superior parietal parcel marks the main cortical lesion in the disconnection case. White-matter pathways and the precise boundaries of the right-sided comparison case are not mapped.
      fr: La parcelle pariétale supérieure gauche repère la lésion corticale principale du cas de déconnexion. Les voies de substance blanche et les limites précises du cas comparatif droit ne sont pas cartographiées.
    mappings:
      - {region: 'destrieux:left:27', source_name: G_parietal_sup}
    evidence:
      - {reference: ranzini-2023, role: supporting}
      - {reference: moore-1991, role: qualifying}

  - id: aphantasia-occipitotemporal
    deficit: aphantasia
    title: {en: Acquired imagery loss after posterior stroke, fr: Perte acquise d’imagerie après AVC postérieur}
    network: {en: Ventral visual imagery network, fr: Réseau ventral d’imagerie visuelle}
    laterality: bilateral
    finding:
      en: An architect lost visual imagery after bilateral posterior stroke. Comparisons with four other patients identified small selectively damaged areas in left fusiform and right lingual cortex. A later 12-case analysis found heterogeneous lesions connected to a left fusiform imagery node.
      fr: Un architecte perdait l’imagerie visuelle après AVC postérieur bilatéral. Les comparaisons avec quatre autres patients identifiaient de petites zones sélectivement lésées des cortex fusiforme gauche et lingual droit. Une analyse ultérieure de 12 cas trouvait des lésions hétérogènes connectées à un nœud fusiforme gauche d’imagerie.
    limitation:
      en: The architect also had other visual deficits, and case comparisons cannot establish a sufficient lesion. Only five of the 12 lesions directly intersected the imagery node; normative functional connectivity is not evidence of direct fusiform damage in every case.
      fr: L’architecte avait aussi d’autres déficits visuels et les comparaisons de cas n’établissent pas de lésion suffisante. Seules cinq des 12 lésions intersectaient directement le nœud d’imagerie; la connectivité fonctionnelle normative ne prouve pas une atteinte fusiforme directe dans chaque cas.
    mapping_note:
      en: Whole left fusiform and right lingual parcels mark the small selective areas in the architect comparison. They do not reproduce the full infarcts, isolate the imagery node, or map every lesion in the network study.
      fr: Les parcelles fusiforme gauche et linguale droite entières repèrent les petites zones sélectives de la comparaison de l’architecte. Elles ne reproduisent pas les infarctus entiers, n’isolent pas le nœud d’imagerie et ne cartographient pas chaque lésion de l’étude de réseau.
    mappings:
      - {region: 'destrieux:left:21', source_name: G_oc-temp_lat-fusifor}
      - {region: 'destrieux:right:22', source_name: G_oc-temp_med-Lingual}
    evidence:
      - {reference: thorudottir-2020, role: supporting}
      - {reference: kutsche-2026, role: qualifying}

  - id: palinopsia-occipital
    deficit: palinopsia
    title: {en: Persistent images with posterior cortical injury, fr: Images persistantes avec atteinte corticale postérieure}
    network: {en: Posterior visual processing, fr: Traitement visuel postérieur}
    laterality: left
    finding:
      en: A woman with a left inferior occipital and occipitotemporal tumour had recurring afterimages and pure alexia. Earlier CT cases described repetitive images of previously viewed scenes with large occipital lesions.
      fr: Une femme avec tumeur occipitale inférieure et occipitotemporale gauche avait des images rémanentes répétées et une alexie pure. Des cas antérieurs en TDM décrivaient des images répétées de scènes déjà vues avec de larges lésions occipitales.
    limitation:
      en: The lesion cases had variable anatomy and associated symptoms. Hughes reported dose-related palinopsia with trazodone in three patients, so the symptom is not specific to a structural posterior lesion or this side of the brain.
      fr: Les cas lésionnels avaient une anatomie et des symptômes associés variables. Hughes rapportait une palinopsie dose-dépendante sous trazodone chez trois patients; le symptôme n’est donc pas spécifique d’une lésion postérieure structurale ou de ce côté du cerveau.
    mapping_note:
      en: The left inferior occipital parcel marks the anatomically specified tumour case only. It does not delineate the full mass, the adjacent word-recognition territory, or the broad lesions in the older series.
      fr: La parcelle occipitale inférieure gauche repère seulement le cas tumoral anatomiquement précisé. Elle ne délimite ni toute la masse, ni le territoire adjacent de reconnaissance des mots, ni les larges lésions de la série ancienne.
    mappings:
      - {region: 'destrieux:left:2', source_name: G_and_S_occipital_inf}
    evidence:
      - {reference: huang-2016, role: supporting}
      - {reference: michel-1980, role: supporting}
      - {reference: hughes-1990, role: qualifying}

  - id: agnosia-object-recognition
    deficit: agnosia
    title: {en: Visual recognition of objects, fr: Reconnaissance visuelle des objets}
    network: {en: Ventral occipitotemporal object recognition, fr: Reconnaissance des objets occipitotemporale ventrale}
    laterality: bilateral
    finding:
      en: One patient lost visual object and word recognition with a left posterior inferior temporal metastasis. Another had object agnosia with a right lateral fusiform lesion, accompanied by reduced object-related responses beyond the visible lesion and in the opposite hemisphere.
      fr: Une patiente perdait la reconnaissance visuelle des objets et des mots avec une métastase temporale inférieure postérieure gauche. Un autre avait une agnosie des objets avec lésion fusiforme latérale droite, accompagnée de réponses liées aux objets réduites au-delà de la lésion visible et dans l’hémisphère opposé.
    limitation:
      en: Two different case profiles do not establish a single necessary object-recognition site or fixed hemispheric dominance. In the metastasis case symptoms improved with corticosteroids; functional responses and structural lesion location need not coincide.
      fr: Deux profils de cas différents n’établissent ni un site unique nécessaire à la reconnaissance des objets ni une dominance hémisphérique fixe. Dans le cas métastatique les symptômes s’amélioraient sous corticoïdes; les réponses fonctionnelles et la localisation lésionnelle structurale ne coïncident pas nécessairement.
    mapping_note:
      en: Left inferior temporal and right fusiform parcels mark separate reported cases. They exceed the focal lesions and do not imply that bilateral cortical injury is required or that the same fusiform subregions support faces and objects.
      fr: Les parcelles temporale inférieure gauche et fusiforme droite repèrent des cas distincts. Elles dépassent les lésions focales et n’impliquent ni la nécessité d’une atteinte corticale bilatérale ni que les mêmes sous-régions fusiformes traitent les visages et les objets.
