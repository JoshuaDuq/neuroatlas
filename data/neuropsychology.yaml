    domain: {en: Limb ownership, fr: Appartenance corporelle}
    group: attention-executive
    summary:
      en: Delusional denial or misattribution of ownership of a limb. This profile concerns limb disownership after right-hemisphere damage.
      fr: Déni délirant ou attribution erronée de l’appartenance d’un membre. Ce profil concerne la désappropriation corporelle après une atteinte hémisphérique droite.
    aliases:
      en: [limb disownership, body ownership, somatoparaphrenia, delusional misidentification]
      fr: [désappropriation corporelle, appartenance du membre, somatoparaphrénie, identification délirante]

  - id: alien-hand
    name: {en: Alien hand syndrome, fr: Syndrome de la main étrangère}
    domain: {en: Voluntary action control, fr: Contrôle volontaire de l’action}
    group: sensorimotor
    summary:
      en: Apparently purposeful hand actions outside voluntary control. This profile focuses on intermanual conflict after callosal injury.
      fr: Actions de la main apparemment intentionnelles échappant au contrôle volontaire. Ce profil porte sur le conflit intermanuel après une atteinte calleuse.
    aliases:
      en: [alien hand, anarchic hand, intermanual conflict, callosal disconnection]
      fr: [main étrangère, main anarchique, conflit intermanuel, déconnexion calleuse]

  - id: confabulation
    name: {en: Spontaneous confabulation, fr: Confabulation spontanée}
    domain: {en: Memory monitoring, fr: Contrôle des souvenirs}
    group: memory
    summary:
      en: Acting on memories or accounts that do not fit present reality. This profile concerns acquired spontaneous confabulation after anterior limbic injury.
      fr: Actions fondées sur des souvenirs ou des récits incompatibles avec la réalité présente. Ce profil concerne la confabulation spontanée acquise après une atteinte limbique antérieure.
    aliases:
      en: [confabulation, false memories, reality monitoring, temporal context confusion]
      fr: [confabulation, faux souvenirs, contrôle de la réalité, confusion du contexte temporel]

  - id: olfactory-recognition
    name: {en: Olfactory recognition impairment, fr: Trouble de la reconnaissance olfactive}
    domain: {en: Smell recognition, fr: Reconnaissance des odeurs}
    group: perception
    summary:
      en: Difficulty identifying or remembering smells after focal brain surgery. This profile distinguishes recognition from the ability to detect an odour.
      fr: Difficulté à identifier ou à mémoriser les odeurs après une chirurgie cérébrale focale. Ce profil distingue la reconnaissance de la capacité à détecter une odeur.
    aliases:
      en: [olfaction, smell identification, odor identification, odour recognition, smell memory]
      fr: [olfaction, identification des odeurs, reconnaissance des odeurs, mémoire olfactive]

  - id: theory-of-mind
    name: {en: Impaired affective theory of mind, fr: Trouble de la théorie de l’esprit affective}
    domain: {en: Mental-state inference, fr: Inférence des états mentaux}
    group: social-emotional
    summary:
      en: Difficulty inferring other people’s emotional mental states. This profile concerns affective mentalizing after focal prefrontal injury.
      fr: Difficulté à inférer les états mentaux émotionnels d’autrui. Ce profil concerne la mentalisation affective après une atteinte préfrontale focale.
    aliases:
      en: [theory of mind, affective mentalizing, mentalising, social inference, emotional perspective taking]
      fr: [théorie de l’esprit, mentalisation affective, inférence sociale, prise de perspective émotionnelle]

  - id: aprosodia
    name: {en: Expressive aprosodia, fr: Aprosodie expressive}
    domain: {en: Emotional speech expression, fr: Expression émotionnelle de la parole}
    group: language-number
    summary:
      en: Difficulty conveying emotion through tone of voice. This profile documents a persistent expressive impairment after a right medial frontal stroke.
      fr: Difficulté à transmettre une émotion par le ton de la voix. Ce profil documente un trouble expressif persistant après un AVC frontal médial droit.
    aliases:
      en: [aprosodia, affective prosody production, emotional intonation, motor aprosodia, monotone speech]
      fr: [aprosodie, production de prosodie affective, intonation émotionnelle, aprosodie motrice, parole monotone]

  - id: stuttering
    name: {en: Acquired neurogenic stuttering, fr: Bégaiement neurogène acquis}
    domain: {en: Speech fluency, fr: Fluence de la parole}
    group: language-number
    summary:
      en: Speech dysfluency acquired after brain injury. This profile follows post-stroke lesion mapping and distinguishes damaged sites from their functional connections.
      fr: Disfluences de la parole acquises après une lésion cérébrale. Ce profil suit la cartographie lésionnelle après AVC et distingue les sites lésés de leurs connexions fonctionnelles.
    aliases:
      en: [stuttering, stammering, acquired dysfluency, speech disfluency, neurogenic stammering]
      fr: [bégaiement, disfluence acquise, disfluence de la parole, bégaiement neurogène]

  - id: cortical-deafness
    name: {en: Cortical deafness, fr: Surdité corticale}
    domain: {en: Central hearing, fr: Audition centrale}
    group: perception
    summary:
      en: Severe loss of conscious hearing from central auditory injury. This profile concerns bilateral auditory cortical infarcts, with subcortical disconnection as a comparison.
      fr: Perte sévère de l’audition consciente par atteinte auditive centrale. Ce profil concerne des infarctus corticaux auditifs bilatéraux, comparés à une déconnexion sous-corticale.
    aliases:
      en: [cortical deafness, central deafness, cerebral deafness, auditory cortex, Heschl’s gyrus]
      fr: [surdité corticale, surdité centrale, surdité cérébrale, cortex auditif, gyrus de Heschl]

  - id: auditory-agnosia
    name: {en: Nonverbal auditory agnosia, fr: Agnosie auditive non verbale}
    domain: {en: Environmental sound recognition, fr: Reconnaissance des sons de l’environnement}
    group: perception
    summary:
      en: Difficulty recognizing everyday sounds beyond peripheral hearing loss. This profile contrasts group lesion evidence with a case whose speech comprehension recovered.
      fr: Difficulté à reconnaître les sons du quotidien au-delà d’une perte auditive périphérique. Ce profil confronte les données lésionnelles de groupe à un cas dont la compréhension de la parole avait récupéré.
    aliases:
      en: [auditory agnosia, environmental sounds, sound recognition, nonverbal sounds, acoustic agnosia]
      fr: [agnosie auditive, sons de l’environnement, reconnaissance sonore, sons non verbaux, agnosie acoustique]

  - id: auditory-short-term-memory
    name: {en: Auditory short-term memory impairment, fr: Trouble de la mémoire auditive à court terme}
    domain: {en: Short-term retention, fr: Rétention à court terme}
    group: memory
    summary:
      en: Reduced capacity to hold heard material briefly in mind. This profile examines digit span after stroke and its relationship to spoken sentence comprehension.
      fr: Capacité réduite à maintenir brièvement en mémoire des informations entendues. Ce profil examine l’empan de chiffres après AVC et son lien avec la compréhension des phrases entendues.
    aliases:
      en: [auditory memory, verbal short-term memory, digit span, phonological memory, immediate recall]
      fr: [mémoire auditive, mémoire verbale à court terme, empan de chiffres, mémoire phonologique, rappel immédiat]

  - id: autotopagnosia
    name: {en: Autotopagnosia, fr: Autotopoagnosie}
    domain: {en: Body-part localization, fr: Localisation des parties du corps}
    group: perception
    summary:
      en: Difficulty locating body parts despite being able to name or use them. This profile concerns acquired parietal lesions and the spatial representation of the body.
      fr: Difficulté à localiser les parties du corps malgré une capacité préservée à les nommer ou à les utiliser. Ce profil concerne les lésions pariétales acquises et la représentation spatiale du corps.
    aliases:
      en: [autotopagnosia, body part localization, body structural description, body schema, body representation]
      fr: [autotopagnosie, autotopoagnosie, localisation des parties du corps, description structurale du corps, schéma corporel]

  - id: finger-agnosia
    name: {en: Finger agnosia, fr: Agnosie digitale}
    domain: {en: Finger identification, fr: Identification des doigts}
    group: perception
    summary:
      en: Difficulty identifying fingers beyond elementary sensory loss. This profile distinguishes selective finger-identification findings from finger agnosia within Gerstmann’s syndrome.
      fr: Difficulté à identifier les doigts au-delà d’une perte sensitive élémentaire. Ce profil distingue les troubles sélectifs d’identification digitale de l’agnosie digitale dans le syndrome de Gerstmann.
    aliases:
      en: [finger agnosia, finger identification, finger recognition, finger gnosis, Gerstmann syndrome]
      fr: [agnosie digitale, identification des doigts, reconnaissance des doigts, gnosies digitales, syndrome de Gerstmann]

