  - id: coma-tegmentum
    deficit: coma
    title: {en: Pontine and midbrain tegmentum, fr: Tegmentum pontique et mésencéphalique}
    network: {en: Brainstem arousal nuclei, fr: Noyaux d’éveil du tronc cérébral}
    laterality: bilateral
    finding:
      en: Of 47 brainstem strokes, the nine with coma had mostly bilateral tegmental lesions in the pons alone (4) or upper pons and midbrain (5). Their maximum overlap covered the rostral raphe complex, locus coeruleus, laterodorsal tegmental nucleus, nucleus pontis oralis and parabrachial nucleus.
      fr: Sur 47 AVC du tronc cérébral, les neuf avec coma avaient des lésions tegmentales le plus souvent bilatérales, dans le pont seul (4) ou le pont supérieur et le mésencéphale (5). Leur chevauchement maximal couvrait le complexe du raphé rostral, le locus coeruleus, le noyau tegmental latérodorsal, le noyau pontis oralis et le noyau parabrachial.
