      en: The right orbital parcel marks one reported surgical site. It neither defines a memory-specific subregion nor represents the temporal excisions.
      fr: La parcelle orbitale droite représente un des sites chirurgicaux rapportés. Elle ne délimite pas une sous-région propre à la mémoire et ne représente pas les exérèses temporales.
