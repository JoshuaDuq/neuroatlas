    network: {en: Right medial temporal and distributed navigation network, fr: Réseau temporal médial droit et réseau distribué de navigation}
    laterality: right
    finding:
      en: Seven patients lost their way in familiar environments despite preserved general spatial orientation. Descriptive lesion overlap centred on right posterior parahippocampal cortex, with lingual, retrosplenial and fusiform involvement. A separate analysis of 65 published lesions supported a distributed navigation network.
      fr: Sept patients se perdaient dans des environnements familiers malgré une orientation spatiale générale préservée. Le chevauchement lésionnel descriptif était centré sur le cortex parahippocampique postérieur droit, avec atteintes linguale, rétrospléniale et fusiforme. Une analyse distincte de 65 lésions publiées soutenait un réseau distribué de navigation.
    limitation:
      en: The seven-patient study was retrospective and did not statistically compare direct-lesion overlap with its seven controls. Normative network connections, including bilateral sites, do not show that each connected region was injured or that one site alone explains disorientation.
      fr: L’étude de sept patients était rétrospective et ne comparait pas statistiquement le chevauchement des lésions directes à celui des sept témoins. Les connexions normatives du réseau, notamment bilatérales, ne montrent pas que chaque région connectée était lésée ni qu’un seul site explique la désorientation.
