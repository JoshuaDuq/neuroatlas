  - id: aprosodia-medial-frontal
    deficit: aprosodia
    title: {en: Emotional intonation after medial frontal stroke, fr: Intonation émotionnelle après AVC frontal médial}
    network: {en: Right medial frontal affective speech, fr: Parole affective frontale médiale droite}
    laterality: right
    finding:
      en: A right medial frontal infarct left persistent difficulty expressing emotional intonation despite preserved propositional speech and syntactic prosody. Prosodic comprehension and repetition were less severely impaired.
      fr: Un infarctus frontal médial droit entraînait une difficulté persistante à exprimer l’intonation émotionnelle malgré une parole propositionnelle et une prosodie syntaxique préservées. La compréhension et la répétition prosodiques étaient moins altérées.
    limitation:
      en: One chronic case demonstrates a possible lesion association. It cannot establish prevalence, specificity or the principal site of expressive aprosodia.
      fr: Un cas chronique démontre une association lésionnelle possible. Il n’établit ni la prévalence, ni la spécificité, ni le site principal de l’aprosodie expressive.
    mapping_note:
      en: The whole superior frontal gyrus is a broad landmark extending onto the medial surface. It does not isolate the medial infarct or a prosody-specific area.
      fr: Le gyrus frontal supérieur entier est un repère large s’étendant à la face médiale. Il n’isole ni l’infarctus médial ni une aire spécifique de la prosodie.
