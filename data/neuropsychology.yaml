  - id: aphasia-semantic
    deficit: aphasia
    title: {en: Semantic errors in naming, fr: Erreurs sémantiques en dénomination}
    network: {en: Left anterior temporal lexical–semantic system, fr: Système lexico-sémantique temporal antérieur gauche}
    laterality: left
    finding:
      en: In 64 people with post-stroke aphasia, semantic naming errors (horse for goat) were most strongly predicted by lesions of the left anterior to mid middle temporal gyrus, an effect that survived controlling for pre-lexical conceptual deficits.
      fr: Chez 64 personnes avec aphasie post-AVC, les erreurs sémantiques de dénomination (cheval pour chèvre) étaient le mieux prédites par des lésions du gyrus temporal moyen antérieur à moyen gauche, effet persistant après contrôle des déficits conceptuels prélexicaux.
    limitation:
      en: The authors note this casts doubt on the classical linkage of semantic errors to Wernicke’s area. Stroke rarely damages the temporal pole itself, so its contribution is under-sampled.
      fr: Les auteurs soulignent que ce résultat met en doute le lien classique entre erreurs sémantiques et aire de Wernicke. L’AVC touche rarement le pôle temporal lui-même, dont la contribution est donc sous-échantillonnée.
    mapping_note:
      en: The whole middle temporal parcel is shown; the finding concerns its anterior and middle portions, unlike the posterior focus of the comprehension and naming claims above.
      fr: La parcelle temporale moyenne entière est affichée; le résultat concerne ses portions antérieure et moyenne, contrairement au foyer postérieur des associations de compréhension et de dénomination ci-dessus.
    mappings:
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: schwartz-2009, role: supporting}

  - id: aphasia-phonological
    deficit: aphasia
    title: {en: Phonological errors in naming, fr: Erreurs phonologiques en dénomination}
    network: {en: Left dorsal stream sensorimotor cortex, fr: Cortex sensorimoteur de la voie dorsale gauche}
    laterality: left
    finding:
      en: Across 1,718 phonological errors from 106 people with aphasia, the critical voxels lay in premotor cortex, the pre- and postcentral gyri and the supramarginal gyrus, with minimal extension into posterior temporal auditory cortex. Phonological and semantic error maps did not overlap.
      fr: Sur 1 718 erreurs phonologiques de 106 personnes aphasiques, les voxels critiques se situaient dans le cortex prémoteur, les gyrus pré- et postcentral et le gyrus supramarginal, avec une extension minimale vers le cortex auditif temporal postérieur. Les cartes des erreurs phonologiques et sémantiques ne se chevauchaient pas.
    limitation:
      en: Error rates in picture naming only. The result challenges the view that phonological retrieval depends on posterior auditory traces, a claim still under debate.
      fr: Taux d’erreurs en dénomination d’images uniquement. Le résultat remet en question l’idée que la récupération phonologique dépend de traces auditives postérieures, ce qui reste débattu.
    mapping_note:
      en: Whole precentral, postcentral and supramarginal parcels are shown. The premotor cluster has no parcel of its own here.
      fr: Les parcelles précentrale, postcentrale et supramarginale entières sont affichées. L’amas prémoteur n’a pas de parcelle propre ici.
    mappings:
      - {region: 'destrieux:left:29', source_name: G_precentral}
      - {region: 'destrieux:left:28', source_name: G_postcentral}
      - {region: 'destrieux:left:26', source_name: G_pariet_inf-Supramar}
    evidence:
      - {reference: schwartz-2012, role: supporting}

  - id: neglect-subcortical
    deficit: neglect
    title: {en: Neglect after basal ganglia and thalamic lesions, fr: Négligence après lésions des noyaux gris centraux et du thalamus}
    network: {en: Right putamen–caudate–pulvinar network, fr: Réseau putamen–noyau caudé–pulvinar droit}
    laterality: right
    finding:
      en: Comparing right subcortical lesions in patients with and without neglect, the putamen, the pulvinar and, to a smaller degree, the caudate nucleus were the structures typically associated with spatial neglect. All connect directly to the superior temporal gyrus.
      fr: En comparant des lésions sous-corticales droites chez des patients avec et sans négligence, le putamen, le pulvinar et, dans une moindre mesure, le noyau caudé étaient les structures typiquement associées à la négligence spatiale. Toutes se connectent directement au gyrus temporal supérieur.
    limitation:
      en: The abstract gives no patient count. Subcortical neglect may partly reflect cortical hypoperfusion or disconnection rather than the nuclei themselves.
      fr: Le résumé n’indique pas l’effectif. La négligence sous-corticale peut refléter en partie une hypoperfusion ou une déconnexion corticale plutôt que les noyaux eux-mêmes.
    mapping_note:
      en: Whole right putamen and caudate come from the reference segmentation; the pulvinar comes from the histological reference.
      fr: Le putamen et le noyau caudé droits entiers proviennent de la segmentation de référence; le pulvinar provient de la référence histologique.
