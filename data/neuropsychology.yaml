  - id: emotion-prosody
    deficit: emotion-recognition
    title: {en: Recognizing emotion in the voice, fr: Reconnaître l’émotion dans la voix}
    network: {en: Right frontoparietal operculum and frontal poles, fr: Opercule fronto-pariétal droit et pôles frontaux}
    laterality: bilateral
    finding:
      en: Lesion overlaps in 66 participants showed that recognizing emotions from prosody draws on the right frontoparietal operculum, the bilateral frontal pole and the left frontal operculum. The right frontoparietal cortex served both prosody and facial expressions.
      fr: Les chevauchements lésionnels chez 66 participants montraient que la reconnaissance des émotions par la prosodie repose sur l’opercule fronto-pariétal droit, le pôle frontal bilatéral et l’opercule frontal gauche. Le cortex fronto-pariétal droit servait à la fois la prosodie et les expressions faciales.
    limitation:
      en: Lesion overlaps were mapped as a function of performance. Regions in the left and right temporal lobes also contributed disproportionately to recognizing emotion from faces or prosody, respectively, and are not mapped here.
      fr: Les chevauchements lésionnels étaient cartographiés en fonction de la performance. Des régions des lobes temporaux gauche et droit contribuaient aussi de façon disproportionnée à la reconnaissance des émotions par le visage ou par la prosodie, respectivement, et ne sont pas cartographiées ici.
    mapping_note:
      en: The subcentral and opercular parcels approximate the frontoparietal operculum on the right; the transverse frontopolar parcels stand for the frontal poles. Borders are anatomical, not the study’s.
      fr: Les parcelles subcentrale et operculaire représentent approximativement l’opercule fronto-pariétal à droite; les parcelles frontopolaires transverses tiennent lieu de pôles frontaux. Les limites sont anatomiques, non celles de l’étude.
