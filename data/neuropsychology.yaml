  - id: hemianopia-occipital
    deficit: hemianopia
    title: {en: Visual field loss from retrochiasmal lesions, fr: Perte du champ visuel par lésion rétrochiasmatique}
    network: {en: Retrochiasmal visual pathway and occipital cortex, fr: Voie visuelle rétrochiasmatique et cortex occipital}
    laterality: bilateral
    finding:
      en: In 904 homonymous hemianopias, lesions were most often in the occipital lobes (45%) and the optic radiations (32%). Stroke accounted for about 70% of cases, followed by trauma and tumour.
      fr: Sur 904 hémianopsies homonymes, les lésions siégeaient le plus souvent dans les lobes occipitaux (45 %) et les radiations optiques (32 %). L’AVC expliquait environ 70 % des cas, suivi des traumatismes et des tumeurs.
    limitation:
      en: A retrospective neuro-ophthalmology series. The authors note that the shape of a field defect does not reliably indicate a specific lesion site along the pathway.
      fr: Série rétrospective de neuro-ophtalmologie. Les auteurs soulignent que la forme du déficit campimétrique n’indique pas de façon fiable un site lésionnel précis le long de la voie.
    mapping_note:
      en: The calcarine sulcus and occipital pole mark primary visual cortex on each side; a lesion there affects the opposite visual field. The optic radiations have no parcel.
      fr: Le sillon calcarin et le pôle occipital repèrent le cortex visuel primaire de chaque côté; une lésion y affecte le champ visuel opposé. Les radiations optiques n’ont pas de parcelle.
