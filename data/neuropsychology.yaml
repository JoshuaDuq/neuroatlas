  - id: achromatopsia-ventral
    deficit: achromatopsia
    title: {en: Colour discrimination after ventral occipital damage, fr: Discrimination des couleurs après atteinte occipitale ventrale}
    network: {en: Ventral occipital colour pathway, fr: Voie occipitale ventrale des couleurs}
    laterality: bilateral
    finding:
      en: In a meta-analysis of 92 published case reports, lesion overlap analyses revealed a relatively small region of high overlap in ventral occipital cortex, near areas that neuroimaging links to colour perception. Nearly all cases also showed some loss of spatial vision.
      fr: Dans une méta-analyse de 92 cas publiés, les analyses de chevauchement lésionnel révélaient une région relativement petite de fort chevauchement dans le cortex occipital ventral, près des aires que la neuro-imagerie associe à la perception des couleurs. Presque tous les cas montraient aussi une perte de vision spatiale.
    limitation:
      en: Heterogeneous case reports of varying quality; per the published erratum, two small locations within the region were lesioned in 8 of the 11 achromatopsia cases. The deficit was often incomplete and never restricted to colour, so the site is one stage among many colour-sensitive areas.
      fr: Cas publiés hétérogènes et de qualité variable; selon l’erratum publié, deux petites zones de cette région étaient lésées chez 8 des 11 cas d’achromatopsie. Le déficit était souvent incomplet et jamais limité à la couleur; le site n’est donc qu’une étape parmi plusieurs aires sensibles à la couleur.
    mapping_note:
      en: Lingual and fusiform parcels frame the ventral occipital overlap on each side. Unilateral lesions produce hemiachromatopsia in the opposite field.
      fr: Les parcelles linguale et fusiforme encadrent le chevauchement occipital ventral de chaque côté. Les lésions unilatérales produisent une hémiachromatopsie du champ opposé.
