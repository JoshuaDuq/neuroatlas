  - id: acalculia-approximation
    deficit: acalculia
    title: {en: Approximate quantity and intraparietal injury, fr: Quantité approximative et atteinte intrapariétale}
    network: {en: Left intraparietal quantity processing, fr: Traitement intrapariétal gauche des quantités}
    laterality: left
    finding:
      en: In 27 pooled parietal-lesion cases, approximation impairment was more frequent with intraparietal involvement. Only four of 25 assessed cases had approximation deficits, all in the intraparietal group. Calculation, number ordering/cardinality and number transcoding did not show the same corrected association.
      fr: Dans 27 cas groupés avec lésion pariétale, le trouble d’approximation était plus fréquent avec atteinte intrapariétale. Seuls quatre cas sur 25 évalués avaient un déficit d’approximation, tous dans le groupe intrapariétal. Le calcul, l’ordinalité/cardinalité et le transcodage numérique ne montraient pas la même association après correction.
    limitation:
      en: Published cases and heterogeneous testing create selection bias. The result depends on four approximation-impaired cases and cannot establish hemispheric dominance from a left-only analysis. Lesions were represented by inferred spheres; the subsequent spatial meta-analysis was exploratory.
      fr: Les cas publiés et les tests hétérogènes créent un biais de sélection. Le résultat dépend de quatre cas avec trouble d’approximation et n’établit pas de dominance hémisphérique à partir d’une analyse uniquement gauche. Les lésions étaient représentées par des sphères inférées; la méta-analyse spatiale ultérieure était exploratoire.
    mapping_note:
      en: The intraparietal/transverse parietal sulcus parcel is a broad anatomical landmark. It is not the study’s functional intraparietal mask, an individual lesion sphere or a universal calculation centre.
      fr: La parcelle des sillons intrapariétal et pariétal transverse est un repère anatomique large. Ce n’est ni le masque intrapariétal fonctionnel de l’étude, ni une sphère lésionnelle individuelle, ni un centre universel du calcul.
    mappings:
      - {region: 'destrieux:left:57', source_name: 'S_intrapariet&P_trans'}
    evidence:
      - {reference: duricy-2025, role: supporting}

  - id: agraphia-orthographic-memory
    deficit: agraphia
    title: {en: Maintaining letter sequences, fr: Maintien des séquences de lettres}
    network: {en: Left parietal orthographic working memory, fr: Mémoire de travail orthographique pariétale gauche}
    laterality: left
    finding:
      en: Orthographic working-memory impairment was associated with left parietal damage centred on the intraparietal sulcus.
      fr: L’atteinte de la mémoire de travail orthographique était associée aux lésions pariétales gauches centrées sur le sillon intrapariétal.
    limitation:
      en: Selected spelling profiles. Long-term orthographic-memory deficits instead centred on left inferior frontal or ventral temporal regions; this mapping does not cover those or motor handwriting disorders.
      fr: Profils orthographiques sélectionnés. Les déficits orthographiques à long terme concernaient plutôt les régions frontale inférieure ou temporale ventrale gauches; cette carte ne couvre ni ces profils ni les troubles moteurs de l’écriture.
    mapping_note:
      en: The intraparietal/transverse parietal sulcus parcel is a coarse landmark within the broader posterior parietal/occipital cluster. It does not reproduce the statistical map or delimit a dedicated spelling store.
      fr: La parcelle des sillons intrapariétal et pariétal transverse est un repère approximatif dans l’amas pariétal/occipital postérieur plus large. Elle ne reproduit pas la carte statistique et ne délimite pas de stockage dédié à l’orthographe.
    mappings:
      - {region: 'destrieux:left:57', source_name: 'S_intrapariet&P_trans'}
    evidence:
      - {reference: rapp-2016, role: supporting}

  - id: agraphia-orthographic-long-term
    deficit: agraphia
    title: {en: Retrieving learned word spellings, fr: Récupération des formes orthographiques apprises}
    network: {en: Left posterior frontal and ventral temporal spelling systems, fr: Systèmes orthographiques frontaux postérieurs et temporaux ventraux gauches}
    laterality: left
    finding:
      en: Among 17 patients with selective orthographic long-term-memory deficits, ten had posterior frontal lesions and seven ventral temporal lesions. Significant clusters included inferior frontal opercular and central opercular regions, and inferior temporal/fusiform cortex, distinct from the working-memory pattern.
      fr: Parmi 17 patients avec déficit sélectif de mémoire orthographique à long terme, dix avaient des lésions frontales postérieures et sept temporales ventrales. Les amas significatifs comprenaient les régions frontale inférieure operculaire et operculaire centrale, ainsi que le cortex temporal inférieur/fusiforme, distincts du profil de mémoire de travail.
    limitation:
      en: This is the same selected 33-patient cohort as the working-memory finding, not an independent replication. Behavioural tests differed across languages and centres. These spelling-process associations do not localize all motor handwriting disorders.
      fr: Il s’agit de la même cohorte sélectionnée de 33 patients que pour le constat de mémoire de travail, pas d’une réplication indépendante. Les tests comportementaux différaient entre langues et centres. Ces associations de processus orthographiques ne localisent pas tous les troubles moteurs de l’écriture.
    mapping_note:
      en: Opercular inferior frontal, inferior temporal and fusiform parcels mark selected reported regions, omitting the separate central opercular cluster. Frontal and temporal injury occurred in different subgroups; the display does not require both sites to be damaged.
      fr: Les parcelles frontale inférieure operculaire, temporale inférieure et fusiforme repèrent des régions rapportées sélectionnées, en omettant l’amas operculaire central distinct. Les atteintes frontales et temporales concernaient des sous-groupes différents; l’affichage n’exige pas que les deux sites soient lésés.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
      - {region: 'destrieux:left:37', source_name: G_temporal_inf}
      - {region: 'destrieux:left:21', source_name: G_oc-temp_lat-fusifor}
    evidence:
      - {reference: rapp-2016, role: supporting}

  - id: amusia-temporal
    deficit: amusia
    title: {en: Temporal components of music perception, fr: Composantes temporales de la perception musicale}
    network: {en: Right temporal–insular–striatal network, fr: Réseau temporal–insulaire–striatal droit}
    laterality: right
    finding:
      en: Impaired pitch and rhythm perception was associated with right superior temporal, Heschl’s, insular and striatal lesions, with overlap between the pitch and rhythm maps.
      fr: Les déficits de perception de la hauteur et du rythme étaient associés aux lésions temporales supérieures, de Heschl, insulaires et striatales droites, avec chevauchement des cartes.
    limitation:
      en: Stroke evidence using selected music-perception tests; it does not cover congenital amusia or all musical skills.
      fr: Données post-AVC fondées sur certains tests perceptifs; elles ne couvrent ni l’amusie congénitale ni toutes les capacités musicales.
    mapping_note:
      en: These two temporal parcels show cortical landmarks only. They do not delineate auditory functional fields or display the study’s insular and striatal components.
      fr: Ces deux parcelles temporales montrent uniquement des repères corticaux. Elles ne délimitent pas les champs auditifs fonctionnels et n’affichent pas les composantes insulaires et striatales de l’étude.
