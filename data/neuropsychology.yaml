    laterality: bilateral
    finding:
      en: Two vascular parietal cases could name and use body parts but failed to locate them on themselves or a mannequin. The language-dominant hemisphere was right-sided in one case; Ogden described a comparable dissociation after a left parietal metastasis.
      fr: Deux cas pariétaux vasculaires pouvaient nommer et utiliser les parties du corps mais ne les localisaient pas sur eux-mêmes ou un mannequin. L’hémisphère dominant pour le langage était droit dans un cas; Ogden décrivait une dissociation comparable après une métastase pariétale gauche.
    limitation:
      en: Small case evidence does not establish a universal site or fixed left-hemisphere dominance. Preserved naming and object-part pointing help distinguish this disorder from language or general part–whole difficulties.
      fr: Ces quelques cas n’établissent ni un site universel ni une dominance gauche fixe. La dénomination et la désignation des parties d’objets préservées aident à distinguer ce trouble de difficultés langagières ou générales de traitement des parties et du tout.
    mapping_note:
      en: The abstracts identify parietal cortex without parcel-level boundaries, so no specific atlas region is selected. Bilateral here records cases on either side, not a requirement for bilateral lesions.
      fr: Les résumés identifient le cortex pariétal sans limites à l’échelle des parcelles; aucune région précise de l’atlas n’est donc sélectionnée. Bilatéral indique ici des cas de chaque côté, pas une nécessité de lésions bilatérales.
