  - id: lateropulsion-thalamus
    deficit: lateropulsion
    title: {en: Perceived body orientation to gravity, fr: Perception de l’orientation du corps par rapport à la gravité}
    network: {en: Posterolateral thalamic graviceptive relay, fr: Relais graviceptif thalamique postérolatéral}
    laterality: bilateral
    finding:
      en: In 23 patients with severe contraversive pushing, 12 with infarcts and 11 with haemorrhages, lesions overlapped on the posterolateral thalamus, implicating its ventral posterior and lateral posterior nuclei in sensing body orientation relative to gravity.
      fr: Chez 23 patients avec poussée contraversive sévère, 12 avec infarctus et 11 avec hémorragie, les lésions se chevauchaient sur le thalamus postérolatéral, impliquant ses noyaux ventral postérieur et latéral postérieur dans la perception de l’orientation du corps par rapport à la gravité.
    limitation:
      en: Overlap plots were compared descriptively with those of 23 matched non-pushers, and the left-hemisphere overlap, in only eight patients, was a tendency. Johannsen et al. later found pushing after cortical lesions sparing the thalamus, centred on the insula and postcentral gyrus.
      fr: Les cartes de chevauchement étaient comparées de façon descriptive à celles de 23 patients appariés sans poussée, et le chevauchement gauche, chez huit patients seulement, n’était qu’une tendance. Johannsen et al. ont ensuite observé une poussée après des lésions corticales épargnant le thalamus, centrées sur l’insula et le gyrus postcentral.
    mapping_note:
      en: The ventral posterolateral and lateral posterior nuclei are shown from the histological reference on both sides. Pushing occurs after lesions of either hemisphere.
      fr: Les noyaux ventral postérolatéral et latéral postérieur proviennent de la référence histologique des deux côtés. La poussée survient après des lésions de l’un ou l’autre hémisphère.
