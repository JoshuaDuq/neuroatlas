  - id: ataxia-cortex
    deficit: ataxia
    title: {en: Somatotopy of the superior cerebellar cortex, fr: Somatotopie du cortex cérébelleux supérieur}
    network: {en: Anterior and superior cerebellar lobules, fr: Lobules cérébelleux antérieurs et supérieurs}
    laterality: bilateral
    finding:
      en: Cortical correlations were weaker and confined to the superior cerebellum. Upper limb ataxia followed lobules IV–VI, lower limb lobules III and VI, dysarthria paravermal and hemispheral lobules V–VI, and posture and gait vermal lobules II–IV.
      fr: Les corrélations corticales étaient plus faibles et limitées au cervelet supérieur. L’ataxie du membre supérieur suivait les lobules IV–VI, celle du membre inférieur les lobules III et VI, la dysarthrie les lobules paravermiens et hémisphériques V–VI, et la posture et la marche les lobules vermiens II–IV.
    limitation:
      en: Chronic lesions showed far fewer cortical correlations, consistent with compensation. CerebNet’s lobules are drawn whole, so the somatotopy within them is not.
      fr: Les lésions chroniques montraient beaucoup moins de corrélations corticales, ce qui suggère une compensation. Les lobules CerebNet sont affichés entiers, sans la somatotopie qu’ils contiennent.
    mapping_note:
      en: CerebNet lobules I–VI on each side and vermis VI mark the superior cerebellum. Lobules I–V include their vermis, and the paravermal zone is not delineated.
      fr: Les lobules CerebNet I–VI de chaque côté et le vermis VI repèrent le cervelet supérieur. Les lobules I–V incluent leur vermis, et la zone paravermienne n’est pas délimitée.
