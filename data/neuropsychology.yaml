revised: '2026-09-22'

deficits:
  - id: aphasia
    name: {en: Aphasia, fr: Aphasie}
    domain: {en: Language, fr: Langage}
    summary:
      en: Acquired language difficulties. This profile starts with evidence about understanding words and sentences.
      fr: Difficultés acquises du langage. Ce profil présente d’abord les données sur la compréhension des mots et des phrases.
    aliases:
      en: [language comprehension, understanding speech, word comprehension, sentence comprehension]
      fr: [compréhension du langage, compréhension orale, compréhension des mots, compréhension des phrases]

  - id: amnesia
    name: {en: Amnesia, fr: Amnésie}
    domain: {en: Memory, fr: Mémoire}
    summary:
      en: Difficulty learning or recalling information. The initial evidence concerns acquired anterograde memory impairment.
      fr: Difficulté à apprendre ou à rappeler des informations. Les premières données concernent l’amnésie antérograde acquise.
    aliases:
      en: [memory loss, forgetfulness, anterograde amnesia, learning, hippocampus]
      fr: [perte de mémoire, oubli, amnésie antérograde, apprentissage, hippocampe]

  - id: neglect
    name: {en: Hemispatial neglect, fr: Négligence spatiale}
    domain: {en: Spatial attention, fr: Attention spatiale}
    summary:
      en: Reduced attention or response to one side of space. Perceptual and exploratory components can have different anatomical associations.
      fr: Diminution de l’attention ou des réponses à un côté de l’espace. Les composantes perceptives et exploratoires peuvent avoir des associations anatomiques différentes.
    aliases:
      en: [neglect, inattention, unilateral neglect, visuospatial, visual exploration]
      fr: [héminégligence, négligence unilatérale, inattention, visuospatial, exploration visuelle]

  - id: apraxia
    name: {en: Limb apraxia, fr: Apraxie gestuelle}
    domain: {en: Praxis, fr: Praxies}
    summary:
      en: Difficulty performing learned or imitated gestures beyond primary weakness. This profile examines meaningless hand and finger imitation.
      fr: Difficulté à réaliser des gestes appris ou imités au-delà d’une faiblesse motrice primaire. Ce profil examine l’imitation de postures manuelles et digitales sans signification.
    aliases:
      en: [apraxia, gesture imitation, hand postures, finger postures, ideomotor]
      fr: [apraxie, imitation de gestes, postures de la main, postures des doigts, idéomotrice]

  - id: agnosia
    name: {en: Visual agnosia, fr: Agnosie visuelle}
    domain: {en: Visual recognition, fr: Reconnaissance visuelle}
    summary:
      en: Difficulty recognizing visual stimuli. The initial profile covers facial configuration processing in acquired prosopagnosia.
      fr: Difficulté à reconnaître des stimuli visuels. Le profil initial porte sur le traitement de la configuration faciale dans la prosopagnosie acquise.
    aliases:
      en: [agnosia, prosopagnosia, face blindness, face recognition, facial configuration]
      fr: [agnosie, prosopagnosie, reconnaissance des visages, configuration faciale]

  - id: executive
    name: {en: Executive dysfunction, fr: Dysfonction exécutive}
    domain: {en: Cognitive control, fr: Contrôle cognitif}
    summary:
      en: Difficulties regulating goal-directed behavior. This profile focuses on inhibition, conflict monitoring, and switching.
      fr: Difficultés à réguler les comportements orientés vers un but. Ce profil porte sur l’inhibition, le suivi des conflits et la flexibilité cognitive.
    aliases:
      en: [dysexecutive, inhibition, set shifting, cognitive flexibility, switching, executive function]
      fr: [dysexécutif, inhibition, flexibilité cognitive, alternance, fonctions exécutives]

  - id: hemianopia
    name: {en: Homonymous hemianopia, fr: Hémianopsie homonyme}
    domain: {en: Vision, fr: Vision}
    summary:
      en: Loss of the same side of the visual field in both eyes after damage behind the optic chiasm. This profile reports where such lesions were found in a large clinical series.
      fr: Perte du même côté du champ visuel dans les deux yeux après une lésion située derrière le chiasma optique. Ce profil présente la localisation des lésions dans une grande série clinique.
    aliases:
      en: [visual field loss, hemianopia, quadrantanopia, visual field defect, occipital, cortical blindness]
      fr: [perte du champ visuel, hémianopsie, quadranopsie, déficit du champ visuel, occipital, cécité corticale]

  - id: ataxia
    name: {en: Cerebellar ataxia, fr: Ataxie cérébelleuse}
    domain: {en: Motor coordination, fr: Coordination motrice}
    summary:
      en: Incoordination of limb movement, gait, posture or speech after cerebellar injury. This profile draws on voxel-based mapping of focal cerebellar lesions.
      fr: Incoordination des mouvements des membres, de la marche, de la posture ou de la parole après une atteinte cérébelleuse. Ce profil s’appuie sur la cartographie voxel par voxel de lésions cérébelleuses focales.
    aliases:
      en: [ataxia, dysmetria, incoordination, gait ataxia, cerebellum, dysarthria]
      fr: [ataxie, dysmétrie, incoordination, ataxie de la marche, cervelet, dysarthrie]

  - id: speech-apraxia
    name: {en: Apraxia of speech, fr: Apraxie de la parole}
    domain: {en: Speech motor planning, fr: Planification motrice de la parole}
    summary:
      en: Impaired planning and coordination of articulatory movements with intact perception of speech sounds. Two lesion studies disagree on its critical site.
      fr: Altération de la planification et de la coordination des mouvements articulatoires avec perception préservée des sons de la parole. Deux études lésionnelles divergent sur son site critique.
    aliases:
      en: [speech apraxia, articulation, motor speech, insula, Broca’s area, speech planning]
      fr: [apraxie verbale, articulation, parole motrice, insula, aire de Broca, anarthrie]

  - id: emotion-recognition
    name: {en: Impaired emotion recognition, fr: Trouble de la reconnaissance des émotions}
    domain: {en: Social cognition, fr: Cognition sociale}
    summary:
      en: Difficulty recognizing emotions, especially fear, in facial expressions. This profile follows bilateral amygdala damage.
      fr: Difficulté à reconnaître les émotions, surtout la peur, dans les expressions faciales. Ce profil concerne les atteintes bilatérales de l’amygdale.
    aliases:
      en: [fear recognition, facial expressions, amygdala, emotion, social cognition]
      fr: [reconnaissance de la peur, expressions faciales, amygdale, émotion, cognition sociale]

  - id: optic-ataxia
    name: {en: Optic ataxia, fr: Ataxie optique}
    domain: {en: Visuomotor control, fr: Contrôle visuomoteur}
    summary:
      en: Misreaching toward visual targets despite adequate vision and limb strength. This profile re-examines the classic superior parietal localization.
      fr: Erreurs d’atteinte vers des cibles visuelles malgré une vision et une force des membres adéquates. Ce profil réexamine la localisation pariétale supérieure classique.
    aliases:
      en: [misreaching, visually guided reaching, dorsal stream, parietal, Bálint]
      fr: [erreurs d’atteinte, atteinte visuellement guidée, voie dorsale, pariétal, Bálint]

  - id: somatosensory
    name: {en: Somatosensory loss, fr: Déficit somatosensoriel}
    domain: {en: Somatic sensation, fr: Sensibilité somatique}
    summary:
      en: Reduced touch, pressure, pain or position sense in the arm and hand after stroke. This profile maps acute lesions to sensory deficits of the upper limb.
      fr: Diminution du toucher, de la pression, de la douleur ou du sens de la position dans le bras et la main après un AVC. Ce profil relie des lésions aiguës aux déficits sensitifs du membre supérieur.
    aliases:
      en: [hypoesthesia, numbness, touch, proprioception, sensory loss, parietal operculum]
      fr: [hypoesthésie, engourdissement, toucher, proprioception, perte sensitive, opercule pariétal]

  - id: alexia
    name: {en: Pure alexia, fr: Alexie pure}
    domain: {en: Reading, fr: Lecture}
    summary:
      en: Acquired loss of fluent visual word recognition with other visual recognition and language preserved. This profile rests on a documented surgical lesion.
      fr: Perte acquise de la reconnaissance visuelle fluente des mots, avec préservation des autres reconnaissances visuelles et du langage. Ce profil repose sur une lésion chirurgicale documentée.
    aliases:
      en: [alexia, reading, visual word form area, letter-by-letter reading, acquired dyslexia]
      fr: [alexie, lecture, aire de la forme visuelle des mots, lecture lettre à lettre, dyslexie acquise]

  - id: decision-making
    name: {en: Impaired decision-making, fr: Trouble de la prise de décision}
    domain: {en: Valuation and choice, fr: Valeur et choix}
    summary:
      en: Disadvantageous real-life choices despite preserved intellect. This profile follows ventromedial prefrontal damage.
      fr: Choix désavantageux dans la vie réelle malgré un intellect préservé. Ce profil concerne les atteintes préfrontales ventromédianes.
    aliases:
      en: [Iowa gambling task, ventromedial prefrontal, orbitofrontal, risk, reward, impulsivity]
      fr: [tâche de jeu de l’Iowa, préfrontal ventromédian, orbitofrontal, risque, récompense, impulsivité]

  - id: anosognosia
    name: {en: Anosognosia for hemiplegia, fr: Anosognosie de l’hémiplégie}
    domain: {en: Body awareness, fr: Conscience du corps}
    summary:
      en: Unawareness or denial of a paralysed limb after stroke. This profile follows lesion mapping in the right hemisphere.
      fr: Méconnaissance ou déni d’un membre paralysé après un AVC. Ce profil s’appuie sur une cartographie lésionnelle de l’hémisphère droit.
    aliases:
      en: [anosognosia, denial of paralysis, unawareness, insula, self-awareness, limb ownership]
      fr: [anosognosie, déni de la paralysie, méconnaissance, insula, conscience de soi, appartenance du membre]

  - id: lateropulsion
    name: {en: Pusher syndrome, fr: Syndrome du pousseur}
    domain: {en: Postural control, fr: Contrôle postural}
    summary:
      en: Active pushing away from the non-paretic side with a tilted sense of upright. This profile locates the lesion overlap in a series of severe cases.
      fr: Poussée active à l’opposé du côté non parétique avec une perception inclinée de la verticale. Ce profil situe le chevauchement lésionnel dans une série de cas sévères.
    aliases:
      en: [contraversive pushing, lateropulsion, postural vertical, balance, thalamus, graviception]
      fr: [poussée controversive, latéropulsion, verticale posturale, équilibre, thalamus, graviception]

  - id: hemichorea
    name: {en: Hemichorea and hemiballism, fr: Hémichorée et hémiballisme}
    domain: {en: Movement, fr: Mouvement}
    summary:
      en: Involuntary flinging or dancing movements of one side of the body. This profile weighs the classic subthalamic localization against its exceptions.
      fr: Mouvements involontaires de projection ou de danse d’un côté du corps. Ce profil confronte la localisation sous-thalamique classique à ses exceptions.
    aliases:
      en: [hemiballismus, chorea, ballism, involuntary movements, subthalamic nucleus, hyperkinesia]
      fr: [hémiballisme, chorée, ballisme, mouvements involontaires, noyau sous-thalamique, hyperkinésie]

  - id: dystonia
    name: {en: Secondary dystonia, fr: Dystonie secondaire}
    domain: {en: Movement, fr: Mouvement}
    summary:
      en: Sustained abnormal postures or twisting movements after a focal lesion. This profile draws on two reviews of published cases.
      fr: Postures anormales soutenues ou mouvements de torsion après une lésion focale. Ce profil s’appuie sur deux revues de cas publiés.
    aliases:
      en: [dystonia, hemidystonia, abnormal posture, putamen, basal ganglia, thalamus]
      fr: [dystonie, hémidystonie, posture anormale, putamen, noyaux gris centraux, thalamus]

  - id: abulia
    name: {en: Abulia, fr: Aboulie}
    domain: {en: Motivation, fr: Motivation}
    summary:
      en: Apathy with loss of initiative, spontaneous thought and emotional response. This profile follows focal basal ganglia lesions.
      fr: Apathie avec perte d’initiative, de pensée spontanée et de réponse émotionnelle. Ce profil concerne les lésions focales des noyaux gris centraux.
    aliases:
      en: [apathy, loss of initiative, caudate, basal ganglia, disinhibition, motivation]
      fr: [apathie, perte d’initiative, noyau caudé, noyaux gris centraux, désinhibition, motivation]

  - id: parkinsonism
    name: {en: Parkinsonism, fr: Syndrome parkinsonien}
    domain: {en: Movement, fr: Mouvement}
    summary:
      en: Slowness, rigidity and tremor from loss of dopaminergic output. This profile combines nigral neuropathology with rare focal lentiform lesions.
      fr: Lenteur, rigidité et tremblement par perte de la sortie dopaminergique. Ce profil associe la neuropathologie nigrique aux rares lésions focales lenticulaires.
    aliases:
      en: [bradykinesia, rigidity, tremor, substantia nigra, Parkinson, dopamine]
      fr: [bradykinésie, rigidité, tremblement, substance noire, Parkinson, dopamine]

  - id: central-pain
    name: {en: Central post-stroke pain, fr: Douleur centrale post-AVC}
    domain: {en: Pain, fr: Douleur}
    summary:
      en: Persistent pain arising from a lesion of the somatosensory pathways themselves. This profile locates the thalamic site that carries the risk.
      fr: Douleur persistante issue d’une lésion des voies somatosensorielles elles-mêmes. Ce profil situe le site thalamique porteur du risque.
    aliases:
      en: [thalamic pain, Dejerine-Roussy, neuropathic pain, thalamus, pulvinar, ventral posterior nucleus]
      fr: [douleur thalamique, Dejerine-Roussy, douleur neuropathique, thalamus, pulvinar, noyau ventral postérieur]

  - id: coma
    name: {en: Coma, fr: Coma}
    domain: {en: Consciousness, fr: Conscience}
    summary:
      en: Loss of wakefulness and awareness after brainstem injury. This profile charts which tegmental lesions produced coma in a stroke series.
      fr: Perte de l’éveil et de la conscience après une atteinte du tronc cérébral. Ce profil repère les lésions tegmentales ayant produit un coma dans une série d’AVC.
    aliases:
      en: [consciousness, arousal, brainstem, reticular formation, tegmentum, pons]
      fr: [conscience, éveil, tronc cérébral, formation réticulée, tegmentum, pont]

  - id: dysphagia
    name: {en: Dysphagia, fr: Dysphagie}
    domain: {en: Swallowing, fr: Déglutition}
    summary:
      en: Impaired swallowing with risk of aspiration after stroke. This profile follows atlas-based lesion localization in acute supratentorial infarcts.
      fr: Trouble de la déglutition avec risque d’aspiration après un AVC. Ce profil s’appuie sur une localisation lésionnelle par atlas dans des infarctus supratentoriels aigus.
    aliases:
      en: [swallowing, aspiration, insula, frontal operculum, internal capsule]
      fr: [déglutition, aspiration, insula, opercule frontal, capsule interne]

  - id: achromatopsia
    name: {en: Cerebral achromatopsia, fr: Achromatopsie cérébrale}
    domain: {en: Vision, fr: Vision}
    summary:
      en: Loss of colour vision from cortical damage with the eyes intact. This profile pools published cases to locate the critical ventral occipital site.
      fr: Perte de la vision des couleurs par atteinte corticale avec des yeux intacts. Ce profil regroupe les cas publiés pour situer le site occipital ventral critique.
    aliases:
      en: [colour vision, color blindness acquired, achromatopsia, ventral occipital, V4, lingual gyrus]
      fr: [vision des couleurs, daltonisme acquis, achromatopsie, occipital ventral, V4, gyrus lingual]

  - id: akinetopsia
    name: {en: Akinetopsia, fr: Akinétopsie}
    domain: {en: Vision, fr: Vision}
    summary:
      en: Selective loss of visual motion perception. This profile rests on one extensively studied patient with bilateral lateral occipitotemporal damage.
      fr: Perte sélective de la perception visuelle du mouvement. Ce profil repose sur une patiente longuement étudiée avec atteinte occipito-temporale latérale bilatérale.
    aliases:
      en: [motion blindness, movement vision, V5, MT, occipitotemporal, patient LM]
      fr: [cécité au mouvement, vision du mouvement, V5, MT, occipito-temporal, patiente LM]

  - id: topographical-disorientation
    name: {en: Topographical disorientation, fr: Désorientation topographique}
    domain: {en: Spatial navigation, fr: Navigation spatiale}
    summary:
      en: Inability to find one’s way in familiar surroundings despite recognizing landmarks. This profile concerns a loss of directional sense after retrosplenial haemorrhage.
      fr: Incapacité à s’orienter dans un environnement familier malgré la reconnaissance des repères. Ce profil concerne une perte du sens de la direction après hémorragie rétrospléniale.
    aliases:
      en: [wayfinding, sense of direction, getting lost, retrosplenial, posterior cingulate, navigation]
      fr: [orientation, sens de la direction, se perdre, rétrosplénial, cingulaire postérieur, navigation]

  - id: cerebellar-cognitive
    name: {en: Cerebellar cognitive affective syndrome, fr: Syndrome cérébelleux cognitivo-affectif}
    domain: {en: Cognition and affect, fr: Cognition et affect}
    summary:
      en: Executive, visuospatial, linguistic and affective changes after disease confined to the cerebellum. This profile follows the series that defined the syndrome.
      fr: Changements exécutifs, visuospatiaux, langagiers et affectifs après une maladie limitée au cervelet. Ce profil suit la série qui a défini le syndrome.
    aliases:
      en: [Schmahmann syndrome, cerebellum cognition, posterior lobe, vermis, affect, executive]
      fr: [syndrome de Schmahmann, cognition cérébelleuse, lobe postérieur, vermis, affect, exécutif]

  - id: dysarthria
    name: {en: Dysarthria, fr: Dysarthrie}
    domain: {en: Speech motor execution, fr: Exécution motrice de la parole}
    summary:
      en: Slurred or imprecise speech from weakness or incoordination of the articulators. This profile contrasts corticobulbar and cerebellar lesion sites.
      fr: Parole empâtée ou imprécise par faiblesse ou incoordination des articulateurs. Ce profil oppose les sites lésionnels cortico-bulbaires et cérébelleux.
    aliases:
      en: [slurred speech, articulation, corticobulbar, motor cortex, cerebellum, pons]
      fr: [parole empâtée, articulation, cortico-bulbaire, cortex moteur, cervelet, pont]

  - id: acalculia
    name: {en: Acalculia, fr: Acalculie}
    domain: {en: Calculation, fr: Calcul}
    summary:
      en: Acquired difficulty with arithmetic. This profile concerns calculation after left-hemisphere stroke.
      fr: Difficulté acquise en arithmétique. Ce profil concerne le calcul après un AVC gauche.
    aliases:
      en: [arithmetic, calculation, acquired dyscalculia, numerical cognition]
      fr: [arithmétique, calcul, dyscalculie acquise, cognition numérique]

  - id: agraphia
    name: {en: Acquired dysgraphia, fr: Dysgraphie acquise}
    domain: {en: Spelling, fr: Orthographe}
    summary:
      en: Acquired spelling impairment. This profile focuses on holding letter identities and order in working memory.
      fr: Trouble acquis de l’orthographe. Ce profil porte sur le maintien des lettres et de leur ordre en mémoire de travail.
    aliases:
      en: [agraphia, dysgraphia, spelling, orthographic working memory, graphemic buffer]
      fr: [agraphie, dysgraphie, orthographe, mémoire de travail orthographique, buffer graphémique]

  - id: amusia
    name: {en: Acquired amusia, fr: Amusie acquise}
    domain: {en: Music perception, fr: Perception musicale}
    summary:
      en: Acquired difficulty perceiving musical pitch or rhythm. This profile concerns post-stroke music perception.
      fr: Difficulté acquise à percevoir la hauteur musicale ou le rythme. Ce profil concerne la perception musicale après un AVC.
    aliases:
      en: [amusia, music, pitch perception, rhythm perception, melody]
      fr: [amusie, musique, perception de la hauteur, perception du rythme, mélodie]

  - id: simultanagnosia
    name: {en: Dorsal simultanagnosia, fr: Simultanagnosie dorsale}
    domain: {en: Visual attention, fr: Attention visuelle}
    summary:
      en: Difficulty attending to multiple objects at once. This profile concerns posterior attention-network damage.
      fr: Difficulté à prêter attention à plusieurs objets simultanément. Ce profil concerne les atteintes du réseau attentionnel postérieur.
    aliases:
      en: [simultanagnosia, simultaneous perception, multiple objects, Bálint syndrome]
      fr: [simultanagnosie, perception simultanée, objets multiples, syndrome de Bálint]

  - id: tactile-agnosia
    name: {en: Tactile agnosia, fr: Agnosie tactile}
    domain: {en: Tactile recognition, fr: Reconnaissance tactile}
    summary:
      en: Difficulty recognizing objects by touch beyond elementary sensory loss. This profile concerns acquired right-hand impairment.
      fr: Difficulté à reconnaître les objets au toucher au-delà d’une perte sensitive élémentaire. Ce profil concerne une atteinte acquise de la main droite.
    aliases:
      en: [tactile agnosia, haptic recognition, tactile object recognition, astereognosis]
      fr: [agnosie tactile, reconnaissance haptique, reconnaissance tactile des objets, astéréognosie]

  - id: word-deafness
    name: {en: Pure word deafness, fr: Surdité verbale pure}
    domain: {en: Auditory speech processing, fr: Traitement auditif de la parole}
    summary:
      en: Impaired understanding of heard speech with relatively preserved reading, spontaneous speech and environmental-sound recognition.
      fr: Compréhension de la parole entendue altérée avec préservation relative de la lecture, de la parole spontanée et de la reconnaissance des bruits environnementaux.
    aliases:
      en: [pure word deafness, auditory verbal agnosia, speech sound recognition]
      fr: [surdité verbale pure, agnosie auditive verbale, reconnaissance des sons de la parole]

  - id: visual-extinction
    name: {en: Visual extinction, fr: Extinction visuelle}
    domain: {en: Competitive visual attention, fr: Compétition attentionnelle visuelle}
    summary:
      en: Failure to report a contralesional target during simultaneous bilateral stimulation despite detecting it when presented alone.
      fr: Omission d’une cible contralésionnelle lors d’une stimulation bilatérale simultanée malgré sa détection lorsqu’elle est présentée seule.
    aliases:
      en: [extinction, double simultaneous stimulation, bilateral stimulation, multi-target attention]
      fr: [extinction, double stimulation simultanée, stimulation bilatérale, attention à plusieurs cibles]

  - id: constructional-apraxia
    name: {en: Constructional impairment, fr: Trouble visuoconstructif}
    domain: {en: Visuoconstruction, fr: Visuoconstruction}
    summary:
      en: Acquired difficulty copying or constructing spatial arrangements. This profile concerns complex figure copying after stroke.
      fr: Difficulté acquise à copier ou construire des arrangements spatiaux. Ce profil concerne la copie de figures complexes après un AVC.
    aliases:
      en: [constructional apraxia, visuoconstruction, figure copying, drawing, constructional ability]
      fr: [apraxie constructive, apraxie visuoconstructive, copie de figures, dessin, capacités constructives]

  - id: hand-paresis
    name: {en: Cortical hand paresis, fr: Parésie de la main d’origine corticale}
    domain: {en: Voluntary movement, fr: Mouvement volontaire}
    summary:
      en: Hand weakness after cortical injury. This profile concerns infarcts affecting the precentral hand representation.
      fr: Faiblesse de la main après une atteinte corticale. Ce profil concerne les infarctus touchant la représentation précentrale de la main.
    aliases:
      en: [hand weakness, hand paresis, hand knob, monoparesis, motor cortex]
      fr: [faiblesse de la main, parésie de la main, bouton de la main, monoparésie, cortex moteur]

  - id: taste-impairment
    name: {en: Central taste impairment, fr: Trouble gustatif central}
    domain: {en: Gustation, fr: Gustation}
    summary:
      en: Reduced taste intensity or identification after brain injury. This profile examines unilateral insular lesions.
      fr: Diminution de l’intensité gustative ou de l’identification des saveurs après une atteinte cérébrale. Ce profil examine les lésions insulaires unilatérales.
    aliases:
      en: [hypogeusia, ageusia, taste loss, taste recognition, gustatory impairment]
      fr: [hypogueusie, agueusie, perte du goût, reconnaissance des saveurs, déficit gustatif]

  - id: somatoparaphrenia
    name: {en: Somatoparaphrenia, fr: Somatoparaphrénie}
    domain: {en: Limb ownership, fr: Appartenance corporelle}
    summary:
      en: Delusional denial or misattribution of ownership of a limb. This profile concerns limb disownership after right-hemisphere damage.
      fr: Déni délirant ou attribution erronée de l’appartenance d’un membre. Ce profil concerne la désappropriation corporelle après une atteinte hémisphérique droite.
    aliases:
      en: [limb disownership, body ownership, somatoparaphrenia, delusional misidentification]
      fr: [désappropriation corporelle, appartenance du membre, somatoparaphrénie, identification délirante]

  - id: alien-hand
    name: {en: Alien hand syndrome, fr: Syndrome de la main étrangère}
    domain: {en: Voluntary action control, fr: Contrôle volontaire de l’action}
    summary:
      en: Apparently purposeful hand actions outside voluntary control. This profile focuses on intermanual conflict after callosal injury.
      fr: Actions de la main apparemment intentionnelles échappant au contrôle volontaire. Ce profil porte sur le conflit intermanuel après une atteinte calleuse.
    aliases:
      en: [alien hand, anarchic hand, intermanual conflict, callosal disconnection]
      fr: [main étrangère, main anarchique, conflit intermanuel, déconnexion calleuse]

references:
  - id: dronkers-2004
    title: Lesion analysis of the brain areas involved in language comprehension
    authors: Dronkers NF, Wilkins DP, Van Valin RD Jr, Redfern BB, Jaeger JJ
    year: 2004
    journal: Cognition
    doi: 10.1016/j.cognition.2003.11.002
    pmid: '15037129'
    method: lesion-mapping
    scope: abstract
