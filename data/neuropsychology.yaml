  - id: motor-neglect-putamen
    deficit: motor-neglect
    title: {en: Competing movement plans after right-hemisphere stroke, fr: Compétition entre programmes moteurs après AVC droit}
    network: {en: Right putamen and motor association network, fr: Putamen droit et réseau d’association motrice}
    laterality: right
    finding:
      en: Seven patients with left motor neglect underused the limb despite no significant weakness on examination. A masked-prime task linked interference from right-hand movement plans to right putamen and nearby white-matter damage; every motor-neglect case involved some part of the putamen.
      fr: Sept patients avec négligence motrice gauche sous-utilisaient le membre malgré l’absence de faiblesse significative à l’examen. Une tâche d’amorçage masqué reliait l’interférence des programmes moteurs de la main droite à une atteinte du putamen droit et de la substance blanche voisine; chaque cas impliquait une partie du putamen.
    limitation:
      en: Lesion analyses included only 13 stroke patients. The movement-planning interference measure and the bedside neglect-severity score were analyzed separately; severity-related sites were scattered. This small study does not establish a unique motor-neglect centre or validate its severity score as a diagnostic test.
      fr: Les analyses lésionnelles ne comprenaient que 13 patients avec AVC. La mesure d’interférence entre programmes moteurs et le score clinique de sévérité de négligence étaient analysés séparément; les sites associés à la sévérité étaient dispersés. Cette petite étude n’établit pas de centre unique de la négligence motrice et ne valide pas son score comme test diagnostique.
    mapping_note:
      en: The whole right putamen is a coarse landmark for directly injured tissue. It does not reproduce the significant clusters, surrounding white-matter injury or the broader motor association network. Motor underuse was left-sided.
      fr: Le putamen droit entier est un repère approximatif du tissu directement lésé. Il ne reproduit ni les amas significatifs, ni l’atteinte de substance blanche voisine, ni le réseau d’association motrice plus large. La sous-utilisation motrice était gauche.
    mappings:
      - {region: 'aseg:right:51', source_name: Right-Putamen}
    evidence:
      - {reference: coulthard-2008, role: supporting}

  - id: tactile-extinction-opercular
