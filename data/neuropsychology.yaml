  - id: dysphagia-insula
    deficit: dysphagia
    title: {en: Aspiration risk after supratentorial stroke, fr: Risque d’aspiration après AVC supratentoriel}
    network: {en: Insula, frontal operculum and internal capsule, fr: Insula, opercule frontal et capsule interne}
    laterality: bilateral
    finding:
      en: In 94 first supratentorial strokes, acute aspiration risk was independently associated with lesions of the internal capsule (odds ratio 6.2) and insular cortex (4.8). Combined frontal operculum and insula lesions were the only predictor of risk lasting beyond a week (odds ratio 33.8).
      fr: Chez 94 premiers AVC supratentoriels, le risque aigu d’aspiration était indépendamment associé aux lésions de la capsule interne (rapport de cotes 6,2) et du cortex insulaire (4,8). Les lésions combinées de l’opercule frontal et de l’insula étaient le seul prédicteur d’un risque persistant au-delà d’une semaine (rapport de cotes 33,8).
    limitation:
      en: Clinical swallowing assessment rather than instrumental study. Lesion side made no difference between groups, and subcortical strokes tended to recover within a week.
      fr: Évaluation clinique de la déglutition plutôt qu’instrumentale. Le côté lésé ne différait pas entre les groupes, et les AVC sous-corticaux tendaient à récupérer en une semaine.
