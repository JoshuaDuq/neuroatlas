  - id: motor-neglect-parietal
    deficit: motor-neglect
    title: {en: Reduced spontaneous movement with preserved motor conduction, fr: Mouvement spontané réduit avec conduction motrice préservée}
    network: {en: Left posterior parietal motor intention, fr: Intention motrice pariétale postérieure gauche}
    laterality: left
    finding:
      en: A left posterior parietal infarct produced right-sided motor neglect without sensory or visuospatial neglect. Primary sensorimotor cortex was spared, with normal central motor conduction and comparable stimulation thresholds on both sides.
      fr: Un infarctus pariétal postérieur gauche entraînait une négligence motrice droite sans négligence sensitive ou visuospatiale. Le cortex sensorimoteur primaire était épargné, avec conduction motrice centrale normale et seuils de stimulation comparables des deux côtés.
