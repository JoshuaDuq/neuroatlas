  - id: coma-dorsolateral-pons
    deficit: coma
    title: {en: Focal dorsolateral pontine injury and coma, fr: Atteinte pontique dorsolatérale focale et coma}
    network: {en: Pontine tegmentum and connected arousal regions, fr: Tegmentum pontique et régions connectées de l’éveil}
    laterality: left
    finding:
      en: A comparison of 12 coma-causing and 24 control brainstem lesions implicated a small left rostral dorsolateral pontine region near the medial parabrachial nucleus. Ten coma lesions involved this region; two spared it and involved the midbrain immediately above it.
      fr: Une comparaison de 12 lésions du tronc causant un coma et de 24 lésions témoins impliquait une petite région pontique dorsolatérale rostrale gauche près du noyau parabrachial médial. Dix lésions de coma impliquaient cette région; deux l’épargnaient et atteignaient le mésencéphale immédiatement au-dessus.
    limitation:
      en: The small retrospective sample included published cases and cannot localize every cause of coma. Some coma lesions appeared unilateral within MRI resolution. Anterior insular and pregenual cingulate findings came from connectivity analyses, not evidence that those cortices were directly damaged in these cases.
      fr: Le petit échantillon rétrospectif comprenait des cas publiés et ne localise pas toutes les causes de coma. Certaines lésions semblaient unilatérales dans les limites de résolution de l’IRM. Les constats insulaires antérieurs et cingulaires prégénuaux provenaient d’analyses de connectivité, pas d’une preuve de lésion directe de ces cortex dans ces cas.
    mapping_note:
      en: The whole left pontine territory is a coarse landmark for the significant lesion region. It cannot resolve the dorsolateral tegmentum or parabrachial nucleus and does not establish a universal left-sided coma site.
      fr: Le territoire pontique gauche entier est un repère approximatif de la région lésionnelle significative. Il ne résout ni le tegmentum dorsolatéral ni le noyau parabrachial et n’établit pas de site gauche universel du coma.
    mappings:
      - {region: 'learning:left:pons', source_name: Pontine territory}
    evidence:
      - {reference: fischer-2016, role: supporting}

  - id: dysphagia-insula
    deficit: dysphagia
    title: {en: Aspiration risk after supratentorial stroke, fr: Risque d’aspiration après AVC supratentoriel}
    network: {en: 'Insula, frontal operculum and internal capsule', fr: 'Insula, opercule frontal et capsule interne'}
    laterality: bilateral
    finding:
      en: In 94 first supratentorial strokes, acute aspiration risk was independently associated with lesions of the internal capsule (odds ratio 6.2) and insular cortex (4.8). Combined frontal operculum and insula lesions were the only predictor of risk lasting beyond a week (odds ratio 33.8).
      fr: Chez 94 premiers AVC supratentoriels, le risque aigu d’aspiration était indépendamment associé aux lésions de la capsule interne (rapport de cotes 6,2) et du cortex insulaire (4,8). Les lésions combinées de l’opercule frontal et de l’insula étaient le seul prédicteur d’un risque persistant au-delà d’une semaine (rapport de cotes 33,8).
    limitation:
      en: Clinical swallowing assessment rather than instrumental study. Lesion side made no difference between groups, and subcortical strokes tended to recover within a week.
      fr: Évaluation clinique de la déglutition plutôt qu’instrumentale. Le côté lésé ne différait pas entre les groupes, et les AVC sous-corticaux tendaient à récupérer en une semaine.
    mapping_note:
      en: Insular and opercular parcels are shown on both sides. The internal capsule has no parcel here.
      fr: Les parcelles insulaires et operculaires sont affichées des deux côtés. La capsule interne n’a pas de parcelle ici.
