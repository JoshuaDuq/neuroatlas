  - id: decision-ventromedial
    deficit: decision-making
    title: {en: Weighing future consequences, fr: Peser les conséquences futures}
    network: {en: Ventromedial prefrontal valuation system, fr: Système de valorisation préfrontal ventromédian}
    laterality: bilateral
    finding:
      en: On a gambling task simulating real-life uncertainty, patients with ventromedial prefrontal damage kept choosing immediate gains despite larger future losses, unlike controls. In a 344-patient lesion map, value-based decision-making deficits localized to ventromedial prefrontal and orbitofrontal cortex, apart from cognitive control.
      fr: Dans une tâche de jeu simulant l’incertitude de la vie réelle, les patients avec atteinte préfrontale ventromédiane continuaient à choisir les gains immédiats malgré des pertes futures plus grandes, contrairement aux témoins. Dans une cartographie lésionnelle de 344 patients, les déficits de décision fondée sur la valeur se localisaient au cortex préfrontal ventromédian et orbitofrontal, à part du contrôle cognitif.
    limitation:
      en: The 1994 sample was small and the task has since been criticized for confounding risk, learning and reward sensitivity. Lesions in this territory are often bilateral and extend into orbitofrontal cortex.
      fr: L’échantillon de 1994 était petit et la tâche a depuis été critiquée pour confondre risque, apprentissage et sensibilité à la récompense. Les lésions de ce territoire sont souvent bilatérales et s’étendent au cortex orbitofrontal.
    mapping_note:
      en: The gyrus rectus and medial orbital sulcus approximate ventromedial prefrontal cortex on each side. Neither study’s lesion maps follow these parcel borders.
      fr: Le gyrus droit et le sillon orbitaire médial représentent approximativement le cortex préfrontal ventromédian de chaque côté. Les cartes lésionnelles des deux études ne suivent pas ces limites de parcelles.
