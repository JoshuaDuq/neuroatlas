    name: {en: Motor neglect, fr: Négligence motrice}
    domain: {en: Spontaneous limb use, fr: Utilisation spontanée des membres}
    group: sensorimotor
    summary:
      en: Reduced spontaneous use of one side despite preserved motor output. This profile concerns a parietal infarct without accompanying sensory or visuospatial neglect.
      fr: Réduction de l’utilisation spontanée d’un côté malgré une commande motrice préservée. Ce profil concerne un infarctus pariétal sans négligence sensitive ou visuospatiale associée.
