  - id: parkinsonism-nigra
    deficit: parkinsonism
    title: {en: Nigral cell loss in Parkinson’s disease, fr: Perte neuronale nigrique dans la maladie de Parkinson}
    network: {en: Substantia nigra pars compacta, fr: Substance noire pars compacta}
    laterality: bilateral
    finding:
      en: In 20 Parkinson’s disease cases, pigmented neurons of the pars compacta were lost exponentially, 45% in the first decade, most in the lateral ventral tier (91%), the opposite pattern to ageing. Loss at symptom onset was estimated at 68% in that tier.
      fr: Chez 20 cas de maladie de Parkinson, les neurones pigmentés de la pars compacta disparaissaient de façon exponentielle, 45 % la première décennie, surtout dans l’étage ventral latéral (91 %), à l’inverse du vieillissement. La perte au début des symptômes était estimée à 68 % dans cet étage.
    limitation:
      en: A degenerative process studied post-mortem, not a focal lesion, and counted on a single section per case. Other parkinsonian conditions showed different regional patterns.
      fr: Processus dégénératif étudié post-mortem, et non lésion focale, compté sur une seule coupe par cas. D’autres syndromes parkinsoniens montraient des profils régionaux différents.
    mapping_note:
      en: The compact part of the substantia nigra is shown from the histological reference. Its ventral tiers are not subdivided.
      fr: La pars compacta de la substance noire provient de la référence histologique. Ses étages ventraux ne sont pas subdivisés.
