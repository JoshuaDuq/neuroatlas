    network: {en: Bilateral amygdala, fr: Amygdale bilatérale}
    laterality: bilateral
    finding:
      en: Patient S.M., with selective bilateral amygdala damage, could not recognize fear or blends of emotions in faces while still identifying the people. Nine patients with bilateral damage were impaired as a group on fear, ranging from severe to essentially normal.
      fr: La patiente S.M., avec une atteinte bilatérale sélective de l’amygdale, ne reconnaissait ni la peur ni les mélanges d’émotions sur les visages tout en identifiant les personnes. Neuf patients avec atteinte bilatérale étaient altérés en groupe pour la peur, de sévèrement atteints à quasi normaux.
    limitation:
      en: Rare bilateral lesions of varied cause. Individual variability was large and one earlier study found no impairment, so the amygdala alone does not account for fear recognition.
      fr: Lésions bilatérales rares et de causes variées. La variabilité individuelle était grande et une étude antérieure n’avait trouvé aucun déficit; l’amygdale seule n’explique donc pas la reconnaissance de la peur.
    mapping_note:
