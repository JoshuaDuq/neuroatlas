    mapping_note:
      en: Angular and supramarginal gyri approximate the reported territory. Gyral parcels do not reproduce Brodmann boundaries or statistical lesion maps.
      fr: Les gyrus angulaire et supramarginal représentent approximativement le territoire rapporté. Les parcelles gyrales ne reproduisent ni les limites de Brodmann ni les cartes lésionnelles statistiques.
    mappings:
