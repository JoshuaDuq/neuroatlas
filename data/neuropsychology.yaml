      fr: Les deux fornix sont montrés à partir de la référence histologique, conformément à l’interruption bilatérale des trois cas déficitaires. Cette série chirurgicale n’établit pas l’atteinte bilatérale comme condition de tout trouble mnésique lié au fornix.
