  - id: stuttering-cortico-striatal
    deficit: stuttering
    title: {en: Distributed lesions affecting speech fluency, fr: Lésions distribuées affectant la fluence}
    network: {en: Left cortico-basal ganglia-cortical speech network, fr: Réseau de la parole cortico-noyaux gris-cortical gauche}
    laterality: left
    finding:
      en: Lesion mapping implicated left inferior frontal, superior temporal, intraparietal and basal ganglia regions and their white-matter connections, rather than one stuttering site.
      fr: La cartographie lésionnelle impliquait des régions frontales inférieures, temporales supérieures, intrapariétales et des noyaux gris gauches, ainsi que leurs connexions de substance blanche, plutôt qu’un site unique du bégaiement.
    limitation:
      en: The 2024 study used a healthy reference connectome; its shared stroke network was bilateral. The left developmental finding concerned reported impact, without a significant volume–disfluency-frequency association. Its clinical stroke cohort reused the 2013 sample. Connectivity does not establish direct injury at every node or localize all developmental stuttering.
      fr: L’étude de 2024 utilisait un connectome de référence sain; son réseau commun après AVC était bilatéral. Le constat développemental gauche concernait l’impact rapporté, sans association significative entre volume et fréquence des dysfluences. Sa cohorte clinique d’AVC reprenait l’échantillon de 2013. La connectivité n’établit ni une lésion directe de chaque nœud ni la localisation de tous les bégaiements développementaux.
    mapping_note:
      en: Inferior frontal opercular and lateral superior temporal parcels provide selected cortical landmarks. The other lesions and connecting white matter are not delineated.
      fr: Les parcelles frontale inférieure operculaire et temporale supérieure latérale fournissent des repères corticaux sélectionnés. Les autres lésions et la substance blanche de connexion ne sont pas délimitées.
