    evidence:
      - {reference: schwartz-2009, role: supporting}

  - id: aphasia-phonological
    deficit: aphasia
    title: {en: Phonological errors in naming, fr: Erreurs phonologiques en dénomination}
    network: {en: Left dorsal stream sensorimotor cortex, fr: Cortex sensorimoteur de la voie dorsale gauche}
    laterality: left
    finding:
      en: Across 1,718 phonological errors from 106 people with aphasia, the critical voxels lay in premotor cortex, the pre- and postcentral gyri and the supramarginal gyrus, with minimal extension into posterior temporal auditory cortex. Phonological and semantic error maps did not overlap.
      fr: Sur 1 718 erreurs phonologiques de 106 personnes aphasiques, les voxels critiques se situaient dans le cortex prémoteur, les gyrus pré- et postcentral et le gyrus supramarginal, avec une extension minimale vers le cortex auditif temporal postérieur. Les cartes des erreurs phonologiques et sémantiques ne se chevauchaient pas.
    limitation:
      en: Error rates in picture naming only. The result challenges the view that phonological retrieval depends on posterior auditory traces, a claim still under debate.
      fr: Taux d’erreurs en dénomination d’images uniquement. Le résultat remet en question l’idée que la récupération phonologique dépend de traces auditives postérieures, ce qui reste débattu.
    mapping_note:
      en: Whole precentral, postcentral and supramarginal parcels are shown. The premotor cluster has no parcel of its own here.
      fr: Les parcelles précentrale, postcentrale et supramarginale entières sont affichées. L’amas prémoteur n’a pas de parcelle propre ici.
