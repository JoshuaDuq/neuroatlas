  - id: aphasia-repetition
    deficit: aphasia
    title: {en: Repeating words and sentences, fr: Répétition de mots et de phrases}
    network: {en: Left dorsal language pathway, fr: Voie langagière dorsale gauche}
    laterality: left
    finding:
      en: Across 25 pooled lesion-mapping studies, repetition-selective deficits arose only from lesions involving the posterior superior temporal gyrus.
      fr: Sur 25 études de cartographie lésionnelle regroupées, les déficits sélectifs de répétition ne survenaient que pour des lésions impliquant le gyrus temporal supérieur postérieur.
    limitation:
      en: Pooled coordinates from post-stroke aphasia. Repetition is one task among several, and pooling across studies cannot resolve subregions within a gyrus.
      fr: Coordonnées regroupées issues d’aphasies post-AVC. La répétition n’est qu’une tâche parmi d’autres, et le regroupement entre études ne peut pas distinguer les sous-régions d’un gyrus.
    mapping_note:
      en: The whole lateral superior temporal parcel is shown. The pooled result concerns its posterior portion.
      fr: La parcelle temporale supérieure latérale entière est affichée. Le résultat regroupé concerne sa portion postérieure.
    mappings:
      - {region: 'destrieux:left:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: na-2022, role: supporting}

  - id: aphasia-production
    deficit: aphasia
    title: {en: Speaking with comprehension preserved, fr: Parole avec compréhension préservée}
    network: {en: Left insular and motor speech system, fr: Système insulaire et moteur de la parole (gauche)}
    laterality: left
    finding:
      en: Damage to insular and motor areas impaired speech with comprehension preserved; frontal lesions severely impaired speaking with relatively good comprehension.
      fr: Les lésions des aires insulaires et motrices altéraient la parole en préservant la compréhension; les lésions frontales altéraient sévèrement la parole avec une compréhension relativement bonne.
    limitation:
      en: The dissociation compares pooled maps for different language functions; it does not make these parcels a speech output system. The meta-analysis pooled reported peak coordinates, not lesion maps.
      fr: La dissociation compare des cartes regroupées pour différentes fonctions langagières; elle ne fait pas de ces parcelles un système de production de la parole. La méta-analyse regroupait des coordonnées de pics publiées, et non des cartes lésionnelles.
    mapping_note:
      en: Whole insular and precentral parcels are shown. The pooled production and fluency peaks were labelled insula and precentral gyrus; their clusters do not follow parcel borders.
      fr: Les parcelles insulaires et précentrale entières sont affichées. Les pics regroupés de production et de fluence étaient attribués à l’insula et au gyrus précentral; leurs amas ne suivent pas les limites des parcelles.
    mappings:
      - {region: 'destrieux:left:17', source_name: G_Ins_lg_and_S_cent_ins}
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: na-2022, role: supporting}

  - id: neglect-egocentric
    deficit: neglect
    title: {en: Neglect of one side of space, fr: Négligence d’un côté de l’espace}
    network: {en: Right perisylvian attention network, fr: Réseau attentionnel périsylvien droit}
    laterality: right
    finding:
      en: Egocentric neglect symptoms were associated with damage in a perisylvian network — precentral, postcentral, supramarginal and superior temporal gyri — and with subcortical damage.
      fr: Les symptômes de négligence égocentrée étaient associés à des lésions d’un réseau périsylvien — gyrus précentral, postcentral, supramarginal et temporal supérieur — et à des lésions sous-corticales.
    limitation:
      en: Pooling across studies that diagnosed neglect with different tests. The same analysis implicated long association and projection white matter, so a disconnection account is not excluded.
      fr: Regroupement d’études diagnostiquant la négligence avec des tests différents. La même analyse impliquait la substance blanche d’association et de projection, de sorte qu’une explication par déconnexion n’est pas exclue.
    mapping_note:
      en: Cortical parcels only. The subcortical and white-matter findings of the same meta-analysis have no parcel shown here.
      fr: Parcelles corticales uniquement. Les résultats sous-corticaux et de substance blanche de la même méta-analyse n’ont pas de parcelle affichée ici.
    mappings:
      - {region: 'destrieux:right:29', source_name: G_precentral}
      - {region: 'destrieux:right:28', source_name: G_postcentral}
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
      - {region: 'destrieux:right:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: chechlacz-2012, role: supporting}

  - id: neglect-allocentric
    deficit: neglect
    title: {en: Neglect of one side of each object, fr: Négligence d’un côté de chaque objet}
    network: {en: Right posterior temporo-parieto-occipital cortex, fr: Cortex temporo-pariéto-occipital postérieur droit}
    laterality: right
    finding:
      en: Allocentric neglect symptoms were associated with more posterior lesions, including the angular, middle temporal and middle occipital gyri.
      fr: Les symptômes de négligence allocentrée étaient associés à des lésions plus postérieures, incluant les gyrus angulaire, temporal moyen et occipital moyen.
    limitation:
      en: Egocentric and allocentric symptoms co-occur in many patients, so these sites are a dissociation in pooled data rather than a boundary in any one person.
      fr: Les symptômes égocentrés et allocentrés coexistent chez de nombreux patients; ces sites constituent donc une dissociation dans des données regroupées, et non une frontière chez une personne donnée.
    mapping_note:
      en: Whole parcels are shown for a result reported as overlapping likelihood clusters, which do not follow parcel borders.
      fr: Les parcelles entières sont affichées pour un résultat rapporté sous forme d’amas de vraisemblance, qui ne suivent pas les limites des parcelles.
    mappings:
      - {region: 'destrieux:right:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:right:38', source_name: G_temporal_middle}
      - {region: 'destrieux:right:19', source_name: G_occipital_middle}
    evidence:
      - {reference: chechlacz-2012, role: supporting}

  - id: aphasia-naming
    deficit: aphasia
    title: {en: Naming pictures, fr: Dénomination d’images}
    network: {en: Left middle temporal lexical retrieval system, fr: Système de récupération lexicale temporal moyen gauche}
    laterality: left
    finding:
      en: Boston Naming Test scores mapped to a left peri-Sylvian network; once visual recognition and motor speech were controlled, the critical region narrowed to the mid-posterior middle temporal gyrus and its underlying white matter.
      fr: Les scores au Boston Naming Test correspondaient à un réseau périsylvien gauche; après contrôle de la reconnaissance visuelle et de la parole motrice, la région critique se réduisait au gyrus temporal moyen mi-postérieur et à sa substance blanche sous-jacente.
    limitation:
      en: Single chronic left-hemisphere strokes in right-handed native English speakers, excluding clinical neglect and visual agnosia. Anterior temporal contributions reported by other studies were not the critical site here.
      fr: AVC gauches uniques en phase chronique chez des droitiers de langue maternelle anglaise, sans négligence clinique ni agnosie visuelle. Les contributions temporales antérieures rapportées par d’autres études n’étaient pas le site critique ici.
    mapping_note:
      en: The whole middle temporal parcel is shown. The finding concerns its middle and posterior portions and the white matter beneath, which has no parcel.
      fr: La parcelle temporale moyenne entière est affichée. Le résultat concerne ses portions moyenne et postérieure et la substance blanche sous-jacente, qui n’a pas de parcelle.
    mappings:
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: baldo-2013, role: supporting}

  - id: hemianopia-occipital
    deficit: hemianopia
    title: {en: Visual field loss from retrochiasmal lesions, fr: Perte du champ visuel par lésion rétrochiasmatique}
    network: {en: Retrochiasmal visual pathway and occipital cortex, fr: Voie visuelle rétrochiasmatique et cortex occipital}
    laterality: bilateral
    finding:
      en: In 904 homonymous hemianopias, lesions were most often in the occipital lobes (45%) and the optic radiations (32%). Stroke accounted for about 70% of cases, followed by trauma and tumour.
      fr: Sur 904 hémianopsies homonymes, les lésions siégeaient le plus souvent dans les lobes occipitaux (45 %) et les radiations optiques (32 %). L’AVC expliquait environ 70 % des cas, suivi des traumatismes et des tumeurs.
    limitation:
      en: A retrospective neuro-ophthalmology series. The authors note that the shape of a field defect does not reliably indicate a specific lesion site along the pathway.
      fr: Série rétrospective de neuro-ophtalmologie. Les auteurs soulignent que la forme du déficit campimétrique n’indique pas de façon fiable un site lésionnel précis le long de la voie.
    mapping_note:
      en: The calcarine sulcus and occipital pole mark primary visual cortex on each side; a lesion there affects the opposite visual field. The optic radiations have no parcel.
      fr: Le sillon calcarin et le pôle occipital repèrent le cortex visuel primaire de chaque côté; une lésion y affecte le champ visuel opposé. Les radiations optiques n’ont pas de parcelle.
    mappings:
      - {region: 'destrieux:left:45', source_name: S_calcarine}
      - {region: 'destrieux:right:45', source_name: S_calcarine}
      - {region: 'destrieux:left:43', source_name: Pole_occipital}
      - {region: 'destrieux:right:43', source_name: Pole_occipital}
    evidence:
      - {reference: zhang-2006, role: supporting}

  - id: ataxia-nuclei
    deficit: ataxia
    title: {en: Limb, posture and gait ataxia from the deep nuclei, fr: Ataxie des membres, de la posture et de la marche par les noyaux profonds}
    network: {en: Cerebellar output nuclei, fr: Noyaux de sortie du cervelet}
    laterality: bilateral
    finding:
      en: Limb ataxia correlated with lesions of the interposed nuclei and part of the dentate nucleus; ataxia of posture and gait with the fastigial nuclei including the interposed nuclei. Nuclear lesions were not fully compensated at any age.
      fr: L’ataxie des membres était corrélée aux lésions des noyaux interposés et d’une partie du noyau dentelé; l’ataxie posturale et de la marche, à celles des noyaux fastigiaux incluant les noyaux interposés. Les lésions nucléaires n’étaient entièrement compensées à aucun âge.
    limitation:
      en: The strongest correlations came from the acute ischaemic subgroup. Ischaemic and surgical lesions, adults and patients operated in childhood were pooled.
      fr: Les corrélations les plus fortes provenaient du sous-groupe ischémique aigu. Lésions ischémiques et chirurgicales, adultes et patients opérés dans l’enfance étaient regroupés.
    mapping_note:
      en: Dentate and interposed nuclei come from the histological reference. The fastigial nucleus has no separate solid here, and cerebellar deficits are ipsilateral to the lesion.
      fr: Les noyaux dentelé et interposés proviennent de la référence histologique. Le noyau fastigial n’a pas de solide distinct ici, et les déficits cérébelleux sont ipsilatéraux à la lésion.
    mappings:
      - {region: 'learning:left:dentate', source_name: Cerebellar dentate nucleus}
      - {region: 'learning:right:dentate', source_name: Cerebellar dentate nucleus}
      - {region: 'learning:left:interposed', source_name: Interposed nuclei}
      - {region: 'learning:right:interposed', source_name: Interposed nuclei}
    evidence:
      - {reference: schoch-2006, role: supporting}

  - id: ataxia-cortex
    deficit: ataxia
    title: {en: Somatotopy of the superior cerebellar cortex, fr: Somatotopie du cortex cérébelleux supérieur}
    network: {en: Anterior and superior cerebellar lobules, fr: Lobules cérébelleux antérieurs et supérieurs}
    laterality: bilateral
    finding:
      en: Cortical correlations were weaker and confined to the superior cerebellum. Upper limb ataxia followed lobules IV–VI, lower limb lobules III and VI, dysarthria paravermal and hemispheral lobules V–VI, and posture and gait vermal lobules II–IV.
      fr: Les corrélations corticales étaient plus faibles et limitées au cervelet supérieur. L’ataxie du membre supérieur suivait les lobules IV–VI, celle du membre inférieur les lobules III et VI, la dysarthrie les lobules paravermiens et hémisphériques V–VI, et la posture et la marche les lobules vermiens II–IV.
    limitation:
      en: Chronic lesions showed far fewer cortical correlations, consistent with compensation. Lobule-level results cannot be verified against a whole-cortex solid.
      fr: Les lésions chroniques montraient beaucoup moins de corrélations corticales, ce qui suggère une compensation. Les résultats par lobule ne peuvent pas être vérifiés sur un solide cortical entier.
    mapping_note:
      en: The whole cerebellar cortex is shown on each side. It is not subdivided into lobules or vermis, so the reported somatotopy is not visible.
      fr: Le cortex cérébelleux entier est affiché de chaque côté. Il n’est pas subdivisé en lobules ni en vermis, de sorte que la somatotopie rapportée n’est pas visible.
    mappings:
      - {region: 'aseg:left:8', source_name: Left-Cerebellum-Cortex}
      - {region: 'aseg:right:47', source_name: Right-Cerebellum-Cortex}
    evidence:
      - {reference: schoch-2006, role: supporting}

  - id: speech-apraxia-insula
    deficit: speech-apraxia
    title: {en: The precentral gyrus of the insula, fr: Le gyrus précentral de l’insula}
    network: {en: Left anterior insula, fr: Insula antérieure gauche}
    laterality: left
    finding:
      en: All 25 chronic stroke patients with articulatory planning deficits had lesions including a discrete region of the left precentral gyrus of the insula, which was spared in all 19 patients without the deficit.
      fr: Les 25 patients avec AVC chronique et déficit de planification articulatoire avaient tous une lésion incluant une région circonscrite du gyrus précentral de l’insula gauche, épargnée chez les 19 patients sans ce déficit.
    limitation:
      en: Hillis et al. found no association with the insula in 80 acute strokes and attributed the overlap to the insula’s vulnerability in middle cerebral artery occlusion.
      fr: Hillis et al. n’ont trouvé aucune association avec l’insula chez 80 AVC aigus et ont attribué le chevauchement à la vulnérabilité de l’insula lors d’une occlusion de l’artère cérébrale moyenne.
    mapping_note:
      en: The short insular gyri parcel contains the precentral insular gyrus. The reported region is a small part of this parcel.
      fr: La parcelle des gyrus courts de l’insula contient le gyrus précentral insulaire. La région rapportée n’en occupe qu’une petite partie.
    mappings:
      - {region: 'destrieux:left:18', source_name: G_insular_short}
    evidence:
      - {reference: dronkers-1996, role: supporting}
      - {reference: hillis-2004, role: qualifying}

  - id: speech-apraxia-frontal
    deficit: speech-apraxia
    title: {en: Posterior inferior frontal gyrus in acute stroke, fr: Gyrus frontal inférieur postérieur dans l’AVC aigu}
    network: {en: Left posterior inferior frontal cortex, fr: Cortex frontal inférieur postérieur gauche}
    laterality: left
    finding:
      en: In 40 acute left-hemisphere strokes with insular damage and 40 without, apraxia of speech was associated with structural damage or hypoperfusion of the left posterior inferior frontal gyrus, not with the insula.
      fr: Chez 40 AVC gauches aigus avec atteinte insulaire et 40 sans, l’apraxie de la parole était associée à une lésion structurelle ou à une hypoperfusion du gyrus frontal inférieur postérieur gauche, et non à l’insula.
    limitation:
      en: Acute deficits with perfusion imaging may capture transient dysfunction rather than the tissue whose permanent loss causes the deficit. Dronkers’ chronic findings point elsewhere.
      fr: Les déficits aigus avec imagerie de perfusion peuvent refléter une dysfonction transitoire plutôt que le tissu dont la perte définitive cause le déficit. Les résultats chroniques de Dronkers pointent ailleurs.
    mapping_note:
      en: The opercular part of the inferior frontal gyrus is the closest parcel to the reported posterior inferior frontal region.
      fr: La partie operculaire du gyrus frontal inférieur est la parcelle la plus proche de la région frontale inférieure postérieure rapportée.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
    evidence:
      - {reference: hillis-2004, role: supporting}
      - {reference: dronkers-1996, role: qualifying}

  - id: emotion-amygdala
    deficit: emotion-recognition
    title: {en: Recognizing fear in faces, fr: Reconnaître la peur sur les visages}
    network: {en: Bilateral amygdala, fr: Amygdale bilatérale}
    laterality: bilateral
    finding:
      en: Patient S.M., with selective bilateral amygdala damage, could not recognize fear or blends of emotions in faces while still identifying the people. Nine patients with bilateral damage were impaired as a group on fear, ranging from severe to essentially normal.
      fr: La patiente S.M., avec une atteinte bilatérale sélective de l’amygdale, ne reconnaissait ni la peur ni les mélanges d’émotions sur les visages tout en identifiant les personnes. Neuf patients avec atteinte bilatérale étaient altérés en groupe pour la peur, de sévèrement atteints à quasi normaux.
    limitation:
      en: Rare bilateral lesions of varied cause. Individual variability was large and one earlier study found no impairment, so the amygdala alone does not account for fear recognition.
      fr: Lésions bilatérales rares et de causes variées. La variabilité individuelle était grande et une étude antérieure n’avait trouvé aucun déficit; l’amygdale seule n’explique donc pas la reconnaissance de la peur.
    mapping_note:
      en: Whole amygdalae are shown. The reported cases involved bilateral damage; a unilateral lesion is not equivalent.
      fr: Les amygdales entières sont affichées. Les cas rapportés impliquaient une atteinte bilatérale; une lésion unilatérale n’est pas équivalente.
    mappings:
      - {region: 'aseg:left:18', source_name: Left-Amygdala}
      - {region: 'aseg:right:54', source_name: Right-Amygdala}
    evidence:
      - {reference: adolphs-1994, role: supporting}
      - {reference: adolphs-1999, role: supporting}

  - id: optic-ataxia-junction
    deficit: optic-ataxia
    title: {en: Reaching under visual guidance, fr: Atteinte sous guidage visuel}
    network: {en: Occipito-parietal junction and precuneus, fr: Jonction occipito-pariétale et précunéus}
    laterality: bilateral
    finding:
      en: Lesion overlap centred on the lateral occipito-parietal junction between the inferior parietal lobule and superior occipital cortex, extending medially to the precuneus, rather than on the superior parietal lobule convexity.
      fr: Le chevauchement lésionnel se centrait sur la jonction occipito-pariétale latérale entre le lobule pariétal inférieur et le cortex occipital supérieur, s’étendant médialement au précunéus, plutôt que sur la convexité du lobule pariétal supérieur.
    limitation:
      en: Lesion overlap in patients selected for optic ataxia; the abstract does not report a comparison with patients lacking the deficit. In the left hemisphere the overlap also reached the junction of occipital cortex and superior parietal lobule.
      fr: Chevauchement lésionnel chez des patients sélectionnés pour une ataxie optique; le résumé ne rapporte pas de comparaison avec des patients sans ce déficit. Dans l’hémisphère gauche, le chevauchement atteignait aussi la jonction entre cortex occipital et lobule pariétal supérieur.
    mapping_note:
      en: Angular, superior occipital and precuneus parcels bracket the reported junction on each side. The overlap crossed parcel borders and involved underlying white matter.
      fr: Les parcelles angulaire, occipitale supérieure et du précunéus encadrent la jonction rapportée de chaque côté. Le chevauchement traversait les limites des parcelles et impliquait la substance blanche sous-jacente.
    mappings:
      - {region: 'destrieux:left:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:right:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:left:20', source_name: G_occipital_sup}
      - {region: 'destrieux:right:20', source_name: G_occipital_sup}
      - {region: 'destrieux:left:30', source_name: G_precuneus}
