      en: One case demonstrates a possible intentional disorder with intact motor output. It does not establish the most common lesion site or exclude frontal and subcortical causes.
      fr: Un cas démontre un trouble intentionnel possible avec commande motrice préservée. Il n’établit pas le site lésionnel le plus fréquent et n’exclut pas des causes frontales ou sous-corticales.
