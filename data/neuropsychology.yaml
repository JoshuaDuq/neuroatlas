      fr: Sur 17 cas rapportés de ballisme-chorée après lésion thalamique ou sous-thalamique, 15 avaient une lésion unilatérale du noyau ou de la région sous-thalamique, tous avec hémichorée ou hémiballisme controlatéral.
    limitation:
      en: A review of published cases. Dewey and Jankovic found a cause other than stroke in almost half (10 of 21) of their patients, and noted that subcortical structures besides the subthalamic nucleus may be involved.
      fr: Revue de cas publiés. Dewey et Jankovic ont trouvé une cause autre que l’AVC chez près de la moitié (10 sur 21) de leurs patients, et notaient que d’autres structures sous-corticales que le noyau sous-thalamique pouvaient être impliquées.
    mapping_note:
      en: The subthalamic nucleus is shown on both sides. Movements are contralateral to the lesion.
