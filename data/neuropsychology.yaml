    title: {en: Putaminal lesions and upper-limb spasticity, fr: Lésions putaminales et spasticité du membre supérieur}
    network: {en: Distributed regulation of muscle tone, fr: Régulation distribuée du tonus musculaire}
    laterality: bilateral
    finding:
      en: In 97 stroke patients, the putamen was the region most frequently damaged in those with upper-limb spasticity after lesion subtraction and statistical comparison. Greater spasticity was associated with larger lesions.
      fr: Chez 97 patients avec AVC, le putamen était la région la plus fréquemment lésée chez ceux présentant une spasticité du membre supérieur après soustraction lésionnelle et comparaison statistique. Une spasticité plus importante était associée à des lésions plus volumineuses.
    limitation:
      en: Modified Ashworth ratings include resistance to passive movement and differ from a reflex-threshold measure. Frenkel-Toledo’s elbow-flexor spasticity map did not survive multiple-comparison correction and is exploratory; it cannot establish a definitive spasticity network.
      fr: Les cotations d’Ashworth modifiée incluent la résistance au mouvement passif et diffèrent d’une mesure du seuil réflexe. La carte de spasticité des fléchisseurs du coude de Frenkel-Toledo ne résistait pas à la correction des comparaisons multiples et reste exploratoire; elle n’établit pas un réseau définitif de la spasticité.
