    title: {en: Movement vision in patient L.M., fr: Vision du mouvement chez la patiente L.M.}
    network: {en: Bilateral lateral occipitotemporal motion cortex, fr: Cortex occipito-temporal latéral bilatéral du mouvement}
    laterality: bilateral
    finding:
      en: L.M. could only distinguish stationary from moving targets in the periphery and saw no movement in depth, with hearing and touch motion intact; at follow-up the deficit had not changed significantly. MRI showed bilateral lesions of the upper occipital gyri and adjacent middle temporal gyri, centred on the upper banks of the anterior occipital sulcus.
      fr: L.M. ne distinguait que cibles fixes et mobiles en périphérie et ne percevait aucun mouvement en profondeur, avec une perception du mouvement auditive et tactile intacte; au suivi, le déficit n’avait pas changé de façon significative. L’IRM montrait des lésions bilatérales des gyrus occipitaux supérieurs et des gyrus temporaux moyens adjacents, centrées sur les berges supérieures du sillon occipital antérieur.
    limitation:
      en: L.M. is one patient with associated bilateral pathway damage. Otsuka-Hirota reported persistent motion blindness after a unilateral right temporoparietal subcortical haemorrhage, so bilateral cortical injury cannot be treated as a universal requirement.
      fr: L.M. est une patiente unique avec atteinte bilatérale associée des voies. Otsuka-Hirota rapportait une cécité au mouvement persistante après hémorragie sous-corticale temporopariétale droite unilatérale; l’atteinte corticale bilatérale ne peut donc pas être considérée comme une condition universelle.
    mapping_note:
      en: The anterior occipital sulcus, middle occipital and middle temporal parcels bracket L.M.’s bilateral lesions. They are coarse landmarks, not functional V5/MT borders, and do not map the qualifying unilateral subcortical case.
      fr: Le sillon occipital antérieur et les parcelles occipitale moyenne et temporale moyenne encadrent les lésions bilatérales de L.M. Ces repères approximatifs ne sont pas les limites fonctionnelles de V5/MT et ne cartographient pas le cas sous-cortical unilatéral nuançant ce résultat.
