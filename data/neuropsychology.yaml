  - id: neglect-subcortical
    deficit: neglect
    title: {en: Neglect after basal ganglia and thalamic lesions, fr: Négligence après lésions des noyaux gris centraux et du thalamus}
    network: {en: Right putamen–caudate–pulvinar network, fr: Réseau putamen–noyau caudé–pulvinar droit}
    laterality: right
    finding:
      en: Comparing right subcortical lesions in patients with and without neglect, the putamen, the pulvinar and, to a smaller degree, the caudate nucleus were the structures typically associated with spatial neglect. All connect directly to the superior temporal gyrus.
      fr: En comparant des lésions sous-corticales droites chez des patients avec et sans négligence, le putamen, le pulvinar et, dans une moindre mesure, le noyau caudé étaient les structures typiquement associées à la négligence spatiale. Toutes se connectent directement au gyrus temporal supérieur.
    limitation:
      en: The source abstract gives no count. In Hillis’s prospective acute-stroke series, all patients with aphasia or neglect among 44 subcortical-only DWI infarcts also had cortical hypoperfusion. This supports an indirect cortical mechanism; the six reported recoveries after reperfusion concerned aphasia and cannot establish the same response for neglect.
      fr: Le résumé source ne précise pas l’effectif. Dans la série prospective d’AVC aigus de Hillis, tous les patients avec aphasie ou négligence parmi 44 infarctus uniquement sous-corticaux en diffusion avaient aussi une hypoperfusion corticale. Cela soutient un mécanisme cortical indirect; les six récupérations rapportées après reperfusion concernaient l’aphasie et n’établissent pas la même réponse pour la négligence.
    mapping_note:
      en: Whole right putamen and caudate come from the reference segmentation; the pulvinar comes from the histological reference.
