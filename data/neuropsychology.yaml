  - id: alexia-stroke-comparison
    deficit: alexia
    title: {en: Pure and hemianopic alexia after stroke, fr: Alexie pure et hémianopsique après AVC}
    network: {en: Left posterior fusiform word recognition, fr: Reconnaissance des mots fusiforme postérieure gauche}
    laterality: left
    finding:
      en: Six pure-alexia and seven hemianopic-alexia patients shared medial left occipital damage, but the pure-alexia group had additional posterior fusiform and adjacent injury. Impaired whole-word recognition was distinguished from difficulty reading lines of text associated with visual-field loss.
      fr: Six patients avec alexie pure et sept avec alexie hémianopsique partageaient une atteinte occipitale médiale gauche, mais le groupe avec alexie pure avait une atteinte fusiforme postérieure et adjacente supplémentaire. Le trouble de reconnaissance des mots entiers était distingué de la difficulté à lire des lignes de texte associée à la perte du champ visuel.
    limitation:
      en: The 13 patients were selected as contrasting behavioural examples. Intermediate profiles may form a continuum; the comparison does not establish a universal diagnostic boundary or show that every acquired reading disorder has the same lesion.
      fr: Les 13 patients étaient sélectionnés comme exemples comportementaux contrastés. Les profils intermédiaires peuvent former un continuum; cette comparaison n’établit pas de frontière diagnostique universelle et ne montre pas que tous les troubles acquis de lecture partagent la même lésion.
    mapping_note:
      en: The whole left fusiform parcel marks the additional territory in the pure-alexia group. It does not isolate the posterior cluster or functional word-form area and does not display the shared medial occipital or underlying white-matter damage.
      fr: La parcelle fusiforme gauche entière repère le territoire supplémentaire du groupe avec alexie pure. Elle n’isole pas l’amas postérieur ni l’aire fonctionnelle de la forme des mots et n’affiche pas les atteintes occipitales médiales communes ni la substance blanche sous-jacente.
    mappings:
      - {region: 'destrieux:left:21', source_name: G_oc-temp_lat-fusifor}
    evidence:
      - {reference: leff-2006, role: supporting}

  - id: decision-ventromedial
    deficit: decision-making
    title: {en: Weighing future consequences, fr: Peser les conséquences futures}
    network: {en: Ventromedial prefrontal valuation system, fr: Système de valorisation préfrontal ventromédian}
    laterality: bilateral
    finding:
      en: On a new task simulating real-life decisions under uncertainty, reward and punishment, patients with ventromedial prefrontal damage, unlike controls, seemed oblivious to future consequences and guided by immediate prospects only. In a 344-patient lesion map, value-based decision-making deficits localized to ventromedial prefrontal and orbitofrontal cortex, apart from cognitive control.
      fr: Dans une nouvelle tâche simulant les décisions de la vie réelle sous incertitude, avec récompenses et punitions, les patients avec atteinte préfrontale ventromédiane, contrairement aux témoins, semblaient ignorer les conséquences futures et n’être guidés que par les perspectives immédiates. Dans une cartographie lésionnelle de 344 patients, les déficits de décision fondée sur la valeur se localisaient au cortex préfrontal ventromédian et orbitofrontal, à part du contrôle cognitif.
    limitation:
      en: The 1994 abstract gives no sample size. Fellows and Farah later found that dorsolateral frontal damage also impaired the Iowa gambling task, and that the ventromedial impairment was largely explained by a reversal-learning deficit.
      fr: Le résumé de 1994 n’indique pas l’effectif. Fellows et Farah ont ensuite montré qu’une atteinte frontale dorsolatérale altérait aussi la tâche de jeu de l’Iowa, et que le déficit ventromédian s’expliquait largement par un trouble de l’apprentissage par inversion.
    mapping_note:
      en: The gyrus rectus and medial orbital sulcus approximate ventromedial prefrontal cortex on each side. The supporting studies’ lesion maps do not follow these parcel borders.
      fr: Le gyrus droit et le sillon orbitaire médial représentent approximativement le cortex préfrontal ventromédian de chaque côté. Les cartes lésionnelles des études à l’appui ne suivent pas ces limites de parcelles.
    mappings:
      - {region: 'destrieux:left:31', source_name: G_rectus}
      - {region: 'destrieux:right:31', source_name: G_rectus}
      - {region: 'destrieux:left:64', source_name: S_orbital_med-olfact}
      - {region: 'destrieux:right:64', source_name: S_orbital_med-olfact}
    evidence:
      - {reference: bechara-1994, role: supporting}
      - {reference: glascher-2012, role: supporting}
      - {reference: fellows-2005, role: qualifying}

  - id: amnesia-fornix
    deficit: amnesia
    title: {en: Learning and recall after fornix interruption, fr: Apprentissage et rappel après interruption du fornix}
    network: {en: Hippocampal–diencephalic memory pathway, fr: Voie mnésique hippocampo-diencéphalique}
    laterality: bilateral
    finding:
      en: Among 12 people operated for a third-ventricle colloid cyst, bilateral interruption of the fornix on MRI, present in three, was the only consistent predictor of poor learning and recall, with recognition less impaired.
      fr: Chez 12 personnes opérées d’un kyste colloïde du troisième ventricule, l’interruption bilatérale du fornix à l’IRM, présente chez trois, était le seul prédicteur constant d’un apprentissage et d’un rappel déficitaires, la reconnaissance étant moins atteinte.
    limitation:
      en: Three affected cases in a surgical series. Cyst and surgery may have injured neighbouring diencephalic structures that MRI did not resolve.
