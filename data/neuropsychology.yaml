      en: A modest sample. Berti et al. associated denial of hemiplegia with lesions of premotor areas 6 and 44, motor area 4 and somatosensory cortex, and the function of the posterior insula remains debated.
      fr: Échantillon modeste. Berti et al. associaient le déni de l’hémiplégie à des lésions des aires prémotrices 6 et 44, de l’aire motrice 4 et du cortex somatosensoriel, et la fonction de l’insula postérieure reste discutée.
