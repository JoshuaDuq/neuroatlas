    network: {en: Right posterior insula, fr: Insula postérieure droite}
    laterality: right
    finding:
      en: In 27 stroke patients, the right posterior insula was commonly damaged in those with anosognosia for hemiplegia and significantly less involved in hemiparetic patients without it.
      fr: Chez 27 patients avec AVC, l’insula postérieure droite était souvent lésée chez ceux avec anosognosie de l’hémiplégie et significativement moins atteinte chez les hémiparétiques sans anosognosie.
    limitation:
      en: This small case–control sample does not isolate a universal awareness site. Berti implicated premotor and somatosensory regions, while Pacella’s larger study implicated grey-matter lesions together with disconnection of motor, limbic and attention systems.
      fr: Ce petit échantillon cas-témoins n’isole pas de site universel de la conscience du déficit. Berti impliquait des régions prémotrices et somatosensorielles, tandis que la plus grande étude de Pacella impliquait des lésions de substance grise avec déconnexion de systèmes moteurs, limbiques et attentionnels.
    mapping_note:
      en: The long insular gyrus and central insular sulcus parcel covers the posterior insula. The lesion overlap does not follow its border.
      fr: La parcelle du gyrus long et du sillon central de l’insula couvre l’insula postérieure. Le chevauchement lésionnel ne suit pas sa limite.
