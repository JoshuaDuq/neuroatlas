      fr: Les lésions bilatérales des noyaux lenticulaires, du globus pallidus ou du putamen, causaient un syndrome parkinsonien dans 19 % et une dystonie-parkinsonisme dans 6 % des cas publiés; le syndrome parkinsonien restait rare au total (6 %).
    limitation:
