      en: Whole putamina are coarse landmarks on each side, not the significant voxels or a requirement for bilateral injury. Their overlap with the hemiparesis landmarks does not mean that the same voxels or mechanisms underlie both impairments.
      fr: Les putamens entiers sont des repères approximatifs de chaque côté, pas les voxels significatifs ni une exigence de lésion bilatérale. Leur chevauchement avec les repères de l’hémiparésie ne signifie pas que les mêmes voxels ou mécanismes sous-tendent les deux troubles.
