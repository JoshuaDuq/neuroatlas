  - id: cortical-deafness-bitemporal
    deficit: cortical-deafness
    title: {en: Bilateral auditory cortical injury, fr: Atteinte corticale auditive bilatérale}
    network: {en: Bilateral central auditory pathways, fr: Voies auditives centrales bilatérales}
    laterality: bilateral
    finding:
      en: An acute left temporal infarct after an old right infarct damaged both Heschl gyri, causing profound hearing loss despite normal otoacoustic emissions and brainstem responses. Sound detection partly recovered, but no presented monosyllable was discriminated at three or ten months.
      fr: Un infarctus temporal gauche aigu après un ancien infarctus droit atteignait les deux gyri de Heschl, entraînant une surdité profonde malgré des otoémissions et des réponses du tronc cérébral normales. La détection sonore récupérait partiellement, mais aucun monosyllabe présenté n’était discriminé à trois ou dix mois.
    limitation:
      en: This is one cortical case. A separate three-patient series found bilateral auditory radiation damage, showing that severe central deafness can also arise from subcortical disconnection.
      fr: Il s’agit d’un seul cas cortical. Une série distincte de trois patients trouvait une atteinte bilatérale des radiations auditives, montrant qu’une surdité centrale sévère peut aussi résulter d’une déconnexion sous-corticale.
    mapping_note:
      en: Transverse temporal parcels mark Heschl’s gyri on each side, not the full infarcts or auditory radiations. This case involved bilateral injury.
      fr: Les parcelles temporales transverses représentent les gyri de Heschl de chaque côté, sans délimiter les infarctus entiers ni les radiations auditives. Ce cas comportait une atteinte bilatérale.
    mappings:
      - {region: 'destrieux:left:33', source_name: G_temp_sup-G_T_transv}
      - {region: 'destrieux:right:33', source_name: G_temp_sup-G_T_transv}
    evidence:
      - {reference: lachowska-2021, role: supporting}
      - {reference: akiyoshi-2021, role: qualifying}

  - id: auditory-agnosia-temporoparietal
