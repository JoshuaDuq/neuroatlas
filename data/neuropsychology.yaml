    deficit: speech-apraxia
    title: {en: Posterior inferior frontal gyrus in acute stroke, fr: Gyrus frontal inférieur postérieur dans l’AVC aigu}
    network: {en: Left posterior inferior frontal cortex, fr: Cortex frontal inférieur postérieur gauche}
    laterality: left
    finding:
      en: In 40 acute left-hemisphere strokes with insular damage and 40 without, apraxia of speech was associated with structural damage or hypoperfusion of the left posterior inferior frontal gyrus, not with the insula.
      fr: Chez 40 AVC gauches aigus avec atteinte insulaire et 40 sans, l’apraxie de la parole était associée à une lésion structurelle ou à une hypoperfusion du gyrus frontal inférieur postérieur gauche, et non à l’insula.
