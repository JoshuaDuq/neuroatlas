  - id: aphasia-naming
    deficit: aphasia
    title: {en: Naming pictures, fr: Dénomination d’images}
    network: {en: Left middle temporal lexical retrieval system, fr: Système de récupération lexicale temporal moyen gauche}
    laterality: left
    finding:
      en: Boston Naming Test scores mapped to a left peri-Sylvian network; once visual recognition and motor speech were controlled, the critical region narrowed to the mid-posterior middle temporal gyrus and its underlying white matter.
      fr: Les scores au Boston Naming Test correspondaient à un réseau périsylvien gauche; après contrôle de la reconnaissance visuelle et de la parole motrice, la région critique se réduisait au gyrus temporal moyen mi-postérieur et à sa substance blanche sous-jacente.
    limitation:
      en: Single chronic left-hemisphere strokes in right-handed native English speakers, excluding clinical neglect and visual agnosia. Anterior temporal contributions reported by other studies were not the critical site here.
      fr: AVC gauches uniques en phase chronique chez des droitiers de langue maternelle anglaise, sans négligence clinique ni agnosie visuelle. Les contributions temporales antérieures rapportées par d’autres études n’étaient pas le site critique ici.
    mapping_note:
      en: The whole middle temporal parcel is shown. The finding concerns its middle and posterior portions and the white matter beneath, which has no parcel.
      fr: La parcelle temporale moyenne entière est affichée. Le résultat concerne ses portions moyenne et postérieure et la substance blanche sous-jacente, qui n’a pas de parcelle.
