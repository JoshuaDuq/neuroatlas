      fr: 36 patients avec premier AVC cortical sélectionnés pour parésie de la main; 14 avaient un trouble de reconnaissance tactile des objets, sept récupérant et sept restant déficitaires à neuf mois. Les analyses lésionnelles comprenaient 35 patients; les contrastes voxel par voxel de déconnexion utilisaient 21 cas avec lésion droite.

  - id: fischer-2016
    title: A human brain network derived from coma-causing brainstem lesions
    authors: Fischer DB, Boes AD, Demertzi A, Evrard HC, Laureys S, Edlow BL, Liu H, Saper CB, Pascual-Leone A, Fox MD, Geerling JC
    year: 2016
    journal: Neurology
    doi: 10.1212/wnl.0000000000003404
    pmid: '27815400'
    method: lesion-mapping
    scope: full-text
    population:
      en: 12 coma-causing brainstem lesions and 24 control brainstem lesions assembled from clinical and published cases, supplemented by normative functional connectivity and a separate disorders-of-consciousness dataset.
      fr: 12 lésions du tronc cérébral causant un coma et 24 lésions témoins réunies à partir de cas cliniques et publiés, complétées par une connectivité fonctionnelle normative et un jeu de données distinct sur les troubles de la conscience.

  - id: corp-2019
    title: Network localization of cervical dystonia based on causal brain lesions
    authors: Corp DT, Joutsa J, Darby RR, Delnooz CCS, van de Warrenburg BPC, Cooke D, Prudente CN, Ren J, Reich MM, Batla A, Bhatia KP, Jinnah HA, Liu H, Fox MD
    year: 2019
    journal: Brain
    doi: 10.1093/brain/awz112
    pmid: '31099831'
    method: lesion-mapping
    scope: abstract
    population:
      en: 25 published cases of lesion-induced cervical dystonia mapped using connectivity from 1000 healthy participants; additional connectivity comparison of 39 idiopathic cervical-dystonia patients and 37 controls.
      fr: 25 cas publiés de dystonie cervicale d’origine lésionnelle cartographiés avec la connectivité de 1000 participants sains; comparaison supplémentaire de connectivité entre 39 patients avec dystonie cervicale idiopathique et 37 témoins.

  - id: laganiere-2016
    title: Network localization of hemichorea-hemiballismus
    authors: Laganiere S, Boes AD, Fox MD
    year: 2016
    journal: Neurology
    doi: 10.1212/wnl.0000000000002741
    pmid: '27170566'
    method: lesion-mapping
    scope: abstract
    population:
      en: 29 published stroke-related hemichorea-hemiballismus lesions, tested with healthy-participant connectivity and lesion controls, with replication in ten additional cases.
      fr: 29 lésions d’AVC associées à une hémichorée-hémiballisme, étudiées avec une connectivité de participants sains et des lésions témoins, avec réplication dans dix cas supplémentaires.

  - id: karoam-2025
    title: Neuroanatomy and lesion networks of central poststroke pain
    authors: Karoam HA, Bruss J, Champoux K, Lemos MD, Faillenot I, Ciampi de Andrade D, Hwang K, Bayman E, Vaidya J, Gordon EM, Tranel D, Geerling JC, Boes AD
    year: 2025
    journal: Pain
    doi: 10.1097/j.pain.0000000000003618
    pmid: '40839673'
    method: lesion-mapping
    scope: full-text
    population:
      en: Discovery cohort of 37 central post-stroke pain cases and 96 stroke comparators, plus an independent validation cohort of 35 pain cases and 27 comparators; 72 pain cases and 123 comparators in total.
      fr: Cohorte de découverte de 37 cas de douleur centrale post-AVC et 96 comparateurs avec AVC, plus une cohorte indépendante de validation de 35 cas douloureux et 27 comparateurs; au total, 72 cas douloureux et 123 comparateurs.

  - id: adolphs-2005
    title: A mechanism for impaired fear recognition after amygdala damage
    authors: Adolphs R, Gosselin F, Buchanan TW, Tranel D, Schyns P, Damasio AR
    year: 2005
    journal: Nature
    doi: 10.1038/nature03086
    pmid: '15635411'
    method: case-report
    scope: abstract
    population:
      en: Follow-up of patient S.M. with bilateral amygdala damage, examining facial information use and eye fixation; the same patient was reported in 1994.
      fr: Suivi de la patiente S.M. avec lésions amygdaliennes bilatérales, étudiant l’utilisation de l’information faciale et la fixation des yeux; cette patiente était déjà rapportée en 1994.

  - id: hillis-2002
    title: 'Subcortical aphasia and neglect in acute stroke: the role of cortical hypoperfusion'
    authors: Hillis AE, Wityk RJ, Barker PB, Beauchamp NJ, Gailloud P, Murphy K, Cooper O, Metter EJ
    year: 2002
    journal: Brain
    doi: 10.1093/brain/awf113
    pmid: '11960898'
    method: lesion-mapping
    scope: abstract
    population:
      en: 115 consecutive stroke patients assessed within 24 hours with diffusion and perfusion MRI and language/neglect testing; 44 had DWI lesions restricted to subcortical structures. Six reperfusion-associated recoveries reported in the abstract were aphasia cases.
      fr: 115 patients consécutifs avec AVC évalués dans les 24 heures par IRM de diffusion et de perfusion et tests de langage/négligence; 44 avaient des lésions de diffusion limitées aux structures sous-corticales. Les six récupérations associées à la reperfusion rapportées dans le résumé étaient des cas d’aphasie.

  - id: pacella-2019
    title: Anosognosia for hemiplegia as a tripartite disconnection syndrome
    authors: Pacella V, Foulon C, Jenkinson PM, Scandola M, Bertagnoli S, Avesani R, Fotopoulou A, Moro V, Thiebaut de Schotten M
    year: 2019
    journal: eLife
    doi: 10.7554/elife.46075
    pmid: '31383259'
    method: lesion-mapping
    scope: full-text
    population:
      en: 174 imaged patients with first right-hemisphere stroke and severe left-arm paralysis, 95 with anosognosia and 79 without; disconnection probabilities estimated using diffusion data from ten healthy controls.
      fr: 174 patients imagés avec premier AVC droit et paralysie sévère du bras gauche, 95 avec anosognosie et 79 sans; probabilités de déconnexion estimées à partir de données de diffusion de dix témoins sains.

  - id: monai-2020
    title: Multiple Network Disconnection in Anosognosia for Hemiplegia
    authors: Monai E, Bernocchi F, Bisio M, Bisogno AL, Salvalaggio A, Corbetta M
    year: 2020
    journal: Frontiers in Systems Neuroscience
    doi: 10.3389/fnsys.2020.00021
    pmid: '32410965'
    method: lesion-mapping
    scope: full-text
    population:
      en: 28 published right-stroke anosognosia cases reconstructed from lesion images, compared with 35 registry stroke patients with motor impairment. Sixteen control lesions were left-sided and flipped rightward; right-only control analyses were also reported.
      fr: 28 cas publiés d’anosognosie après AVC droit reconstruits à partir d’images lésionnelles, comparés à 35 patients de registre avec AVC et déficit moteur. Seize lésions témoins étaient gauches et retournées à droite; des analyses limitées aux témoins droits étaient aussi rapportées.

  - id: sihvonen-2024
    title: Focal Brain Lesions Causing Acquired Amusia Map to a Common Brain Network
    authors: Sihvonen AJ, Ferguson MA, Chen V, Soinila S, Särkämö T, Joutsa J
    year: 2024
    journal: Journal of Neuroscience
    doi: 10.1523/jneurosci.1922-23.2024
    pmid: '38423761'
    method: lesion-mapping
    scope: full-text
    population:
      en: 24 published amusia cases and a prospective validation sample of 97 right-handed Finnish stroke patients, 63 with amusia and 34 without, assessed with music-perception and language tests. The Finnish recruitment cohorts were also used in earlier amusia work.
      fr: 24 cas publiés d’amusie et un échantillon prospectif de validation de 97 patients finlandais droitiers avec AVC, 63 avec amusie et 34 sans, évalués par tests de perception musicale et de langage. Les cohortes finlandaises de recrutement étaient aussi utilisées dans des travaux antérieurs sur l’amusie.

  - id: graff-radford-2014
    title: The neuroanatomy of pure apraxia of speech in stroke
    authors: Graff-Radford J, Jones DT, Strand EA, Rabinstein AA, Duffy JR, Josephs KA
    year: 2014
    journal: Brain and Language
    doi: 10.1016/j.bandl.2014.01.004
    pmid: '24556336'
    method: case-series
    scope: full-text
    population:
      en: Seven selected ischemic-stroke patients assessed 1–17 days after onset; five had pure apraxia of speech and two equivocal aphasia, with no significant dysarthria or nonverbal oral apraxia.
      fr: Sept patients sélectionnés avec AVC ischémique évalués 1 à 17 jours après le début; cinq avaient une apraxie pure de la parole et deux une aphasie équivoque, sans dysarthrie significative ni apraxie orale non verbale.

  - id: leff-2006
    title: Structural anatomy of pure and hemianopic alexia
    authors: Leff AP, Spitsyna G, Plant GT, Wise RJ
    year: 2006
    journal: Journal of Neurology, Neurosurgery, and Psychiatry
    doi: 10.1136/jnnp.2005.086983
    pmid: '16801352'
    method: lesion-mapping
    scope: full-text
    population:
      en: Six patients with pure alexia and seven with hemianopic alexia after left occipital stroke, selected from the behavioural extremes of a larger rehabilitation sample and compared with structural MRI lesion maps.
      fr: Six patients avec alexie pure et sept avec alexie hémianopsique après AVC occipital gauche, sélectionnés aux extrêmes comportementaux d’un échantillon de réadaptation plus large et comparés par cartographie lésionnelle en IRM structurelle.

  - id: duricy-2025
    title: 'The role of the intraparietal sulcus in numeracy: A review of parietal lesion cases'
    authors: Duricy E, Durisko C, Fiez JA
    year: 2025
    journal: Behavioural Brain Research
    doi: 10.1016/j.bbr.2025.115453
    pmid: '39892656'
    method: meta-analysis
    scope: full-text
    population:
      en: Pooled analysis of 27 published left-parietal lesion cases, eight classified as intraparietal and 19 as other parietal; numeracy tasks varied across reports, with spherical lesion approximations and exploratory activation-likelihood analysis.
      fr: Analyse groupée de 27 cas publiés avec lésion pariétale gauche, huit classés intrapariétaux et 19 autres pariétaux; les tâches numériques variaient entre rapports, avec approximations lésionnelles sphériques et analyse exploratoire de vraisemblance d’activation.

associations:
  - id: aphasia-comprehension
    deficit: aphasia
    title: {en: Word and sentence comprehension, fr: Compréhension des mots et des phrases}
    network: {en: Left temporal language system, fr: Système langagier temporal gauche}
    laterality: left
    finding:
      en: Posterior middle temporal damage was associated with impaired comprehension; other left temporal and frontal sites also contributed.
      fr: Les lésions temporales moyennes postérieures étaient associées à une compréhension altérée; d’autres sites temporaux et frontaux gauches contribuaient aussi.
    limitation:
      en: Task-specific findings in chronic stroke; this does not localize every aphasia subtype or establish individual language dominance.
      fr: Résultats liés aux tâches dans l’AVC chronique; ils ne localisent pas tous les sous-types d’aphasie ni la dominance langagière individuelle.
    mapping_note:
      en: The whole middle temporal parcel is shown as an anatomical guide. The study implicated its posterior portion and underlying white matter.
      fr: La parcelle temporale moyenne entière sert de repère anatomique. L’étude impliquait sa portion postérieure et la substance blanche sous-jacente.
    mappings:
      - {region: 'destrieux:left:38', source_name: G_temporal_middle}
    evidence:
      - {reference: dronkers-2004, role: supporting}

  - id: hippocampal-amnesia
    deficit: amnesia
    title: {en: Learning new information, fr: Apprentissage de nouvelles informations}
    network: {en: Bilateral hippocampal memory system, fr: Système mnésique hippocampique bilatéral}
    laterality: bilateral
    finding:
      en: R.B. had persistent anterograde amnesia and bilateral CA1 injury, with little retrograde loss.
      fr: R.B. présentait une amnésie antérograde persistante et une atteinte bilatérale de CA1, avec peu de perte rétrograde.
    limitation:
      en: A single clinicopathological case; it does not establish the effects of isolated unilateral injury or all causes of amnesia.
      fr: Cas clinicopathologique unique; il ne définit ni les effets d’une atteinte unilatérale isolée ni toutes les causes d’amnésie.
    mapping_note:
      en: Both whole hippocampi are available as anatomical guides. These coarse structures do not delineate the reported CA1 lesion.
      fr: Les deux hippocampes entiers servent de repères anatomiques. Ces structures globales ne délimitent pas la lésion de CA1 rapportée.
    mappings:
      - {region: 'aseg:left:17', source_name: Left-Hippocampus}
      - {region: 'aseg:right:53', source_name: Right-Hippocampus}
    evidence:
      - {reference: zola-morgan-1986, role: supporting}

  - id: neglect-perceptual
    deficit: neglect
    title: {en: Perceptual and visuospatial neglect, fr: Négligence perceptive et visuospatiale}
    network: {en: Right parietal spatial attention system, fr: Système attentionnel spatial pariétal droit}
    laterality: right
    finding:
      en: The perceptual/visuospatial component was associated with right inferior parietal injury.
      fr: La composante perceptive/visuospatiale était associée à une atteinte pariétale inférieure droite.
    limitation:
      en: One component of neglect; exploratory, object-centered, and disconnection effects need separate interpretation.
      fr: Une composante de la négligence; exploration, traitement centré sur l’objet et déconnexion demandent une interprétation distincte.
    mapping_note:
      en: Angular and supramarginal parcels approximate the inferior parietal lobule; their boundaries are not the study’s lesion map.
      fr: Les parcelles angulaire et supramarginale représentent approximativement le lobule pariétal inférieur; leurs limites ne sont pas la carte lésionnelle de l’étude.
    mappings:
      - {region: 'destrieux:right:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
    evidence:
      - {reference: verdon-2010, role: supporting}

  - id: neglect-exploratory
    deficit: neglect
    title: {en: Exploratory and visuomotor neglect, fr: Négligence exploratoire et visuomotrice}
    network: {en: Right frontal spatial exploration system, fr: Système d’exploration spatiale frontal droit}
    laterality: right
    finding:
      en: Exploratory/visuomotor deficits were associated with right dorsolateral prefrontal injury.
      fr: Les déficits exploratoires/visuomoteurs étaient associés à une atteinte préfrontale dorsolatérale droite.
    limitation:
      en: Component-specific association in right-hemisphere stroke, not a complete neglect network.
      fr: Association propre à une composante dans l’AVC droit, sans délimitation d’un réseau complet de négligence.
    mapping_note:
      en: The middle frontal gyrus is a broad anatomical guide to dorsolateral prefrontal cortex, not an equivalent functional boundary.
      fr: Le gyrus frontal moyen est un repère anatomique large du cortex préfrontal dorsolatéral, sans équivalence des limites fonctionnelles.
    mappings:
      - {region: 'destrieux:right:15', source_name: G_front_middle}
    evidence:
      - {reference: verdon-2010, role: supporting}

  - id: apraxia-hand
    deficit: apraxia
    title: {en: Imitating hand postures, fr: Imitation de postures manuelles}
    network: {en: Left parietal praxis system, fr: Système praxique pariétal gauche}
    laterality: left
    finding:
      en: Hand imitation impairment was associated with inferior parietal and temporoparieto-occipital injury.
      fr: L’imitation manuelle altérée était associée à une atteinte pariétale inférieure et temporopariéto-occipitale.
    limitation:
      en: Achilles et al. found no consistent hand/finger anatomical dissociation in a larger sample. Body-part specificity remains disputed.
      fr: Achilles et al. n’ont pas trouvé de dissociation anatomique main/doigts cohérente dans un échantillon plus large. Cette spécificité reste discutée.
    mapping_note:
      en: The inferior parietal parcels provide approximate landmarks; the reported lesions extend beyond these parcels.
      fr: Les parcelles pariétales inférieures fournissent des repères approximatifs; les lésions rapportées dépassent ces parcelles.
    mappings:
      - {region: 'destrieux:left:25', source_name: G_pariet_inf-Angular}
      - {region: 'destrieux:left:26', source_name: G_pariet_inf-Supramar}
    evidence:
      - {reference: goldenberg-2006, role: supporting}
      - {reference: achilles-2017, role: qualifying}

  - id: apraxia-finger
    deficit: apraxia
    title: {en: Imitating finger postures, fr: Imitation de postures digitales}
    network: {en: Left frontal praxis system, fr: Système praxique frontal gauche}
    laterality: left
    finding:
      en: Finger imitation impairment was associated with anterior lesions including the inferior frontal operculum.
      fr: L’imitation digitale altérée était associée à des lésions antérieures incluant l’opercule frontal inférieur.
    limitation:
      en: The larger Achilles study challenges a selective hand/finger dissociation. This finding is not a universal apraxia localization.
      fr: L’étude plus large d’Achilles remet en question une dissociation sélective main/doigts. Ce résultat ne localise pas universellement l’apraxie.
    mapping_note:
      en: The opercular parcel is an anatomical landmark, not a reconstruction of the individual lesions.
      fr: La parcelle operculaire est un repère anatomique, sans reconstruction des lésions individuelles.
    mappings:
      - {region: 'destrieux:left:12', source_name: G_front_inf-Opercular}
    evidence:
      - {reference: goldenberg-2006, role: supporting}
      - {reference: achilles-2017, role: qualifying}

  - id: agnosia-face
    deficit: agnosia
    title: {en: Facial configuration in prosopagnosia, fr: Configuration faciale dans la prosopagnosie}
    network: {en: Right ventral visual recognition system, fr: Système de reconnaissance visuelle ventral droit}
    laterality: right
    finding:
      en: Four patients with right fusiform face-area involvement had impaired discrimination of facial feature positions.
      fr: Quatre patients avec atteinte de l’aire fusiforme des visages droite discriminaient mal la position des traits du visage.
    limitation:
      en: Small case series about one aspect of acquired face perception; it does not explain all visual agnosias or developmental prosopagnosia.
      fr: Petite série sur un aspect de la perception faciale acquise; elle n’explique ni toutes les agnosies visuelles ni la prosopagnosie développementale.
    mapping_note:
      en: The whole fusiform parcel is shown. The functionally defined face area occupies only part of it and varies between individuals.
      fr: La parcelle fusiforme entière est affichée. L’aire fonctionnelle des visages n’en occupe qu’une partie et varie selon les individus.
    mappings:
      - {region: 'destrieux:right:21', source_name: G_oc-temp_lat-fusifor}
    evidence:
      - {reference: barton-2002, role: supporting}

  - id: executive-control
    deficit: executive
    title: {en: Inhibition and set shifting, fr: Inhibition et flexibilité cognitive}
    network: {en: Prefrontal and cingulate cognitive control system, fr: Système de contrôle cognitif préfrontal et cingulaire}
    laterality: bilateral
    finding:
      en: Cognitive-control impairments implicated dorsolateral prefrontal and anterior cingulate regions, distinct from ventral valuation findings.
      fr: Les déficits de contrôle cognitif impliquaient des régions préfrontales dorsolatérales et cingulaires antérieures, distinctes des résultats ventraux liés à la valeur.
    limitation:
      en: Test and subregion effects differ; neither hemisphere’s entire frontal cortex is a single executive center.
      fr: Les effets diffèrent selon le test et la sous-région; le cortex frontal entier d’aucun hémisphère ne constitue un centre exécutif unique.
    mapping_note:
      en: Bilateral middle frontal and anterior cingulate parcels are broad navigation landmarks. They do not reproduce task-specific lesion clusters or imply symmetric effects.
      fr: Les parcelles frontales moyennes et cingulaires antérieures bilatérales sont des repères larges. Elles ne reproduisent pas les foyers lésionnels par tâche ni des effets symétriques.
    mappings:
      - {region: 'destrieux:left:15', source_name: G_front_middle}
      - {region: 'destrieux:right:15', source_name: G_front_middle}
      - {region: 'destrieux:left:6', source_name: G_and_S_cingul-Ant}
      - {region: 'destrieux:right:6', source_name: G_and_S_cingul-Ant}
    evidence:
      - {reference: glascher-2012, role: supporting}

  - id: aphasia-repetition
    deficit: aphasia
    title: {en: Repeating words and sentences, fr: Répétition de mots et de phrases}
    network: {en: Left dorsal language pathway, fr: Voie langagière dorsale gauche}
    laterality: left
    finding:
      en: Across 25 pooled lesion-mapping studies, repetition-selective deficits arose only from lesions involving the posterior superior temporal gyrus.
      fr: Sur 25 études de cartographie lésionnelle regroupées, les déficits sélectifs de répétition ne survenaient que pour des lésions impliquant le gyrus temporal supérieur postérieur.
    limitation:
      en: Pooled coordinates from post-stroke aphasia. Repetition is one task among several, and pooling across studies cannot resolve subregions within a gyrus.
      fr: Coordonnées regroupées issues d’aphasies post-AVC. La répétition n’est qu’une tâche parmi d’autres, et le regroupement entre études ne peut pas distinguer les sous-régions d’un gyrus.
    mapping_note:
      en: The whole lateral superior temporal parcel is shown. The pooled result concerns its posterior portion.
      fr: La parcelle temporale supérieure latérale entière est affichée. Le résultat regroupé concerne sa portion postérieure.
    mappings:
      - {region: 'destrieux:left:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: na-2022, role: supporting}

  - id: aphasia-production
    deficit: aphasia
    title: {en: Speaking with comprehension preserved, fr: Parole avec compréhension préservée}
    network: {en: Left insular and motor speech system, fr: Système insulaire et moteur de la parole (gauche)}
    laterality: left
    finding:
      en: Damage to insular and motor areas impaired speech with comprehension preserved; frontal lesions severely impaired speaking with relatively good comprehension.
      fr: Les lésions des aires insulaires et motrices altéraient la parole en préservant la compréhension; les lésions frontales altéraient sévèrement la parole avec une compréhension relativement bonne.
    limitation:
      en: The dissociation compares pooled maps for different language functions; it does not make these parcels a speech output system. The meta-analysis pooled reported peak coordinates, not lesion maps.
      fr: La dissociation compare des cartes regroupées pour différentes fonctions langagières; elle ne fait pas de ces parcelles un système de production de la parole. La méta-analyse regroupait des coordonnées de pics publiées, et non des cartes lésionnelles.
    mapping_note:
      en: Whole insular and precentral parcels are shown. The pooled production and fluency peaks were labelled insula and precentral gyrus; their clusters do not follow parcel borders.
      fr: Les parcelles insulaires et précentrale entières sont affichées. Les pics regroupés de production et de fluence étaient attribués à l’insula et au gyrus précentral; leurs amas ne suivent pas les limites des parcelles.
    mappings:
      - {region: 'destrieux:left:17', source_name: G_Ins_lg_and_S_cent_ins}
      - {region: 'destrieux:left:18', source_name: G_insular_short}
      - {region: 'destrieux:left:29', source_name: G_precentral}
    evidence:
      - {reference: na-2022, role: supporting}

  - id: neglect-egocentric
    deficit: neglect
    title: {en: Neglect of one side of space, fr: Négligence d’un côté de l’espace}
    network: {en: Right perisylvian attention network, fr: Réseau attentionnel périsylvien droit}
    laterality: right
    finding:
      en: Egocentric neglect symptoms were associated with damage in a perisylvian network — precentral, postcentral, supramarginal and superior temporal gyri — and with subcortical damage.
      fr: Les symptômes de négligence égocentrée étaient associés à des lésions d’un réseau périsylvien — gyrus précentral, postcentral, supramarginal et temporal supérieur — et à des lésions sous-corticales.
    limitation:
      en: All included reports studied left visual neglect. Cortical associations varied with the tests; shared right white matter damage supported a disconnection account.
      fr: Tous les rapports inclus étudiaient la négligence visuelle gauche. Les associations corticales variaient selon les tests; les atteintes communes de la substance blanche droite étayaient une explication par déconnexion.
    mapping_note:
      en: Whole cortical parcels mark approximate locations. Subcortical and white matter findings are omitted; these parcels do not trace measured connections.
      fr: Les parcelles corticales entières repèrent des localisations approximatives. Les résultats sous-corticaux et de substance blanche sont omis; ces parcelles ne tracent pas des connexions mesurées.
    mappings:
      - {region: 'destrieux:right:29', source_name: G_precentral}
      - {region: 'destrieux:right:28', source_name: G_postcentral}
      - {region: 'destrieux:right:26', source_name: G_pariet_inf-Supramar}
      - {region: 'destrieux:right:34', source_name: G_temp_sup-Lateral}
    evidence:
      - {reference: chechlacz-2012, role: supporting}

  - id: neglect-allocentric
    deficit: neglect
    title: {en: Neglect of one side of each object, fr: Négligence d’un côté de chaque objet}
    network: {en: Right posterior temporo-parieto-occipital cortex, fr: Cortex temporo-pariéto-occipital postérieur droit}
    laterality: right
    finding:
      en: Allocentric symptoms were associated with right angular and middle temporal lesions. The analysis including line bisection also implicated middle occipital cortex.
      fr: Les symptômes allocentrés étaient associés à des lésions angulaires et temporales moyennes droites. L’analyse incluant la bissection de lignes impliquait aussi le cortex occipital moyen.
    limitation:
      en: Reports concerned left visual neglect; egocentric and allocentric symptoms often coexist. Line bisection is not a pure allocentric measure. Pooled lesion peaks do not define individual boundaries.
      fr: Les rapports concernaient la négligence visuelle gauche; les symptômes égocentrés et allocentrés coexistent souvent. La bissection de lignes n’est pas une mesure purement allocentrée. Les pics lésionnels regroupés ne définissent pas les limites individuelles.
    mapping_note:
      en: Whole parcels are shown for a result reported as overlapping likelihood clusters, which do not follow parcel borders.
