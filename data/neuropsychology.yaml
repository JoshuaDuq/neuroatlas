  - id: topographical-retrosplenial
    deficit: topographical-disorientation
    title: {en: Sense of direction between familiar places, fr: Sens de la direction entre lieux familiers}
    network: {en: Right retrosplenial and medial parietal cortex, fr: Cortex rétrosplénial et pariétal médial droit}
    laterality: right
    finding:
      en: Three patients with small haemorrhages from the right retrosplenial region into the medial parietal lobe could identify familiar buildings and landscapes but could not recall the direction from one familiar place to another.
