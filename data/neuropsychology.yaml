    finding:
      en: Neuronal loss in the anterior thalamic nuclei was found consistently only in alcoholics with Korsakoff amnesia, whereas the mammillary and mediodorsal thalamic nuclei degenerated substantially in amnesic and non-amnesic alcoholics with Wernicke’s encephalopathy alike.
      fr: La perte neuronale des noyaux thalamiques antérieurs n’était constante que chez les alcooliques avec amnésie de Korsakoff, alors que les noyaux mamillaires et médiodorsaux dégénéraient fortement chez les alcooliques amnésiques comme non amnésiques avec encéphalopathie de Wernicke.
    limitation:
      en: A post-mortem study of nutritional injury, not of a focal lesion. The mammillary bodies were damaged in both groups, so they mark the disease rather than the amnesia.
      fr: Étude post-mortem d’une atteinte nutritionnelle, et non d’une lésion focale. Les corps mamillaires étaient atteints dans les deux groupes; ils marquent donc la maladie plutôt que l’amnésie.
    mapping_note:
      en: The anteroventral nucleus is the anterior thalamic nucleus available on both sides; the mammillary nuclei are shown as the co-damaged, non-differentiating site.
      fr: Le noyau antéroventral est le noyau thalamique antérieur disponible des deux côtés; les noyaux mamillaires sont affichés comme site co-atteint mais non discriminant.
