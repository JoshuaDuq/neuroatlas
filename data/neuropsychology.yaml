  - id: abulia-caudate
    deficit: abulia
    title: {en: Loss of initiative after caudate lesions, fr: Perte d’initiative après lésion du noyau caudé}
    network: {en: Caudate nucleus and frontostriatal circuits, fr: Noyau caudé et circuits fronto-striataux}
    laterality: bilateral
    finding:
      en: Abulia was the most significant behavioural disturbance with caudate lesions (28%), sometimes alternating with disinhibition (11%). Caudate lesions rarely caused motor disorders, unlike lentiform lesions.
      fr: L’aboulie était le trouble comportemental le plus marqué avec les lésions du noyau caudé (28 %), alternant parfois avec une désinhibition (11 %). Les lésions caudées causaient rarement des troubles moteurs, contrairement aux lésions lenticulaires.
    limitation:
      en: A review of published cases, some with lesions extending into the internal capsule or periventricular white matter. Confusion was usually associated with intracerebral haemorrhage, and depression was a relatively non-specific finding.
      fr: Revue de cas publiés, dont certains avec des lésions étendues à la capsule interne ou à la substance blanche périventriculaire. La confusion était généralement associée à une hémorragie intracérébrale, et la dépression était une observation relativement non spécifique.
    mapping_note:
      en: Whole caudate nuclei are shown. The review did not separate head, body and tail.
      fr: Les noyaux caudés entiers sont affichés. La revue ne distinguait pas la tête, le corps et la queue.
    mappings:
      - {region: 'aseg:left:11', source_name: Left-Caudate}
      - {region: 'aseg:right:50', source_name: Right-Caudate}
    evidence:
      - {reference: bhatia-1994, role: supporting}

  - id: parkinsonism-nigra
    deficit: parkinsonism
    title: {en: Nigral cell loss in Parkinson’s disease, fr: Perte neuronale nigrique dans la maladie de Parkinson}
    network: {en: Substantia nigra pars compacta, fr: Substance noire pars compacta}
    laterality: bilateral
    finding:
      en: In 20 Parkinson’s disease cases, pigmented neurons of the pars compacta were lost exponentially, 45% in the first decade, most in the lateral ventral tier (91%), the opposite pattern to ageing. Loss at symptom onset was estimated at 68% in that tier.
      fr: Chez 20 cas de maladie de Parkinson, les neurones pigmentés de la pars compacta disparaissaient de façon exponentielle, 45 % la première décennie, surtout dans l’étage ventral latéral (91 %), à l’inverse du vieillissement. La perte au début des symptômes était estimée à 68 % dans cet étage.
    limitation:
      en: A degenerative process studied post-mortem, not a focal lesion, and counted on a single section per case. Other parkinsonian conditions showed different regional patterns.
      fr: Processus dégénératif étudié post-mortem, et non lésion focale, compté sur une seule coupe par cas. D’autres syndromes parkinsoniens montraient des profils régionaux différents.
    mapping_note:
      en: The compact part of the substantia nigra is shown from the histological reference. Its ventral tiers are not subdivided.
      fr: La pars compacta de la substance noire provient de la référence histologique. Ses étages ventraux ne sont pas subdivisés.
