  - id: locked-in-pontine
    deficit: locked-in
    title: {en: Ventral pontine injury with preserved consciousness, fr: Atteinte pontique ventrale avec conscience préservée}
    network: {en: Pontine descending motor pathways, fr: Voies motrices descendantes pontiques}
    laterality: bilateral
    finding:
      en: Seven patients with locked-in syndrome had ventral pontine injury and diffuse white-matter abnormalities on diffusion MRI, even with little or no supratentorial injury visible on conventional images.
      fr: Sept patients avec syndrome d’enfermement avaient une atteinte pontique ventrale et des anomalies diffuses de substance blanche en IRM de diffusion, malgré peu ou pas de lésion supratentorielle visible sur les images conventionnelles.
    limitation:
      en: This selected imaging series is not a universal lesion map. In the national vascular cohort, 39 of 49 patients with radiology reports had lesions outside the brainstem, and seven had no pontine injury. Entry required preserved orientation, not normal performance in every cognitive domain.
      fr: Cette série d’imagerie sélectionnée n’est pas une carte lésionnelle universelle. Dans la cohorte vasculaire nationale, 39 des 49 patients avec comptes rendus radiologiques avaient des lésions hors du tronc cérébral et sept n’avaient pas d’atteinte pontique. L’inclusion exigeait une orientation préservée, non des performances normales dans chaque domaine cognitif.
    mapping_note:
      en: The two pontine territories provide a coarse landmark for the pons. They do not isolate its ventral motor pathways, the tegmentum, or diffuse white-matter abnormalities.
      fr: Les deux territoires pontiques fournissent un repère approximatif du pont. Ils n’isolent ni ses voies motrices ventrales, ni le tegmentum, ni les anomalies diffuses de substance blanche.
